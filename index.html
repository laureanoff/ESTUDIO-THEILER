<style>
:root{color-scheme:dark;--bg:#070d1f;--tx:#e8eeff;--mut:#9aa7cc;--bd:rgba(255,255,255,.13);--card:rgba(255,255,255,.07);--card2:rgba(255,255,255,.12);--hd:rgba(255,255,255,.05);--nav:rgba(8,14,32,.62);--navh:rgba(255,255,255,.1);--pri:#2dd4bf;--prit:#031c19;
--red:rgba(255,93,108,.2);--redt:#ffa3ab;--grn:rgba(52,211,153,.2);--grnt:#7ee8bd;--blu:rgba(91,124,255,.24);--blut:#b4c4ff;--amb:rgba(255,200,87,.2);--ambt:#ffd98a;--org:rgba(255,150,70,.2);--orgt:#ffbb85;--gry:rgba(255,255,255,.1);--gryt:#cdd6f4;--vio:rgba(167,139,250,.22);--viot:#d3c8ff;--teal:rgba(45,212,191,.2);--tealt:#8ff0e1}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(55vw 45vh at 8% 0%,rgba(66,99,255,.38),transparent 65%),radial-gradient(45vw 45vh at 100% 25%,rgba(45,212,191,.2),transparent 65%),repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 30px),var(--bg)}

main{flex:1;min-width:0;padding:30px 34px}

.card,.glass{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 18px 40px rgba(0,0,0,.28)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}

button.b:hover{filter:brightness(1.08)}button.b:disabled{opacity:.4;cursor:not-allowed}
button.g{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:7px 12px;font:inherit;cursor:pointer}
button.g:hover{background:var(--card2)}button.dng{background:var(--red);color:var(--redt);border:1px solid rgba(255,93,108,.4);border-radius:10px;padding:7px 12px;font:inherit;cursor:pointer}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:18px;background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 18px 40px rgba(0,0,0,.25)}
table{border-collapse:collapse;width:100%;min-width:720px}

/* Clientes como legajos de vidrio */
.cl-grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));padding-top:6px}

.cl:hover{background:var(--card2);transform:translateY(-3px)}.cl.off{opacity:.55}

/* Ficha */
.ov{position:fixed;inset:0;z-index:50;background:rgba(3,7,18,.55);backdrop-filter:blur(4px);display:flex;justify-content:flex-end}
.dr{width:min(900px,100%);height:100%;overflow:auto;border-radius:22px 0 0 22px;background:rgba(12,19,42,.78);border:1px solid var(--bd);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);padding:22px 26px;box-shadow:-24px 0 60px rgba(0,0,0,.45)}
.dr.in{animation:slin .22s ease-out}@keyframes slin{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.drh{display:flex;gap:16px;align-items:center;margin-bottom:18px}.drh h2{margin:0;font-size:25px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;padding:5px;background:var(--hd);border:1px solid var(--bd);border-radius:14px}
.tabs button{background:none;border:0;color:var(--mut);padding:8px 14px;border-radius:10px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--card2);color:var(--tx)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.full{grid-column:1/-1}
.fgrid input,.fgrid select{width:100%}fieldset{border:0;padding:0;margin:0;min-width:0}
@media(max-width:700px){.app{flex-direction:column}nav{width:100%;height:auto;position:static;display:flex;gap:4px;overflow-x:auto;padding:12px;border-right:0;border-bottom:1px solid var(--bd)}nav h1{display:none}nav button{width:auto;white-space:nowrap;margin:0}.me{display:none}main{padding:16px}.dr{border-radius:0;padding:16px}h2{font-size:24px}}
.sm{padding:4px 9px!important;font-size:12.5px!important}
input.sm{margin-top:0;border-radius:8px}
label.g{display:inline-flex;align-items:center;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;cursor:pointer;margin:0}
label.g:hover{background:var(--card2)}
.cel{display:grid;gap:6px;min-width:200px;justify-items:start}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<body>
<div class="app">
<nav id="nav"></nav>
<main id="main"></main>

<script>
'use strict';
/* ===== Utilidades ===== */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS'}).format(n);
const fAR=iso=>iso.split('-').reverse().join('/');
const cuitF=c=>c.slice(0,2)+'-'+c.slice(2,10)+'-'+c.slice(10);
const uid=()=>Math.random().toString(36).slice(2,10);
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();

/* ===== Estados ===== */
const DOC={no_recibida:['No recibida','red'],recibida_fisica:['Recibida (papel)','grn'],recibida_digital:['Recibida (digital)','blu'],archivo_vinculado:['Archivo vinculado','teal'],pendiente_revision:['Pendiente de revisión','amb']};
const PROC={pendiente:['Pendiente','gry'],liquidado_con_documentacion:['Liquidado con factura','grn'],liquidado_sin_documentacion:['Liquidado SIN factura','org'],excluido:['Excluido','vio'],requiere_revision:['Requiere revisión','amb']};
const tag=(m,k)=>`<span class="tag" style="background:var(--${m[k][1]});color:var(--${m[k][1]}t)">${m[k][0]}</span>`;
function validar(doc,proc,motivo){
  if(proc==='liquidado_con_documentacion'&&doc==='no_recibida')return 'No puede estar "liquidado con factura" si la factura figura como no recibida.';
  if(proc==='excluido'&&!String(motivo||'').trim())return 'Para excluir un comprobante hay que indicar el motivo.';
  return null;
}

/* ===== Importador ARCA (mismo criterio que el módulo probado) ===== */
const ALIASES={fecha:['fecha','fecha de emision'],tipo:['tipo','tipo de comprobante'],pv:['punto de venta','pto vta'],numero:['numero desde','numero','nro comprobante'],cuit:['nro doc emisor','cuit emisor','cuit'],nombre:['denominacion emisor','razon social emisor','denominacion'],moneda:['moneda'],cambio:['tipo cambio','tipo de cambio'],total:['imp total','importe total','total']};
const FBH=new Map();for(const[f,hs]of Object.entries(ALIASES))hs.forEach(h=>FBH.set(norm(h),f));
const REQ=['fecha','tipo','pv','numero','cuit','total'];
function pNum(v){if(typeof v==='number')return isFinite(v)?v:null;let s=String(v??'').trim().replace(/\s|\$/g,'');if(!s)return null;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=Number(s);return isFinite(n)?n:null}
function vDate(y,m,d){const t=new Date(Date.UTC(y,m-1,d));return(t.getUTCFullYear()===y&&t.getUTCMonth()===m-1&&t.getUTCDate()===d)?t.toISOString().slice(0,10):null}
function pDate(v){if(typeof v==='number'&&v>20000&&v<80000)return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);const s=String(v??'').trim();let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return vDate(+m[3],+m[2],+m[1]);m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?vDate(+m[1],+m[2],+m[3]):null}
const pTipo=v=>{const m=String(v??'').trim().match(/^(\d{1,3})\b/);return m?+m[1]:null};
const pMon=v=>{const m=String(v??'').trim().toUpperCase();return(!m||m==='$'||m==='ARS')?'PES':(m==='USD'||m==='U$S')?'DOL':m};
function parseArca(rows){
  let h=-1;
  for(let i=0;i<Math.min(rows.length,15);i++){const fs=new Set((rows[i]||[]).map(c=>FBH.get(norm(c))).filter(Boolean));if(REQ.every(r=>fs.has(r))){h=i;break}}
  if(h<0)return{ok:false,error:'No se reconoció el formato. Se esperan al menos las columnas: Fecha, Tipo, Punto de Venta, Número, Nro. Doc. Emisor e Imp. Total. ¿Es el Excel de "Mis Comprobantes"?'};
  const top=rows.slice(0,h).flat().map(c=>String(c??'')).join(' ');
  const meta={kind:/recibidos/i.test(top)?'recibidos':/emitidos/i.test(top)?'emitidos':null,cuit:(top.match(/CUIT\s*(\d{11})/i)||[])[1]||null};
  const heads=rows[h].map(x=>String(x??'').trim()),cf=heads.map(x=>FBH.get(norm(x)));
  const vs=[],errors=[],seen=new Set();let read=0,dupFile=0;
  for(let i=h+1;i<rows.length;i++){
    const r=rows[i];if(!r||r.every(c=>String(c??'').trim()===''))continue;read++;
    const f={},raw={};heads.forEach((n,c)=>{if(n)raw[n]=r[c]??null;if(cf[c])f[cf[c]]=r[c]});
    const fecha=pDate(f.fecha),tipo=pTipo(f.tipo),pv=pNum(f.pv),num=pNum(f.numero),tot=pNum(f.total),cuit=String(f.cuit??'').replace(/\D/g,'');
    const p=[];if(!fecha)p.push('fecha inválida');if(tipo===null)p.push('tipo inválido');if(pv===null||!Number.isInteger(pv))p.push('punto de venta inválido');
    if(num===null||!Number.isInteger(num)||num<0)p.push('número inválido');if(cuit.length!==11)p.push('CUIT del emisor inválido');if(tot===null)p.push('importe inválido');
    if(p.length){errors.push({row:i+1,message:p.join(', ')});continue}
    const k=[cuit,tipo,pv,num].join('|');if(seen.has(k)){dupFile++;continue}seen.add(k);
    vs.push({fecha,tipo_cmp:tipo,tipo_txt:String(f.tipo).trim(),punto_venta:pv,numero:num,emisor_cuit:cuit,emisor_nombre:f.nombre?String(f.nombre).trim():null,moneda:pMon(f.moneda),tipo_cambio:pNum(f.cambio)??1,importe_total:tot,raw});
  }
  return{ok:true,meta,vs,errors,read,dupFile};
}
const vkey=v=>[v.emisor_cuit,v.tipo_cmp,v.punto_venta,v.numero].join('|');
function planImport(parsed,meta,existing,ctx){
  const pl={nuevos:[],repetidos:[],difs:[],fuera:[],bloqueos:[]};
  if(meta.cuit&&meta.cuit!==ctx.cuit)pl.bloqueos.push(`El archivo es del CUIT ${meta.cuit}, pero el cliente elegido tiene CUIT ${ctx.cuit}.`);
  const by=new Map(existing.map(e=>[vkey(e),e]));
  for(const v of parsed){
    if(!v.fecha.startsWith(ctx.periodo)){pl.fuera.push(v);continue}
    const e=by.get(vkey(v));if(!e){pl.nuevos.push(v);continue}
    const d=[e.fecha!==v.fecha&&`fecha ${fAR(e.fecha)} → ${fAR(v.fecha)}`,Math.abs(e.importe_total-v.importe_total)>0.005&&`importe ${e.importe_total} → ${v.importe_total}`].filter(Boolean).join('; ');
    d?pl.difs.push({v,motivo:d}):pl.repetidos.push(v);
  }
  return pl;
}


/* ===== Supabase ===== */
const SUPABASE_URL='https://tugdqcoxcpsiynlvnqdu.supabase.co';
const SUPABASE_KEY='sb_publishable_2-96VeZrsNNftRXkzA1l_A_YG7ThJrL'; // clave pública: los permisos los da la base (RLS)
const sb=(typeof supabase!=='undefined')?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
let me=null,prof=null;
const ui={tab:'inicio',clients:[],cid:null,periodo:new Date().toISOString().slice(0,7),q:'',filtro:'',sel:new Set(),pend:null,msg:null,hist:null,vs:[],batches:[],stats:null,busy:false,dl:[],vcli:'',vdias:'30',cstats:{},vinact:false,ficha:null,pst:[],fil:[]};
const $=id=>document.getElementById(id);
const flash=(t,k='ok')=>{ui.msg={t,k}};
const isAdmin=()=>prof&&prof.role==='administrador';
const errTxt=e=>{const m=(e&&e.message)||String(e);return /Invalid login/i.test(m)?'Usuario o contraseña incorrectos.':/foreign key/i.test(m)?'No se puede eliminar: tiene comprobantes, períodos o importaciones asociados. Podés desactivarlo en su lugar.':/duplicate key/i.test(m)?'Ya existe un registro con esos datos.':/row-level security/i.test(m)?'No tenés permiso para hacer esto.':/check constraint/i.test(m)?'La combinación de estados no es válida.':m};
async function fetchAll(make){const out=[];for(let from=0;;from+=1000){const {data,error}=await make(from,from+999);if(error)throw error;out.push(...data);if(data.length<1000)break}return out}
const tipoTxt=v=>String((v.raw&&(v.raw['Tipo']||v.raw['Tipo de Comprobante']))||v.tipo_cmp);

/* ===== Arranque / login ===== */
async function init(){
  if(!sb){$('main').innerHTML='<div class="msg err" style="margin:20px">No se pudo cargar la conexión con Supabase (¿sin internet?).</div>';return}
  const {data}=await sb.auth.getSession();
  data.session?await boot(data.session.user):drawLogin();
  sb.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_OUT'){me=prof=null;drawLogin()}});
}
function drawLogin(extra){
  $('nav').style.display='none';
  $('main').innerHTML=`<div class="login"><h2>Estudio Theiler</h2>${extra?`<div class="msg err">${esc(extra)}</div>`:''}
  <form class="card" onsubmit="return doLogin(event)"><label>Usuario<input name="e" required autocomplete="username" autocapitalize="none" spellcheck="false" style="width:100%"></label>
  <label>Contraseña<input name="p" type="password" required autocomplete="current-password" style="width:100%"></label><button class="b">Ingresar</button></form></div>`;
}
async function doLogin(e){
  e.preventDefault();const f=new FormData(e.target),u=String(f.get('e')).trim();let email=u;
  if(!u.includes('@')){
    const {data,error}=await sb.rpc('email_para_usuario',{u});
    if(error||!data)return drawLogin('Usuario o contraseña incorrectos.');
    email=data;
  }
  const {data,error}=await sb.auth.signInWithPassword({email,password:String(f.get('p'))});
  if(error)return drawLogin(errTxt(error));
  await boot(data.user);return false;
}
async function boot(user){
  me=user;
  const {data,error}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
  if(error||!data||!data.active){await sb.auth.signOut();return drawLogin(error?errTxt(error):'Tu usuario no está habilitado. Pedile acceso a un administrador.')}
  prof=data;$('nav').style.display='';
  try{await loadClients()}catch(e){flash(errTxt(e),'err')}
  await show('inicio');
}
async function loadClients(){const {data,error}=await sb.from('clients').select('*').order('razon_social');if(error)throw error;ui.clients=data;if(!ui.cid||!data.find(c=>c.id===ui.cid))ui.cid=data[0]?data[0].id:null}
async function logout(){await sb.auth.signOut()}

/* ===== Navegación y carga de datos ===== */
const TABS=[['inicio','Inicio'],['vencimientos','Vencimientos'],['clientes','Clientes'],['importar','Importar ARCA'],['escanear','Escanear QR'],['comprobantes','Comprobantes']];
async function show(t){
  stopCam();ui.tab=t;ui.hist=null;ui.scan=null;
  try{
    if(t==='inicio'||t==='vencimientos')await loadDeadlines();
    if(t==='clientes')await loadCStats();
    if(t==='inicio')await loadDash();
    if(t==='importar'){const {data,error}=await sb.from('import_batches').select('*, clients(razon_social)').order('imported_at',{ascending:false}).limit(50);if(error)throw error;ui.batches=data}
    if(t==='comprobantes')await loadVouchers();
  }catch(e){flash(errTxt(e),'err')}
  draw();
}
async function loadVouchers(){
  ui.sel.clear();ui.vs=[];if(!ui.cid)return;
  const {data:p,error}=await sb.from('client_periods').select('id').eq('client_id',ui.cid).eq('periodo',ui.periodo+'-01').maybeSingle();
  if(error)throw error;if(!p)return;

async function previsualizar(){
  const f=$('ifile').files[0],cid=$('icl').value,periodo=$('iper').value;ui.cid=cid;ui.periodo=periodo;
  const bad=m=>{flash(m,'err');draw()};
  if(!/^\d{4}-\d{2}$/.test(periodo))return bad('Elegí el período.');
  if(!f)return bad('Subí el archivo Excel.');
  if(!/\.xlsx?$/i.test(f.name))return bad('El archivo debe ser .xls o .xlsx.');
  if(f.size>10*1048576)return bad('El archivo supera los 10 MB.');
  if(typeof XLSX==='undefined')return bad('No se pudo cargar el lector de Excel (¿sin conexión a internet?).');
  let buf,rows;try{buf=await f.arrayBuffer();const wb=XLSX.read(buf,{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:null})}catch(e){return bad('No se pudo abrir el archivo: ¿está dañado?')}
  const r=parseArca(rows);if(!r.ok)return bad(r.error);
  const c=ui.clients.find(x=>x.id===cid);
  try{
    const ex=await fetchAll((a,b)=>sb.from('vouchers').select('emisor_cuit,tipo_cmp,punto_venta,numero,fecha,importe_total').eq('client_id',cid).range(a,b));
    ex.forEach(e=>{e.importe_total=Number(e.importe_total)});
    const hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',buf))].map(x=>x.toString(16).padStart(2,'0')).join('');
    ui.pend={cid,periodo,file:f.name,hash,r,plan:planImport(r.vs,r.meta,ex,{cuit:c.cuit,periodo})};
  }catch(e){flash(errTxt(e),'err')}
  draw();
}

async function confirmar(){
  if(ui.busy)return;ui.busy=true;$('bconf').disabled=true;$('bconf').textContent='Importando…';
  const {cid,periodo,file,hash,r,plan}=ui.pend;let batchId=null,inserted=0;

    const {data:per,error:e1}=await sb.from('client_periods').upsert({client_id:cid,periodo:periodo+'-01'},{onConflict:'client_id,periodo'}).select('id').single();if(e1)throw e1;
    const {data:b,error:e2}=await sb.from('import_batches').insert({client_id:cid,period_id:per.id,file_name:file,file_sha256:hash,imported_by:me.id,rows_read:r.read,rows_new:plan.nuevos.length,rows_duplicate:plan.repetidos.length+r.dupFile,rows_rejected:r.errors.length,errors:r.errors}).select('id').single();if(e2)throw e2;
    batchId=b.id;
    const rowsDb=plan.nuevos.map(v=>({client_id:cid,period_id:per.id,batch_id:batchId,fecha:v.fecha,tipo_cmp:v.tipo_cmp,punto_venta:v.punto_venta,numero:v.numero,emisor_cuit:v.emisor_cuit,emisor_nombre:v.emisor_nombre,moneda:v.moneda,tipo_cambio:v.tipo_cambio,importe_total:v.importe_total,raw:v.raw}));
    for(let i=0;i<rowsDb.length;i+=300){
      const {data,error}=await sb.from('vouchers').upsert(rowsDb.slice(i,i+300),{onConflict:'client_id,emisor_cuit,tipo_cmp,punto_venta,numero',ignoreDuplicates:true}).select('id');
      if(error)throw error;inserted+=data.length;
    }
    if(inserted!==plan.nuevos.length)await sb.from('import_batches').update({rows_new:inserted,rows_duplicate:plan.repetidos.length+r.dupFile+(plan.nuevos.length-inserted)}).eq('id',batchId);

  }

function filtered(){

  const f=ui.filtro;
  if(f==='faltan')vs=vs.filter(v=>v.doc_status==='no_recibida');
  if(f==='fisica')vs=vs.filter(v=>v.doc_status==='recibida_fisica');
  if(f==='digital')vs=vs.filter(v=>v.doc_status==='recibida_digital');
  if(f==='liq')vs=vs.filter(v=>v.proc_status.startsWith('liquidado'));

const RECIBIDOS=['recibida_fisica','recibida_digital'];
/** Aplica cambios agrupados por estado destino; registra recepción cuando corresponde. */
async function aplicarGrupos(targets){ // targets: [{v,doc,proc,motivo}]
  const groups=new Map();
  targets.forEach(t=>{const k=[t.doc,t.proc,t.proc==='excluido'?t.motivo:''].join('|');(groups.get(k)||groups.set(k,{doc:t.doc,proc:t.proc,motivo:t.proc==='excluido'?t.motivo:null,ids:[]}).get(k)).ids.push(t.v.id)});
  for(const g of groups.values()){
    const upd={doc_status:g.doc,proc_status:g.proc,proc_exclusion_reason:g.motivo,updated_by:me.id};
    if(RECIBIDOS.includes(g.doc))upd.received_at=new Date().toISOString();
    const {error}=await sb.from('vouchers').update(upd).in('id',g.ids);if(error)throw error;
    const nuevosRec=targets.filter(t=>g.ids.includes(t.v.id)&&RECIBIDOS.includes(g.doc)&&t.v.doc_status!==g.doc);
    if(nuevosRec.length){const {error:e2}=await sb.from('document_receipts').insert(nuevosRec.map(t=>({voucher_id:t.v.id,method:'manual',received_by:me.id})));if(e2)throw e2}
  }
}
async function guardar(id){
  const v=ui.vs.find(x=>x.id===id),doc=$('d'+id).value,proc=$('p'+id).value,motivo=($('m'+id).value||v.proc_exclusion_reason||'').trim();
  const e=validar(doc,proc,motivo);if(e){flash(e,'err');return draw()}
  try{await aplicarGrupos([{v,doc,proc,motivo}]);flash('Estado actualizado.');await loadVouchers()}catch(x){flash(errTxt(x),'err')}
  draw();
}
async function masivo(){
  const d=$('bd').value,p=$('bp').value,m=$('bm').value.trim();
  if(!d&&!p){flash('Elegí al menos un estado para aplicar.','err');return draw()}

/* ===== Escaneo de QR de factura electrónica ===== */
/* Leer el QR identifica el comprobante; NO verifica la factura ante ARCA ni significa que exista copia digital. */
const QRS={stream:null,on:false,raf:0,last:'',lastAt:0,list:[]};
function parseAfipQr(text){
  let p;try{p=new URL(String(text).trim()).searchParams.get('p')}catch(e){return{ok:false,error:'El código no es una URL; no parece un QR de factura electrónica.'}}
  if(!p)return{ok:false,error:'La URL no contiene el parámetro "p" de ARCA.'};
  let j;try{const b=p.replace(/-/g,'+').replace(/_/g,'/');j=JSON.parse(decodeURIComponent(escape(atob(b+'='.repeat((4-b.length%4)%4)))))}catch(e){return{ok:false,error:'No se pudo decodificar el contenido del QR.'}}
  const cuit=String(j.cuit??'').replace(/\D/g,'');
  if(cuit.length!==11||[j.fecha,j.ptoVta,j.tipoCmp,j.nroCmp,j.importe].some(v=>v==null))return{ok:false,error:'Al QR le faltan datos (CUIT, fecha, punto de venta, tipo, número o importe).'};
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(j.fecha)))return{ok:false,error:'Fecha del QR con formato inesperado.'};
  return{ok:true,data:{fecha:j.fecha,cuit,ptoVta:+j.ptoVta,tipoCmp:+j.tipoCmp,nroCmp:+j.nroCmp,importe:+j.importe,ctz:+(j.ctz??1),raw:j}};
}
const nroF=(pv,n)=>String(pv).padStart(5,'0')+'-'+String(n).padStart(8,'0');

function scanHtml(){

}
function renderScan(){const a=document.getElementById('scanres'),b=document.getElementById('scanlist');if(a)a.innerHTML=scanHtml();if(b)b.innerHTML=scanList()}
function setScan(o){ui.scan=o;renderScan()}
function seguirScan(){ui.scan=null;renderScan()}
function beep(ok){
  try{const A=window.AudioContext||window.webkitAudioContext,a=new A(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=ok?880:220;g.gain.value=.08;o.start();setTimeout(()=>{o.stop();a.close()},ok?130:260)}catch(e){}
  try{navigator.vibrate&&navigator.vibrate(ok?80:[120,60,120])}catch(e){}
}
async function handleQr(text){
  if(QRS.proc)return;QRS.proc=true;
  try{
    const r=parseAfipQr(text);if(!r.ok){beep(false);return setScan({k:'err',t:r.error})}
    const q=r.data,{data,error}=await sb.from('vouchers').select('*, client_periods(periodo)').eq('emisor_cuit',q.cuit).eq('tipo_cmp',q.tipoCmp).eq('punto_venta',q.ptoVta).eq('numero',q.nroCmp);
    if(error){beep(false);return setScan({k:'err',t:errTxt(error)})}
    let hits=data;
    if(hits.length>1){const rc=String(q.raw.nroDocRec??'').replace(/\D/g,''),cl=ui.clients.find(c=>c.cuit===rc);hits=cl?hits.filter(h=>h.client_id===cl.id):[]}
    if(!hits.length){beep(false);return setScan({k:'warn',t:data.length>1?'Esa factura figura en más de un cliente y no se pudo decidir cuál es. Marcala a mano en Comprobantes.':`No figura entre los comprobantes importados (emisor ${cuitF(q.cuit)}, tipo ${q.tipoCmp}, N° ${nroF(q.ptoVta,q.nroCmp)}). Puede que falte importar el Excel de ARCA de ese mes, o que sea de un cliente al que no tenés acceso.`})}
    const v=hits[0],cli=ui.clients.find(c=>c.id===v.client_id),d=[];
    if(v.fecha!==q.fecha)d.push(`Fecha: QR ${fAR(q.fecha)} vs ARCA ${fAR(v.fecha)}`);
    const imp=Number(v.importe_total);
    if(Math.abs(imp-q.importe)>0.01&&Math.abs(imp-q.importe*(q.ctz||1))>0.01)d.push(`Importe: QR ${money(q.importe)} vs ARCA ${money(imp)}`);
    if(v.doc_status!=='no_recibida'){beep(false);return setScan({k:'info',t:`Ya figuraba como "${DOC[v.doc_status][0]}". No se cambió nada.`,v,cli})}
    const o={k:d.length?'warn':'ok',t:d.length?'Se encontró el comprobante, pero hay diferencias:':'Comprobante encontrado.',v,q,d,cli,confirm:true},auto=document.getElementById('auto');
    if(auto&&auto.checked&&!d.length){ui.scan=o;return await registrarQr()}
    setScan(o);
  }finally{QRS.proc=false}
}
async function registrarQr(){
  const s=ui.scan;if(!s||!s.confirm)return;const {v,q,d,cli}=s;
  try{
    const {data,error}=await sb.from('vouchers').update({doc_status:'recibida_fisica',received_at:new Date().toISOString(),updated_by:me.id}).eq('id',v.id).eq('doc_status','no_recibida').select('id');
    if(error)throw error;
    if(!data.length){beep(false);return setScan({k:'warn',t:'Otra persona ya registró este comprobante hace un instante. No se cambió nada.',v,cli})}
    const {error:e2}=await sb.from('document_receipts').insert({voucher_id:v.id,method:'qr',received_by:me.id,qr_payload:q.raw,match_result:d.length?'con_diferencias: '+d.join('; '):'coincidencia_unica'});
    if(e2)throw e2;
    beep(true);
    QRS.list.unshift(`${new Date().toLocaleTimeString('es-AR')}, ${cli?cli.razon_social+', ':''}${v.emisor_nombre||cuitF(v.emisor_cuit)}, ${nroF(v.punto_venta,v.numero)}`);
    ui.scan=null;renderScan();
    const l=document.getElementById('scanres');if(l)l.insertAdjacentHTML('afterbegin',`<div class="msg ok"><b>Recibida y registrada.</b><br>${esc(cli?cli.razon_social:'')}: ${esc(v.emisor_nombre||'')}, ${nroF(v.punto_venta,v.numero)}. Podés escanear la siguiente.</div>`);
  }catch(e){beep(false);setScan({k:'err',t:errTxt(e)})}
}
async function startCam(){
  if(QRS.on)return;
  if(!window.isSecureContext)return setScan({k:'err',t:'El navegador bloquea la cámara en vivo porque esta página no usa HTTPS. Usá "Sacar foto al QR" o el lector USB, o subí la app a un hosting con HTTPS.'});
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return setScan({k:'err',t:'Este navegador no permite usar la cámara. Probá con Chrome o Safari actualizados, o usá "Sacar foto al QR".'});
  QRS.det=null;if('BarcodeDetector' in window){try{QRS.det=new BarcodeDetector({formats:['qr_code']})}catch(e){QRS.det=null}}
  if(!QRS.det&&typeof jsQR==='undefined')return setScan({k:'err',t:'No se pudo cargar el lector de QR (¿sin internet?). Probá con "Sacar foto al QR".'});
  try{QRS.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})}
  catch(e){return setScan({k:'err',t:e.name==='NotAllowedError'?'Permiso de cámara denegado. Habilitalo en el navegador (ícono del candado) y volvé a intentar.':e.name==='NotFoundError'?'No se encontró ninguna cámara.':e.name==='NotReadableError'?'La cámara está siendo usada por otra aplicación.':'No se pudo abrir la cámara: '+(e.message||e.name)})}
  const v=document.getElementById('cam');if(!v){stopCam();return}
  v.srcObject=QRS.stream;try{await v.play()}catch(e){}
  QRS.on=true;setScan({k:'info',t:'Cámara activa. Apuntá al QR de la factura.'});scanLoop();
}
function stopCam(){
  QRS.on=false;cancelAnimationFrame(QRS.raf);
  if(QRS.stream){QRS.stream.getTracks().forEach(t=>t.stop());QRS.stream=null}
  const v=document.getElementById('cam');if(v)v.srcObject=null;
}
function recibido(t){const now=Date.now();if(t!==QRS.last||now-QRS.lastAt>6000){QRS.last=t;QRS.lastAt=now;handleQr(t)}}
function scanLoop(){
  if(!QRS.on)return;
  const v=document.getElementById('cam'),c=document.getElementById('cv');
  if(v&&v.readyState===v.HAVE_ENOUGH_DATA&&v.videoWidth&&!(ui.scan&&ui.scan.confirm)&&!QRS.proc&&!QRS.busy){
    if(QRS.det){QRS.busy=true;QRS.det.detect(v).then(r=>{if(r[0]&&r[0].rawValue)recibido(r[0].rawValue)}).catch(()=>{}).finally(()=>{QRS.busy=false})}
    else if(c){
      const k=Math.min(1,640/v.videoWidth);c.width=Math.round(v.videoWidth*k);c.height=Math.round(v.videoHeight*k);
      const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,c.width,c.height);
      const im=x.getImageData(0,0,c.width,c.height),code=jsQR(im.data,c.width,c.height,{inversionAttempts:'dontInvert'});
      if(code&&code.data)recibido(code.data);
    }
  }
  QRS.raf=requestAnimationFrame(scanLoop);
}
async function leerFoto(inp){
  const f=inp.files[0];if(!f)return;
  try{
    const bmp=await createImageBitmap(f);let txt=null;
    if('BarcodeDetector' in window){try{const r=await new BarcodeDetector({formats:['qr_code']}).detect(bmp);if(r[0])txt=r[0].rawValue}catch(e){}}
    if(!txt&&typeof jsQR!=='undefined'){
      for(const mw of [1000,1600,600]){
        const k=Math.min(1,mw/bmp.width),c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
        const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(bmp,0,0,c.width,c.height);
        const im=x.getImageData(0,0,c.width,c.height),code=jsQR(im.data,c.width,c.height,{inversionAttempts:'attemptBoth'});
        if(code){txt=code.data;break}
      }
    }
    inp.value='';
    if(!txt)return setScan({k:'warn',t:'No se encontró ningún QR en la foto. Acercate para que el QR ocupe buena parte de la imagen, con buena luz y sin reflejos.'});
    handleQr(txt);
  }catch(e){setScan({k:'err',t:'No se pudo leer la foto: '+(e.message||e)})}
}

function waNum(raw){
  let d=String(raw||'').replace(/\D/g,'').replace(/^00/,'');if(!d)return null;
  d=d.startsWith('54')?d.slice(2):d.replace(/^0/,'');d=d.replace(/^9/,'');

}

function buildMsg(c,ct,periodo,rows,det,fmt){
  if(!rows.length)return '';
  const nom=ct?String(ct.nombre).trim().split(/\s+/)[0]:'',per=periodo.slice(5)+'/'+periodo.slice(0,4),n=rows.length,lim=15,arch=fmt==='xlsx'?'el Excel':'el PDF';
  const cab=`Hola${nom?' '+nom:''}, ¿cómo estás? Te escribimos de Estudio Theiler. Para cerrar el período ${per} de ${c.razon_social} ${n===1?'nos falta 1 factura':'nos faltan '+n+' facturas'}.`;
  let cuerpo=`Te paso en ${arch} adjunto el detalle de lo que falta.`;
  if(det){const L=rows.slice(0,lim).map(v=>`- ${fAR(v.fecha).slice(0,5)} ${v.emisor_nombre||cuitF(v.emisor_cuit)}, ${tipoTxt(v)} ${nroF(v.punto_venta,v.numero)}`);cuerpo=`${L.join('\n')}${n>lim?`\n...y ${n-lim} más (están en ${arch} adjunto).`:''}\n\nTe paso también ${arch} con el detalle.`}
  return `${cab}\n\n${cuerpo}\n\nCuando puedas, ¿nos las acercás o nos las mandás por acá? Muchas gracias.`;
}
async function initPedir(){
  const f=ui.ficha,wp=workPeriod(),has=f.per.find(p=>p.periodo.slice(0,7)===(f.recPer||wp));
  const per=has?has.periodo.slice(0,7):(f.per[0]?f.per[0].periodo.slice(0,7):null);
  f.rec={periodo:per,rev:false,det:false,fmt:'pdf',rows:[],msg:'',dirty:false,cid:null,loading:!!per};draw();
  if(per)await loadRec();
}
async function loadRec(){
  const f=ui.ficha,r=f.rec,c=ui.clients.find(x=>x.id===f.id),pr=f.per.find(p=>p.periodo.slice(0,7)===r.periodo);
  r.loading=true;draw();
  try{
    const est=r.rev?['no_recibida','pendiente_revision']:['no_recibida'];
    r.rows=await fetchAll((a,b)=>sb.from('vouchers').select('id,fecha,emisor_cuit,emisor_nombre,tipo_cmp,punto_venta,numero,importe_total,doc_status,raw').eq('period_id',pr.period_id).in('doc_status',est).order('fecha').order('numero').range(a,b));
    if(!r.dirty)r.msg=buildMsg(c,contactoPedir(f),r.periodo,r.rows,r.det,r.fmt);
  }catch(e){flash(errTxt(e),'err')}
  r.loading=false;draw();
}
function recOpt(k,v){const r=ui.ficha.rec;r[k]=v;if(k==='periodo'||k==='rev'){r.dirty=false;loadRec()}else{if(!r.dirty)rebuildMsg();draw()}}
function rebuildMsg(){const f=ui.ficha,r=f.rec,c=ui.clients.find(x=>x.id===f.id);r.msg=buildMsg(c,contactoPedir(f),r.periodo,r.rows,r.det,r.fmt)}

  <div class="tw"><table><thead><tr><th>Fecha</th><th>Proveedor</th><th>Comprobante</th><th>Importe</th></tr></thead><tbody>${r.rows.map(v=>`<tr><td>${fAR(v.fecha)}</td><td>${esc(v.emisor_nombre)}<span class="s">${cuitF(v.emisor_cuit)}</span></td><td>${esc(tipoTxt(v))}<span class="s">${nroF(v.punto_venta,v.numero)}</span></td><td>${money(Number(v.importe_total))}</td></tr>`).join('')}</tbody></table></div>`

function archivoPedir(){
  const f=ui.ficha,r=f.rec,c=ui.clients.find(x=>x.id===f.id);
  if(r.fmt==='xlsx'){
    if(typeof XLSX==='undefined')throw new Error('No se pudo cargar el generador de Excel (¿sin internet?).');
    const ws=XLSX.utils.aoa_to_sheet([['Fecha','Proveedor','CUIT','Comprobante','Importe','Estado'],...r.rows.map(filaFalt)]);
    ws['!cols']=[{wch:12},{wch:36},{wch:14},{wch:32},{wch:16},{wch:22}];r.rows.forEach((_,i)=>{const x=ws['E'+(i+2)];if(x)x.z='#,##0.00'});
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Faltantes');
    return {blob:new Blob([XLSX.write(wb,{type:'array',bookType:'xlsx'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),name:fileBase()+'.xlsx'};
  }
  if(!window.jspdf||!window.jspdf.jsPDF)throw new Error('No se pudo cargar el generador de PDF (¿sin internet?).');
  const doc=new window.jspdf.jsPDF({orientation:'landscape'});
  doc.setFontSize(15);doc.text('Facturas faltantes - '+c.razon_social,14,16);doc.setFontSize(10);
  doc.text(`CUIT ${cuitF(c.cuit)}  |  Período ${r.periodo.slice(5)}/${r.periodo.slice(0,4)}  |  ${r.rows.length} comprobante(s)  |  Estudio Theiler`,14,23);
  doc.autoTable({startY:29,head:[['Fecha','Proveedor','CUIT','Comprobante','Importe','Estado']],body:r.rows.map(v=>{const a=filaFalt(v);a[4]=money(a[4]);return a}),styles:{fontSize:9},headStyles:{fillColor:[23,48,92]},columnStyles:{4:{halign:'right'}}});
  return {blob:doc.output('blob'),name:fileBase()+'.pdf'};
}
function bajar(a){const u=URL.createObjectURL(a.blob),l=document.createElement('a');l.href=u;l.download=a.name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}
function soloArchivo(){try{bajar(archivoPedir())}catch(e){flash(e.message,'err');draw()}}
function waAbrir(){
  const f=ui.ficha,r=f.rec,ct=contactoPedir(f);let url='https://wa.me/?text='+encodeURIComponent(r.msg);
  if(ct){const w=waNum(ct.whatsapp);if(!w||!w.ok){flash('Revisá el número de WhatsApp: tiene que ser código de área + número (10 dígitos), sin 0 ni 15.','err');return draw()}url='https://wa.me/'+w.num+'?text='+encodeURIComponent(r.msg)}
  try{bajar(archivoPedir())}catch(e){flash(e.message,'err');return draw()}
  window.open(url,'_blank','noopener');
}
async function waCompartir(){

    const a=archivoPedir(),file=new File([a.blob],a.name,{type:a.blob.type});
    if(!navigator.canShare||!navigator.canShare({files:[file]})){flash('Este dispositivo no permite compartir archivos desde el navegador. Usá "Abrir WhatsApp y descargar el archivo".','warn');return draw()}
    await navigator.share({files:[file],text:ui.ficha.rec.msg,title:a.name});
  }catch(e){if(e.name!=='AbortError'){flash('No se pudo compartir: '+(e.message||e),'err');draw()}}
}

/* ===== Presentaciones (IVA / IIBB) y acceso a ARCA ===== */
const ARCA_URL='https://www.arca.gob.ar/';
async function loadFil(){const {data,error}=await sb.from('tax_filings').select('*');if(error)throw error;ui.fil=data}
/** Qué declaraciones se controlan para un cliente: IVA, y IIBB (provincial o Convenio Multilateral). */
const OBLIG={IVA:{n:'IVA',s:'IVA',t:'m'},IIBB:{n:'IIBB',s:'IIBB',t:'m'},F931:{n:'Cargas sociales F.931',s:'F.931',t:'m'},GAN_ANT:{n:'Anticipos de Ganancias',s:'Anticipos',t:'m'},GAN_DDJJ:{n:'Ganancias, DDJJ anual',s:'Ganancias',t:'a'},BP:{n:'Bienes Personales',s:'BP',t:'a'}};
const tieneImp=(c,k)=>{const i=c.impuestos||[];return k==='GANANCIAS_PH'?['GANANCIAS_PH','GAN_ANT','GAN_DDJJ','BP'].some(x=>i.includes(x)):i.includes(k)};
const tieneChk=(c,k)=>{const i=c.impuestos||[];return i.includes(k)||(i.includes('GANANCIAS_PH')&&(k==='GAN_ANT'||k==='GAN_DDJJ'))};
/** Qué declaraciones se controlan para un cliente según los impuestos que tiene. */
const aplica=c=>{const i=c.impuestos||[],r=[];if(i.includes('IVA'))r.push('IVA');if(i.includes('IIBB')||i.includes('CM'))r.push('IIBB');if(i.includes('F931'))r.push('F931');if(i.includes('GAN_ANT')||i.includes('GANANCIAS_PH'))r.push('GAN_ANT');if(i.includes('GAN_DDJJ')||i.includes('GANANCIAS_PH'))r.push('GAN_DDJJ');if(i.includes('BP'))r.push('BP');return r};
function declChips(r,wp){
  return r.fil.length?r.fil.map(x=>`<a href="#" onclick="abrirFicha('${r.c.id}','present');return false" class="tag" style="text-decoration:none;background:var(--${x.ok?'grn':'amb'});color:var(--${x.ok?'grnt':'ambt'});margin:0 4px 4px 0">${OBLIG[x.imp].s} ${x.ok?'presentado':'pendiente'}</a>`).join(''):'<span class="s">sin IVA ni IIBB cargados</span>';
}
const hoyISO=()=>isoLocal(new Date());
const nuevaFecha=iso=>new Date(iso+'T12:00:00').toISOString();
function ejerciciosCerrados(cierre,n){
  const h=new Date(),now=h.getFullYear()*12+h.getMonth()+1;let cur=h.getFullYear()*12+cierre;if(cur>=now)cur-=12;const out=[];
  for(let i=0;i<n;i++){const yy=Math.floor((cur-1)/12),mm=((cur-1)%12)+1;out.push(yy+'-'+String(mm).padStart(2,'0'));cur-=12}return out;
}
function cel(c,imp,per){
  const x=ui.fil.find(z=>z.client_id===c.id&&z.periodo.slice(0,7)===per&&z.impuesto===imp),k=imp+'_'+per;
  if(!x)return `<div class="cel"><input type="date" class="sm" id="pf_${k}" value="${hoyISO()}" title="Fecha de presentación"><button class="b sm" onclick="marcarPres('${imp}','${per}')">Marcar presentado</button></div>`;
  const fd=x.presentado_at?isoLocal(new Date(x.presentado_at)):'';
  return `<div class="cel"><span class="tag" style="background:var(--grn);color:var(--grnt)">Presentado</span>
  <input type="date" class="sm" value="${fd}" title="Fecha de presentación (se puede cambiar)" onchange="cambiarFechaPres('${imp}','${per}',this.value)">
  ${x.nota?`<span class="s">${esc(x.nota)}</span>`:''}
  <div class="row" style="gap:4px">${x.archivo_path?`<button class="g sm" onclick="verArchivo('${x.archivo_path}')">Ver PDF</button><button class="g sm" onclick="quitarPdf('${imp}','${per}')">Quitar PDF</button>`:`<label class="g sm">Adjuntar PDF<input type="file" accept="application/pdf,.pdf" hidden onchange="adjPres('${imp}','${per}',this)"></label>`}<button class="g sm" onclick="notaPres('${imp}','${per}')">Nota</button><button class="g sm" onclick="deshacerPres('${imp}','${per}')">Deshacer</button></div></div>`;
}
function vPresent(c,f){
  const ap=aplica(c);
  if(!ap.length)return '<div class="card" style="color:var(--mut)">Marcá en la pestaña Datos qué impuestos presenta este cliente (IVA, IIBB, F.931, Ganancias, Bienes Personales) y acá aparecen sus columnas de presentación.</div>';
  const mens=ap.filter(k=>OBLIG[k].t==='m'),anu=ap.filter(k=>OBLIG[k].t==='a'),meses=[];
  let [y,m]=workPeriod().split('-').map(Number);for(let i=0;i<8;i++){meses.push(y+'-'+String(m).padStart(2,'0'));m--;if(m===0){m=12;y--}}
  let h=`<p class="s" style="margin-bottom:12px">Las columnas dependen de los impuestos del cliente. Marcá cada una cuando quede presentada: podés cambiar la fecha y adjuntar la declaración jurada en PDF. La app solo guarda tu marca; no verifica nada con ARCA ni con la provincia.</p>`;
  if(mens.length)h+=`<div class="tw"><table><thead><tr><th>Período</th>${mens.map(k=>`<th>${OBLIG[k].n}</th>`).join('')}</tr></thead><tbody>${meses.map(per=>`<tr><td>${per.slice(5)}/${per.slice(0,4)}${per===workPeriod()?'<span class="s">período de trabajo</span>':''}</td>${mens.map(k=>`<td>${cel(c,k,per)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  anu.forEach(k=>{const cierre=k==='BP'?12:(c.ejercicio_cierre_mes||12);h+=`<h3>${OBLIG[k].n}</h3><div class="tw"><table><thead><tr><th>Ejercicio cerrado el</th><th>Presentación</th></tr></thead><tbody>${ejerciciosCerrados(cierre,4).map(per=>{const [yy,mm]=per.split('-').map(Number);return `<tr><td>${new Date(Date.UTC(yy,mm,0)).getUTCDate()}/${String(mm).padStart(2,'0')}/${yy}</td><td>${cel(c,k,per)}</td></tr>`}).join('')}</tbody></table></div>`});
  if(anu.includes('GAN_DDJJ')&&!c.ejercicio_cierre_mes)h+=`<p class="s" style="margin-top:8px">Cargá el ejercicio económico en Datos: mientras tanto se asume cierre en diciembre.</p>`;
  return h;
}
async function marcarPres(imp,per){

async function updPres(imp,per,cambios,okMsg){
  const {data,error}=await sb.from('tax_filings').update({...cambios,modificado_by:me.id,modificado_at:new Date().toISOString()}).eq('client_id',ui.ficha.id).eq('periodo',per+'-01').eq('impuesto',imp).select('id');
  if(error)flash(errTxt(error),'err');else if(!data.length)flash('No se pudo actualizar: la presentación ya no existe o no tenés permiso.','err');else{try{await loadFil();flash(okMsg)}catch(e){flash(errTxt(e),'err')}}

function cambiarFechaPres(imp,per,v){if(!v){flash('La fecha no puede quedar vacía.','err');return draw()}return updPres(imp,per,{presentado_at:nuevaFecha(v)},`Fecha de presentación actualizada: ${fAR(v)}.`)}
function notaPres(imp,per){const x=ui.fil.find(z=>z.client_id===ui.ficha.id&&z.periodo.slice(0,7)===per&&z.impuesto===imp),n=prompt('Nota de esta presentación:',(x&&x.nota)||'');if(n===null)return;return updPres(imp,per,{nota:n.trim()||null},'Nota guardada.')}
async function deshacerPres(imp,per){
  const x=ui.fil.find(z=>z.client_id===ui.ficha.id&&z.periodo.slice(0,7)===per&&z.impuesto===imp);
  if(!confirm(`¿Quitar la marca de presentado de ${OBLIG[imp].n} ${per.slice(5)}/${per.slice(0,4)}?${x&&x.archivo_path?'\nTambién se elimina el PDF adjunto.':''}`))return;
  if(x&&x.archivo_path){const r=await sb.storage.from('clientes').remove([x.archivo_path]);if(r.error){flash(errTxt(r.error),'err');return draw()}}
  const {error}=await sb.from('tax_filings').delete().eq('client_id',ui.ficha.id).eq('periodo',per+'-01').eq('impuesto',imp);
  if(error)flash(errTxt(error),'err');else{try{await loadFil();flash('Marca quitada.')}catch(e){flash(errTxt(e),'err')}}
  draw();
}
/** Abre ARCA en otra pestaña y copia el CUIT de ingreso. No es posible rellenar el formulario de ARCA desde acá. */
function abrirArca(){
  const c=ui.clients.find(x=>x.id===ui.ficha.id),cuit=c.cuit_ingreso||c.cuit;
  window.open(ARCA_URL,'_blank','noopener');
  const ok=()=>{flash(`Se copió el CUIT ${cuitF(cuit)}${c.titular_ingreso?' (ingresa '+c.titular_ingreso+')':''}. En ARCA tocá "Iniciar sesión" y pegalo; la clave la completa tu navegador o la escribís vos.`);draw()};
  const fb=()=>{const a=document.createElement('textarea');a.value=cuit;document.body.appendChild(a);a.select();let k=false;try{k=document.execCommand('copy')}catch(e){}a.remove();k?ok():(flash(`No se pudo copiar solo. El CUIT de ingreso es ${cuitF(cuit)}.`,'warn'),draw())};
  navigator.clipboard?navigator.clipboard.writeText(cuit).then(ok,fb):fb();
}

/* ===== Ficha ampliada: forma de pago, ejercicio, documentos y DDJJ adjuntas ===== */
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const FORMAS_PAGO=['Red Link','Banelco','Interbanking','Pago Mis Cuentas','Débito automático','Otra'];
const CAT_DOC=['Contrato','Balance','Estatuto','Acta','Poder','Constancia de inscripción','Presentación','Otro'];
const EXT_MIME={pdf:'application/pdf',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',doc:'application/msword',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',xls:'application/vnd.ms-excel',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'};
const fmtTam=b=>b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
/** Al elegir el cierre se completa el inicio (mes siguiente) y viceversa. */
function syncEj(el){const f=el.form,i=f.elements.ej_inicio,c=f.elements.ej_cierre;if(!el.value)return;if(el.name==='ej_cierre')i.value=String(Number(el.value)%12+1);else c.value=String((Number(el.value)+10)%12+1)}
function proxCierre(c){const m=c.ejercicio_cierre_mes;if(!m)return null;const h=new Date(),y=h.getFullYear(),hoy=Date.UTC(y,h.getMonth(),h.getDate());let d=new Date(Date.UTC(y,m,0));if(d.getTime()<hoy)d=new Date(Date.UTC(y+1,m,0));return d.toISOString().slice(0,10)}
function infoCliente(c){
  const k=[];
  if(c.forma_pago)k.push(['Forma de pago',esc(c.forma_pago)+(c.forma_pago_detalle?`<span class="s">${esc(c.forma_pago_detalle)}</span>`:'')]);
  if(c.ejercicio_cierre_mes){const pc=proxCierre(c),ini=c.ejercicio_inicio_mes||(c.ejercicio_cierre_mes%12+1);k.push(['Ejercicio económico',`Del 1 de ${MESES[ini-1]} al fin de ${MESES[c.ejercicio_cierre_mes-1]}<span class="s">Próximo cierre: ${fAR(pc)}, ${cuando(diasHasta(pc))}</span>`])}
  return k.length?`<div class="grid" style="margin:16px 0 0">${k.map(([t,h])=>`<div class="card"><span class="s">${t}</span><div style="font-weight:600">${h}</div></div>`).join('')}</div>`:'';
}
async function esPdf(f){
  if(!f||!f.size)return 'Elegí un archivo.';
  if(!/\.pdf$/i.test(f.name))return 'El archivo tiene que ser un PDF.';
  if(f.size>15*1048576)return 'El PDF supera los 15 MB.';
  if(await f.slice(0,5).text()!=='%PDF-')return 'El archivo no parece un PDF válido.';
  return null;
}
async function adjPres(imp,per,inp){
  const f=inp.files[0];inp.value='';const e=await esPdf(f);if(e){flash(e,'err');return draw()}
  const path=`${ui.ficha.id}/ddjj/${imp}-${per}.pdf`,up=await sb.storage.from('clientes').upload(path,f,{contentType:'application/pdf',upsert:true});
  if(up.error){flash('No se pudo subir el PDF: '+errTxt(up.error),'err');return draw()}
  return updPres(imp,per,{archivo_path:path,archivo_nombre:f.name,archivo_at:new Date().toISOString()},'Declaración jurada adjuntada.');
}
async function quitarPdf(imp,per){
  const x=ui.fil.find(z=>z.client_id===ui.ficha.id&&z.periodo.slice(0,7)===per&&z.impuesto===imp);
  if(!x||!x.archivo_path||!confirm('¿Quitar el PDF adjunto? Se elimina el archivo.'))return;
  const r=await sb.storage.from('clientes').remove([x.archivo_path]);if(r.error){flash(errTxt(r.error),'err');return draw()}
  return updPres(imp,per,{archivo_path:null,archivo_nombre:null,archivo_at:null},'PDF quitado.');
}
/** Abre un archivo privado con un enlace temporal de 2 minutos. */
async function verArchivo(path){
  const w=window.open('about:blank','_blank');
  const {data,error}=await sb.storage.from('clientes').createSignedUrl(path,120);
  if(error||!data){if(w)w.close();flash('No se pudo abrir el archivo: '+(error?errTxt(error):'sin respuesta'),'err');return draw()}
  if(w)w.location.href=data.signedUrl;else{flash('El navegador bloqueó la ventana emergente. Permitila para esta página e intentá de nuevo.','warn');draw()}
}
function vDocs(c,f){
  return `<form class="card" style="margin-bottom:16px" onsubmit="return subirDoc(event)"><div class="fgrid">
  <label>Tipo<select name="cat">${CAT_DOC.map(x=>`<option>${x}</option>`).join('')}</select></label>
  <label>Título o descripción<input name="titulo" required placeholder="Ej.: Balance ejercicio 2025"></label>
  <label>Año o ejercicio (opcional)<input name="anio" inputmode="numeric" maxlength="4" placeholder="2025"></label>
  <label>Archivo (PDF, imagen, Word o Excel, hasta 15 MB)<input type="file" name="archivo" required accept=".pdf,.jpg,.jpeg,.png,.doc,.docx,.xls,.xlsx"></label>
  <div class="full"><button class="b">Subir documento</button></div></div></form>
  <div class="tw"><table><thead><tr><th>Tipo</th><th>Documento</th><th>Año</th><th>Archivo</th><th>Subido</th><th></th></tr></thead><tbody>
  ${f.docs.length?f.docs.map(d=>`<tr><td><span class="tag" style="background:var(--blu);color:var(--blut)">${esc(d.categoria)}</span></td><td>${esc(d.titulo)}</td><td>${d.anio||''}</td><td>${esc(d.nombre_archivo)}<span class="s">${d.size_bytes?fmtTam(d.size_bytes):''}</span></td><td>${new Date(d.subido_at).toLocaleDateString('es-AR')}</td><td style="white-space:nowrap"><button class="g" onclick="verArchivo('${d.path}')">Ver</button> <button class="dng" onclick="quitarDoc('${d.id}')">Quitar</button></td></tr>`).join(''):'<tr><td colspan="6" style="color:var(--mut)">Todavía no hay documentos. Subí contratos, balances, estatutos y otras presentaciones importantes.</td></tr>'}</tbody></table></div>`;
}
async function subirDoc(e){
  e.preventDefault();const fd=new FormData(e.target),file=fd.get('archivo'),f=ui.ficha,bad=m=>{flash(m,'err');draw();return false};
  const ext=(String((file&&file.name)||'').split('.').pop()||'').toLowerCase();
  if(!file||!file.size)return bad('Elegí un archivo.');
  if(!EXT_MIME[ext])return bad('Formato no permitido. Usá PDF, JPG, PNG, Word o Excel.');
  if(file.size>15*1048576)return bad('El archivo supera los 15 MB.');
  const anio=String(fd.get('anio')||'').trim();if(anio&&!/^(19|20)\d{2}$/.test(anio))return bad('El año tiene que tener 4 dígitos, por ejemplo 2025.');
  const safe=file.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9._-]+/g,'_').slice(-80),path=`${f.id}/docs/${crypto.randomUUID()}-${safe}`;
  const up=await sb.storage.from('clientes').upload(path,file,{contentType:EXT_MIME[ext],upsert:false});
  if(up.error)return bad('No se pudo subir el archivo: '+errTxt(up.error));
  const {error}=await sb.from('client_documents').insert({client_id:f.id,categoria:fd.get('cat'),titulo:String(fd.get('titulo')).trim(),anio:anio?Number(anio):null,nombre_archivo:file.name,path,size_bytes:file.size,mime:EXT_MIME[ext],subido_by:me.id});
  if(error){await sb.storage.from('clientes').remove([path]);return bad(errTxt(error))}
  try{await recargarDocs();flash('Documento subido.')}catch(x){flash(errTxt(x),'err')}
  draw();return false;
}
async function recargarDocs(){const {data,error}=await sb.from('client_documents').select('*').eq('client_id',ui.ficha.id).order('subido_at',{ascending:false});if(error)throw error;ui.ficha.docs=data}
async function quitarDoc(id){
  const d=ui.ficha.docs.find(x=>x.id===id);if(!d||!confirm(`¿Quitar "${d.titulo}"? Se elimina el archivo.`))return;
  const r=await sb.storage.from('clientes').remove([d.path]);if(r.error){flash(errTxt(r.error),'err');return draw()}
  const {error}=await sb.from('client_documents').delete().eq('id',id);
  if(error)flash(errTxt(error),'err');else{try{await recargarDocs();flash('Documento quitado.')}catch(x){flash(errTxt(x),'err')}}
  draw();
}
init();
</script>
