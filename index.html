/* ===== Liquidaciones de granos, hacienda y leche (PDF) ===== */
/* No hay Excel de ARCA para estas liquidaciones: se guarda el PDF y se leen los importes del texto del PDF.
   La lectura es ASISTIDA: nunca se guarda nada sin que la persona revise los importes contra el PDF. */
const LIQ={liq_granos:{cod:9001,nombre:'Liquidación primaria de granos'},liq_venta:{cod:9002,nombre:'Liquidación de venta (hacienda)'},liq_leche:{cod:9003,nombre:'Liquidación única de leche'}};
const liqNorm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const liqPlata=n=>Math.round((n+Number.EPSILON)*100)/100;
/** Importes con dos decimales, en formato argentino (1.234,56) o inglés (1,234.56). Ignora porcentajes y números sin decimales. */
function liqMontos(s){
  const t=String(s).replace(/\d{1,3}(?:[.,]\d{1,3})?\s*%/g,' '),out=[],re=/-?\d[\d.,]*\d|-?\d/g;let m;
  while((m=re.exec(t))){const k=m[0];let v=null;
    if(/^-?\d{1,3}(,\d{3})+\.\d{2}$/.test(k))v=Number(k.replace(/,/g,''));
    else if(/^-?\d{1,3}(\.\d{3})+,\d{2}$/.test(k))v=Number(k.replace(/\./g,'').replace(',','.'));
    else if(/^-?\d+\.\d{2}$/.test(k))v=Number(k);
    else if(/^-?\d+,\d{2}$/.test(k))v=Number(k.replace(',','.'));
    if(v!==null&&isFinite(v))out.push(v)}
  return out;
}
const liqUlt=a=>a.length?a[a.length-1]:null;
const liqBuscar=(L,re,desde)=>{for(let i=desde||0;i<L.length;i++)if(re.test(liqNorm(L[i])))return i;return -1};
const liqTasa=(neto,iva)=>{if(!(neto>0))return null;const t=iva/neto*100;return [10.5,21,27,5,2.5].find(x=>Math.abs(x-t)<0.05)||null};

function liqLineas(items){
  const filas=[];
  for(const it of items){if(!it.str||!it.str.trim())continue;const y=it.transform[5],x=it.transform[4];let f=filas.find(r=>Math.abs(r.y-y)<2.5);if(!f){f={y,items:[]};filas.push(f)}f.items.push({x,s:it.str})}
  filas.sort((a,b)=>b.y-a.y);
  return filas.map(f=>f.items.sort((a,b)=>a.x-b.x).map(i=>i.s).join(' ').replace(/\s+/g,' ').trim()).filter(Boolean);
}
function cargarScript(src){return new Promise((ok,mal)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>mal(new Error('No se pudo cargar '+src));document.head.appendChild(s)})}
async function pdfTexto(file){
  if(typeof pdfjsLib==='undefined')await cargarScript('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js').catch(()=>{});
  if(typeof pdfjsLib==='undefined')throw new Error('No se pudo cargar el lector de PDF (¿sin conexión a internet?). Podés cargar los importes a mano.');
  if(!pdfjsLib.GlobalWorkerOptions.workerSrc){try{const r=await fetch('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([await r.text()],{type:'text/javascript'}))}catch(e){}}
  const doc=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise,lineas=[];
  for(let n=1;n<=doc.numPages&&n<=15;n++){const pg=await doc.getPage(n),tc=await pg.getTextContent();lineas.push(...liqLineas(tc.items))}

/* ---- Reconocer el tipo de liquidación por su título ---- */
function liqPerfil(L){
  const t=liqNorm(L.join(' '));
  if(/liquidacion primaria de granos/.test(t))return 'liq_granos';
  if(/liquidacion unica|comercial impositiva/.test(t))return 'liq_leche';
  if(/cuenta de venta y liquido producto|hacienda/.test(t))return 'liq_venta';
  return null;
}
const liqFecha=(L,re)=>{const i=liqBuscar(L,re||/fecha/);const s=i>=0?(L[i].match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/)||[])[0]:null;return s?pDate(s):null};

/* ---- Lectura genérica (cuando no se reconoce el tipo): busca importes con etiquetas típicas y los valida entre sí ---- */
function liqGenerico(lineas,cuitCliente){
  const RATES=[10.5,21,27,5,2.5],cand=[],avisos=[];
  lineas.forEach((l,i)=>{
    const n=liqNorm(l),m=liqMontos(l);if(!m.length)return;const roles=[];
    if(/neto\s*gravado|importe\s*neto|subtotal|base\s*imponible|total\s*bruto|importe\s*bruto|precio\s*neto|total\s*operacion|operacion\s*gravada|\bneto\b/.test(n)&&!/a\s*(cobrar|pagar)|retenc|percepc|deduc/.test(n))roles.push('neto');
    if(/\biva\b/.test(n)&&!/retenc|percepc|rg\s*\d|inscripto|exento|no\s*responsable/.test(n))roles.push('iva');
    if((/importe\s*total|total\s*liquidacion|total\s*general|total\s*a\s*(pagar|cobrar)|total\s*comprobante|^total\b|\btotal\s*[:$]?\s*[\d.-]/.test(n))&&!/iva|retenc|deduc|percepc|gastos|comision/.test(n))roles.push('total');
    const a=n.match(/(\d{1,2}(?:[.,]\d{1,2})?)\s*%/);
    if(roles.length)cand.push({i,linea:l,montos:m,roles,alic:a?Number(a[1].replace(',','.')):null});
  });
  const netos=cand.filter(c=>c.roles.includes('neto')),ivas=cand.filter(c=>c.roles.includes('iva')),tots=cand.filter(c=>c.roles.includes('total'));
  let mejor=null;
  for(const cn of netos)for(const nv of cn.montos)for(const ci of ivas)for(const iv of ci.montos){
    for(const t of (ci.alic?[ci.alic]:cn.alic?[cn.alic]:RATES)){
      if(nv>0&&iv>0&&Math.abs(nv*t/100-iv)<=Math.max(1,nv*0.0005)){let tot=null;for(const ct of tots)for(const tv of ct.montos)if(Math.abs(nv+iv-tv)<=1.5)tot=tv;
        const score=(tot!==null?2:0)+(ci.alic?1:0);if(!mejor||score>mejor.score)mejor={neto:nv,iva:iv,alic:t,total:tot,score}}}}
  const r={neto:null,iva:null,alic:null,total:null,avisos,candidatos:cand.slice(0,16).map(c=>({linea:c.linea.slice(0,110),montos:c.montos.slice(0,4),roles:c.roles}))};
  if(mejor){Object.assign(r,{neto:mejor.neto,iva:mejor.iva,alic:mejor.alic,total:mejor.total});if(mejor.total===null){r.total=liqPlata(mejor.neto+mejor.iva);avisos.push('No se encontró el total en el PDF: se calculó como neto más IVA.')}}
  else{const pick=(arr)=>arr[0]?Math.max(...arr[0].montos):null;r.neto=pick(netos);r.iva=pick(ivas);r.total=pick(tots);r.alic=(ivas[0]&&ivas[0].alic)||null}
  const todasF=(lineas.join(' ').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/)||[])[0];
  r.fecha=liqFecha(lineas)||(todasF?pDate(todasF):null);
  r.pv=null;r.num=null;
  for(const l of lineas){const m=l.match(/(\d{4,5})\s*[-–]\s*(\d{8})\b/);if(m){r.pv=Number(m[1]);r.num=Number(m[2]);break}}
  if(r.num===null)for(const l of lineas){const m=liqNorm(l).match(/c\.?o\.?e\.?\D{0,12}(\d{12})/);if(m){r.pv=0;r.num=Number(m[1]);r.coe=true;break}}
  const cuits=[];lineas.forEach((l,i)=>{const re=/\b(20|23|24|27|30|33|34)[- .]?(\d{8})[- .]?(\d)\b/g;let x;while((x=re.exec(l))){const c=x[1]+x[2]+x[3];if(c!==cuitCliente&&!cuits.some(y=>y.c===c))cuits.push({c,i,l})}});
  r.cuit=cuits[0]?cuits[0].c:null;
  if(cuits[0]){const t=cuits[0].l.split(/cuit/i)[0].replace(/^.*?:\s*/,'').trim();if(t.length>=3&&t.length<=70&&!/\d{6,}/.test(t))r.nombre=t}
  return r;
}

/* ---- Lectura específica de cada tipo ---- */
/** Liquidación primaria de granos: el cliente es el VENDEDOR. IVA de la operación = débito fiscal; trae retenciones de IVA y Ganancias. */
function liqGranos(L,cuitCli,razonCli){
  const d={},ret=[],info=[];
  const iC=liqBuscar(L,/c\.?o\.?e\.?\s*:/);if(iC>=0){const m=L[iC].match(/(\d{12})/);if(m){d.pv=0;d.num=Number(m[1]);d.coe=true}}

  const ri=liqBuscar(L,/retencion iva/);if(ri>=0){const v=liqMontos(L[ri]);if(v.length)ret.push({tipo:'retencion',impuesto:'IVA',importe:liqUlt(v),etq:'Retención de IVA'})}

  const rg4=liqBuscar(L,/iva rg 4310/);if(rg4>=0){const m=L[rg4].match(/IVA RG 4310\/2018:\s*\$\s*([\d.,]+)/i);if(m){const v=liqMontos(m[1]);if(v.length)info.push(`IVA RG 4310/2018: ${money(v[0])} (informativo: se paga aparte, no es una retención).`)}}

  if(rs.length){const mio=razonCli?liqNorm(razonCli).slice(0,14):'',pri=rs.find(i=>!mio||!liqNorm(L[i]).includes(mio));if(pri!==undefined){let n=L[pri].replace(/^[^:]*:\s*/,'').trim();const sig=L[rs[rs.length-1]+1];if(sig&&!/^(domicilio|localidad|c\.u\.i\.t|i\.v\.a|ingresos|razon|actuo)/.test(liqNorm(sig))&&sig.length<60)n+=' '+sig.trim();d.nombre=n}}
  const tOp=liqBuscar(L,/total operacion/),totalOp=tOp>=0?liqMontos(L[tOp])[0]:null;
  return {datos:d,retenciones:ret,info,cruce:()=>totalOp===null||totalOp===undefined||d.total===undefined?null:Math.abs(totalOp-d.total)<=1.5};

/** Cuenta de venta y líquido producto (hacienda): el cliente es el productor. IVA s/bruto = débito; IVA s/gastos = crédito. */

  const iC=L.findIndex(l=>/\b\d{11}\s*-\s*[^\d]+?\s+\d/.test(l)&&/kg|cabez/i.test(l));

  if(gastos!==null&&ivaG!==null)info.push(`La comisión y los gastos suman ${money(gastos)} con IVA de ${money(ivaG)}: es crédito fiscal y entra por el Libro IVA de compras.`);

/** Liquidación única comercial impositiva (leche): el cliente es el tambero. Total liquidación = neto gravado; la percepción de IVA es a favor. */
function liqLeche(L,cuitCli){
  const d={},ret=[],info=[];
  d.fecha=liqFecha(L,/fecha comprobante/)||liqFecha(L,/fecha/);
  const iN=liqBuscar(L,/n\u00b0?:?\s*\d{4,5}\s*-\s*\d{8}/);if(iN>=0){const m=L[iN].match(/(\d{4,5})\s*-\s*(\d{8})/);if(m){d.pv=Number(m[1]);d.num=Number(m[2])}}
  const iT=liqBuscar(L,/^total liquidacion/);if(iT>=0){const v=liqMontos(L[iT]);if(v.length)d.neto=liqUlt(v)}
  const iA=liqBuscar(L,/alicuota iva.*importe iva/);if(iA>=0){const v=liqMontos(L[iA]);if(v.length>=2){d.alic=v[0];d.iva=liqUlt(v)}}
  if(d.neto!==undefined&&d.iva!==undefined)d.total=liqPlata(d.neto+d.iva);
  const iP=liqBuscar(L,/percepcion de iva/);if(iP>=0){const v=liqMontos(L[iP]);if(v.length){const imp=liqUlt(v);if(imp>0)ret.push({tipo:'percepcion',impuesto:'IVA',importe:imp,etq:'Percepción de IVA'+(v.length>=3?' ('+String(v[1]).replace('.',',')+'%)':'')})}}
  const iNL=liqBuscar(L,/^neto liquidacion/),netoLiq=iNL>=0?liqUlt(liqMontos(L[iNL])):null,percep=ret.reduce((a,x)=>a+x.importe,0);
  const iE=liqBuscar(L,/razon social:.*cuit/);if(iE>=0){const m=L[iE].match(/Raz[oó]n Social:\s*(.+?)\s+CUIT:\s*(\d{11})/i);if(m&&m[2]!==cuitCli){d.nombre=m[1].trim();d.cuit=m[2]}}
  const cr=(d.neto!==undefined&&d.iva!==undefined&&netoLiq!==null)?Math.abs(d.neto+d.iva-percep-netoLiq)<=1.5:null;
  if(netoLiq!==null)info.push(`El "Neto liquidación" del PDF (${money(netoLiq)}) ya descuenta la percepción de IVA: para el IVA se usa el "Total liquidación" como neto gravado.`);
  return {datos:d,retenciones:ret,info,cruce:()=>cr};
}

/** Lectura completa: reconoce el tipo, lee por tipo y valida (IVA = neto x alícuota; el total cierra; el PDF menciona al cliente). */
function liqExtraer(lineas,cuitCliente,razonCliente){
  const perfil=liqPerfil(lineas),gen=liqGenerico(lineas,cuitCliente),fn={liq_granos:liqGranos,liq_venta:liqHacienda,liq_leche:liqLeche}[perfil];
  const r={...gen,perfil,retenciones:[],info:[],avisos:[...gen.avisos]};let cruce=null;
  if(fn){const e=fn(lineas,cuitCliente,razonCliente);for(const [k,v] of Object.entries(e.datos))if(v!==null&&v!==undefined)r[k]=v;r.retenciones=e.retenciones||[];r.info=e.info||[];cruce=e.cruce?e.cruce():null;r.avisos=[]}
  const okIva=r.neto>0&&r.iva>=0&&r.alic!==null&&r.alic!==undefined&&Math.abs(r.neto*r.alic/100-r.iva)<=Math.max(1,r.neto*0.0005);
  const okTot=r.total!==null&&r.total!==undefined&&Math.abs(r.neto+r.iva-r.total)<=1.5;
  r.confianza=okIva&&okTot&&cruce!==false?'alta':okIva?'media':'baja';
  if(!fn&&r.confianza==='alta'&&gen.avisos.some(x=>/No se encontró el total/.test(x)))r.confianza='media';
  if(fn&&cruce===false)r.avisos.push('El PDF tiene importes que no cierran entre sí: revisá el documento.');
  if(!okIva)r.avisos.push('No se pudo confirmar que el IVA coincida con el neto por la alícuota: revisá los importes con mucho cuidado.');
  if(!fn&&r.total!==null&&!okTot&&okIva)r.avisos.push('El total del PDF no coincide con neto más IVA.');
  if(cuitCliente&&!lineas.join(' ').replace(/[-. ]/g,'').includes(cuitCliente))r.avisos.push('El PDF no menciona el CUIT del cliente elegido ('+cuitF(cuitCliente)+'): verificá que sea el cliente correcto.');
  if(!lineas.length)r.avisos.unshift('El PDF no tiene texto que se pueda leer (parece una imagen escaneada). Cargá los importes a mano.');
  return r;
}

const LIBRO_TIPOS={'FACTURA A':1,'NOTA DE DEBITO A':2,'NOTA DE CREDITO A':3,'FACTURA B':6,'NOTA DE DEBITO B':7,'NOTA DE CREDITO B':8,'FACTURA C':11,'NOTA DE DEBITO C':12,'NOTA DE CREDITO C':13,'FACTURA M':51,'NOTA DE DEBITO M':52,'NOTA DE CREDITO M':53,
  'TIQUE FACTURA A':81,'TICKET FACTURA A':81,'TIQUE FACTURA B':82,'TICKET FACTURA B':82,'TIQUE':83,'TICKET':83,'RESUMEN BANCARIO':9101,'LIQUIDACION':9102,'LIQUIDACIONES':9102};

  if(h<0)return {ok:false,error:'No se reconoció el formato del Libro IVA Compras. Tiene que traer las columnas COMPROBANTE, NUMERO, CUIT, NETO, IVA MONTO y TOTAL.'};
  const top=rows.slice(0,h).flat().map(c=>String(c??'')).join(' '),pm=top.match(/periodo\s*desde\D*(\d{1,2})\/(\d{4}).*?periodo\s*hasta\D*(\d{1,2})\/(\d{4})/i);

  for(let i=h+1;i<rows.length;i++){
    const r=rows[i]||[],txt=r.map(c=>String(c??'')).join(' '),mc=txt.match(/cantidad de comprobantes\D*(\d+)/i);
    if(mc){pie={cantidad:+mc[1],neto:pNum(r[ix.neto]),iva:pNum(r[ix.ivam]),total:pNum(r[ix.total])};continue}
    if(r.every(c=>String(c??'').trim()===''))continue;
    const tipoTxt=lbTipo(r[ix.tipo]);if(!tipoTxt)continue;filas++;
    const numS=String(r[ix.numero]??'').trim(),mn0=numS.match(/^(\d+)\s*-\s*(\d+)$/),dig=numS.replace(/\D/g,''),coe=!mn0&&dig.length>=6&&dig.length<=15,mn=mn0?[0,mn0[1],mn0[2]]:(coe?[0,'0',dig]:null),cuit=String(r[ix.cuit]??'').replace(/\D/g,''),fc=pDate(r[ix.fcomp!==undefined?ix.fcomp:ix.fechaLibro]),p=[];

  }
  const sumas={neto:0,iva:0,total:0};
  const comprobantes=[...grupos.values()].map(g=>{
    sumas.neto+=g.neto;sumas.iva+=g.iva;sumas.total+=g.total;
    const nc=esNC(g.tipo_cmp),f=v=>liqPlata(nc?Math.abs(v):v),otros=g.interno+g.pivas+g.piibb,sinTotal=g.filasTotal===0,total=sinTotal?g.neto+g.nograv+otros+g.iva:g.total;
    const c={clave:g.clave,tipoTxt:g.tipoTxt,tipo_cmp:g.tipo_cmp,pv:g.pv,numero:g.numero,coe:g.coe,cuit:g.cuit,proveedor:g.proveedor,fecha:g.fecha,naturaleza:g.naturaleza,nc,
      neto:f(g.neto),nograv:f(g.nograv),otros:f(otros),pivas:f(g.pivas),piibb:f(g.piibb),interno:f(g.interno),iva:f(g.iva),total:f(total),
      cierra:Math.abs(g.neto+g.nograv+otros+g.iva-total)<=1.5,repetidoEnLibro:g.filasTotal>1,sinTotal};
    const raw={'Origen':'Libro IVA Compras','Tipo':g.tipoTxt,'Naturaleza':g.naturaleza,'Neto Gravado Total':c.neto,'Neto No Gravado':c.nograv,'Impuestos Internos':f(g.interno),'Percepción IVA':c.pivas,'Percepción IIBB':c.piibb,'Total IVA':c.iva,'Imp. Total':c.total};
    for(const [k,t] of Object.entries(g.rates)){const a=String(+k).replace('.',',');raw['Neto Grav. IVA '+a+'%']=f(t.neto);if(+k>0)raw['IVA '+a+'%']=f(t.iva)}
    c.raw=raw;return c;
  });
  return {ok:true,periodo,comprobantes,errores,filas,pie,sumas:{neto:liqPlata(sumas.neto),iva:liqPlata(sumas.iva),total:liqPlata(sumas.total)}};
}

/** Compara el Libro con lo que ya está en el sistema (todo lo del cliente, de cualquier período). */
function planLibro(lib,ex,periodo){
  const k4=(c,t,p,n)=>[c,t,p,n].join('|'),k3=(c,p,n)=>[c,p,n].join('|'),m4=new Map(),m3=new Map();
  ex.forEach(e=>{m4.set(k4(e.emisor_cuit,e.tipo_cmp,e.punto_venta,e.numero),e);const k=k3(e.emisor_cuit,e.punto_venta,e.numero);if(!m3.has(k))m3.set(k,[]);m3.get(k).push(e)});
  const p={nuevos:[],repetidos:[],posibles:[],difs:[],arcaSinLibro:[]},vistos=new Set();
  for(const c of lib.comprobantes){
    const e=m4.get(k4(c.cuit,c.tipo_cmp,c.pv,c.numero));
    if(e){vistos.add(e);p.repetidos.push({c,e});if(Math.abs(Math.abs(Number(e.importe_total))-Math.abs(c.total))>1)p.difs.push({c,e});continue}
    const alt=m3.get(k3(c.cuit,c.pv,c.numero));
    if(alt){alt.forEach(a=>vistos.add(a));p.posibles.push({c,alt});continue}
    p.nuevos.push(c);
  }
  p.arcaSinLibro=ex.filter(e=>e.origen!=='libro_iva'&&e.proc_status!=='excluido'&&String(e.fecha).startsWith(periodo)&&!vistos.has(e));
  return p;
}

/* ===== Selector de mes que funciona en cualquier navegador (con flechas) ===== */
function mesPick(v,js,id){
  const hoy=new Date(),base=hoy.getFullYear()*12+hoy.getMonth(),opts=[];
  for(let i=-47;i<=6;i++){const t=base+i;opts.push(Math.floor(t/12)+'-'+String(t%12+1).padStart(2,'0'))}
  if(v&&!opts.includes(v)){opts.push(v);opts.sort()}
  return `<span class="mes"><button type="button" class="g sm" title="Mes anterior" onclick="mesMover(this,-1)">◀</button><select ${id?`id="${id}"`:''} onchange="${String(js).replace(/"/g,'&quot;')}">${opts.map(o=>`<option value="${o}" ${o===v?'selected':''}>${MESES[+o.slice(5)-1]} ${o.slice(0,4)}</option>`).join('')}</select><button type="button" class="g sm" title="Mes siguiente" onclick="mesMover(this,1)">▶</button></span>`;
}

/* ===== IVA aproximado: cálculo ===== */
/** Orden de la liquidación: saldo técnico del período; se compensa con el saldo técnico a favor anterior; lo que queda se cancela con
    el saldo de libre disponibilidad anterior, las retenciones/percepciones sufridas y los pagos a cuenta. Lo que sobra pasa al mes siguiente. */
function ivaCalcular(p){
  const r2=x=>Math.round((x+Number.EPSILON)*100)/100,ST=r2((p.deb||0)-(p.cred||0)),stAnt=Math.max(0,p.stAnt||0),sldAnt=Math.max(0,p.sldAnt||0),ret=Math.max(0,p.retPerc||0),pag=Math.max(0,p.pagos||0);
  let usadoST=0,base=0,stNuevo;
  if(ST<0)stNuevo=r2(stAnt-ST);else{usadoST=Math.min(stAnt,ST);base=r2(ST-usadoST);stNuevo=r2(stAnt-usadoST)}
  const aplicables=r2(sldAnt+ret+pag),consumido=Math.min(base,aplicables);
  return {saldoTecnico:ST,usadoST:r2(usadoST),base,aplicables,consumido:r2(consumido),aPagar:r2(base-consumido),stNuevo,sldNuevo:r2(aplicables-consumido)};
}
const ivaSum=rows=>rows.reduce((a,x)=>a+sgnVal(x.tipo_cmp,x.iva),0);
function ivaResultado(d){
  const deb=ivaSum(d.ven),cred=ivaSum(d.com),percLibro=d.com.reduce((a,x)=>a+sgnVal(x.tipo_cmp,Number(x.raw&&x.raw['Percepción IVA'])||0),0),
    retIva=d.ret.filter(x=>x.impuesto==='IVA').reduce((a,x)=>a+Number(x.importe),0),incl=!d.aj.excluir_percep_libro,extra=Number(d.aj.retenciones_percepciones||0),retTotal=retIva+(incl?percLibro:0)+extra;
  return {deb,cred,percLibro,retIva,incl,extra,retTotal,...ivaCalcular({deb,cred,stAnt:Number(d.aj.saldo_tecnico_anterior||0),sldAnt:Number(d.aj.saldo_libre_disp||0),retPerc:retTotal,pagos:Number(d.aj.pagos_a_cuenta||0)})};
}
/** Carga lo necesario de un cliente y mes. Si todavía no hay ajustes de ese mes, los saldos "anteriores" salen del cierre del mes anterior. */
async function ivaCargar(cid,per){
  const pr=await sb.from('client_periods').select('id').eq('client_id',cid).eq('periodo',per+'-01').maybeSingle();if(pr.error)throw pr.error;
  let ven=[],com=[];
  if(pr.data)[ven,com]=await Promise.all([fetchAll((a,b)=>sb.from('sales_invoices').select('tipo_cmp,iva,neto_gravado,raw').eq('period_id',pr.data.id).range(a,b)),fetchAll((a,b)=>sb.from('vouchers').select('tipo_cmp,iva,neto_gravado,raw').eq('period_id',pr.data.id).neq('proc_status','excluido').range(a,b))]);
  const [aj,prev,ret]=await Promise.all([sb.from('iva_ajustes').select('*').eq('client_id',cid).eq('periodo',per+'-01').maybeSingle(),sb.from('iva_ajustes').select('*').eq('client_id',cid).eq('periodo',antPrevPer(per)+'-01').maybeSingle(),sb.from('iva_retenciones').select('*').eq('client_id',cid).eq('periodo',per+'-01').order('fecha')]);
  for(const r of [aj,prev,ret])if(r.error)throw r.error;
  let ajuste=aj.data,prefill=false;const cierrePrev=prev.data&&prev.data.cierre_saldo_tecnico!==null&&prev.data.cierre_saldo_tecnico!==undefined;
  if(!ajuste){ajuste={saldo_tecnico_anterior:cierrePrev?Number(prev.data.cierre_saldo_tecnico):0,saldo_libre_disp:cierrePrev?Number(prev.data.cierre_saldo_libre||0):0,retenciones_percepciones:0,pagos_a_cuenta:0,excluir_percep_libro:false};prefill=cierrePrev}
  return {cid,per,ven,com,aj:ajuste,prev:prev.data,prefill,ret:ret.data};
}

/* ---- Retenciones y percepciones: carga a mano e importación con mapeo de columnas ---- */
const RET_COLS={fecha:['fecha','fecha retencion','fecha percepcion','fecha de retencion','fecha de percepcion','fecha comprobante','fecha operacion','fecha de operacion'],
  importe:['importe','importe retenido','importe retencion','importe percepcion','importe percibido','monto','monto retenido','importe retenido percibido','importe retencion percepcion','importe retenido o percibido'],
  impuesto:['impuesto','descripcion impuesto','desc impuesto','codigo impuesto','tributo','descripcion del impuesto'],
  agente_cuit:['cuit agente','cuit agente de retencion','cuit retenedor','cuit agente retencion','cuit del agente','cuit agente retencion percepcion','cuit'],
  agente_nombre:['denominacion agente','denominacion agente de retencion','denominacion','razon social','agente de retencion','agente','razon social agente'],
  comprobante:['numero comprobante','nro comprobante','numero de comprobante','comprobante','numero','nro','numero de retencion'],
  tipo:['tipo','tipo retencion percepcion','tipo de operacion','retencion percepcion','operacion']};
const RET_ETQ={fecha:'Fecha',importe:'Importe',impuesto:'Impuesto',agente_cuit:'CUIT del agente',agente_nombre:'Nombre del agente',comprobante:'N° de comprobante',tipo:'Tipo (retención o percepción)'};
/** Reconoce una columna por su nombre: primero por la lista exacta y, si no, por palabras clave (tolera "N° Comprobante", "Fecha Retención", etc.). */
function retCampoDe(h){
  const k=norm(h);if(!k)return null;
  for(const [f,al] of Object.entries(RET_COLS))if(al.includes(k))return {f,p:3};
  if(/fecha/.test(k))return {f:'fecha',p:1};
  if(/importe|monto/.test(k))return {f:'importe',p:/retenid|percibid|retencion|percepcion/.test(k)?2:1};
  if(/impuesto|tributo/.test(k))return {f:'impuesto',p:1};
  if(/cuit/.test(k))return {f:'agente_cuit',p:1};
  if(/denominacion|razon social|nombre/.test(k))return {f:'agente_nombre',p:1};
  if(/comprobante|numero|^nro/.test(k))return {f:'comprobante',p:1};
  if(/^tipo/.test(k))return {f:'tipo',p:1};
  return null;
}
function retDetectar(rows){
  let best=null;
  for(let i=0;i<Math.min(rows.length,20);i++){const m={},pr={};(rows[i]||[]).forEach((c,j)=>{const x=retCampoDe(c);if(!x)return;if(m[x.f]===undefined||x.p>pr[x.f]){m[x.f]=j;pr[x.f]=x.p}});const n=Object.keys(m).length;if(m.importe!==undefined&&m.fecha!==undefined&&(!best||n>best.n))best={h:i,m,n}}
  return best;
}
/** Arma el plan de importación con el mapeo elegido: filtra por impuesto y por mes, y omite lo que ya está cargado. */
function retPlan(R,existentes){
  const {rows,h,m}=R,out={nuevos:[],ya:[],fuera:[],otros:0,errores:0},k=x=>[x.fecha,x.tipo,x.agente_cuit||'',x.comprobante||'',x.importe.toFixed(2)].join('|'),vistos=new Set(existentes.map(k));
  const filtro=norm(R.filtro||'');
  for(let i=h+1;i<rows.length;i++){
    const r=rows[i]||[];if(r.every(c=>String(c??'').trim()===''))continue;
    const g=f=>m[f]!==undefined&&m[f]!==''?r[m[f]]:null,fecha=pDate(g('fecha')),imp=pNum(g('importe'));
    if(!fecha||imp===null){out.errores++;continue}
    if(filtro&&m.impuesto!==undefined&&m.impuesto!==''&&!norm(g('impuesto')).includes(filtro)){out.otros++;continue}
    const t=m.tipo!==undefined&&m.tipo!==''?(/percep/i.test(String(g('tipo')))?'percepcion':'retencion'):R.tipo;
    const x={fecha,tipo:t,impuesto:'IVA',agente_cuit:String(g('agente_cuit')??'').replace(/\D/g,'')||null,agente_nombre:g('agente_nombre')?String(g('agente_nombre')).trim():null,comprobante:g('comprobante')!==null?String(g('comprobante')).trim():null,importe:Math.abs(imp)};
    if(fecha.slice(0,7)!==R.per){out.fuera.push(x);continue}
    if(vistos.has(k(x))){out.ya.push(x);continue}
    vistos.add(k(x));out.nuevos.push(x);
  }
  return out;
}
async function retArchivo(){
  const f=$('rfile').files[0],P=ui.ivaP,bad=m=>{flash(m,'err');draw()};
  if(!f)return bad('Subí el Excel o CSV de retenciones y percepciones.');
  if(!/\.(xlsx?|csv)$/i.test(f.name))return bad('El archivo debe ser .xls, .xlsx o .csv.');
  if(f.size>10*1048576)return bad('El archivo supera los 10 MB.');

    <td><input type="date" value="${s.proxima_fecha}" onchange="recFecha('${s.id}',this.value)"><span class="s">${!s.activo?'pausado':f===0?'no hace falta reclamar':dias<0?'tocaba hace '+(-dias)+' d':dias===0?'HOY':'en '+dias+' días'}</span></td>
    <td>${s.repetir_cada_dias?'cada '+s.repetir_cada_dias+' días':'una vez'}${s.nota?`<span class="s">${esc(s.nota)}</span>`:''}</td><td>${s.ultimo_envio?fAR(s.ultimo_envio)+`<span class="s">${s.envios} envío(s)</span>`:'-'}</td>
    <td style="white-space:nowrap"><button class="b sm" onclick="abrirFicha('${s.client_id}','pedir','${per}')">Preparar</button> <input type="date" id="${idf}" value="${hoy}" style="width:140px" title="Fecha en que se envió"> <button class="g sm" onclick="recRegistrarDe('${s.client_id}','${per}','${idf}')">Registrar envío</button> <button class="g sm" onclick="recPausar('${s.id}',${!s.activo})">${s.activo?'Pausar':'Reanudar'}</button> <button class="dng sm" onclick="recQuitar('${s.id}')">Quitar</button></td></tr>`};
  const paraHoy=ui.cs.filter(s=>s.activo&&diasHasta(s.proxima_fecha)<=0&&faltanDe(s.client_id,s.periodo.slice(0,7))>0),resto=ui.cs.filter(s=>!paraHoy.includes(s));
  const tabla=(t,l,v)=>`<h3>${t} (${l.length})</h3>${l.length?`<div class="tw" style="margin-bottom:14px"><table><thead><tr><th>Cliente</th><th>Período</th><th>Faltan</th><th>Fecha del reclamo</th><th>Repite</th><th>Último envío</th><th></th></tr></thead><tbody>${l.map(fila).join('')}</tbody></table></div>`:`<div class="card" style="color:var(--mut);margin-bottom:14px">${v}</div>`}`;
  return `<h2>Reclamos de facturas</h2>
  <p class="s" style="margin-bottom:12px">Elegís la fecha en que querés reclamar las facturas que faltan. Ese día el reclamo aparece acá y en Avisos con el mensaje listo. WhatsApp no deja enviar mensajes solo desde una aplicación: la app lo prepara y vos tocás enviar. Después registrás la fecha real del envío y, si pusiste repetición, se programa el siguiente solo.</p>
  <div class="card row" style="margin-bottom:16px;align-items:end"><label>Cliente<br><select id="rcCli">${act.map(c=>`<option value="${c.id}" ${c.id===ui.cid?'selected':''}>${esc(c.razon_social)}</option>`).join('')}</select></label>
   <label>Facturas de<br>${mesPick(workPeriod(),'',"rcPer")}</label><label>Fecha del reclamo<br><input type="date" id="rcFecha" value="${sumarDias(hoy,1)}"></label>
   <label>Repetir<br><select id="rcRep"><option value="">No repetir</option>${[3,5,7,10,15].map(n=>`<option value="${n}">Cada ${n} días</option>`).join('')}</select></label><label style="flex:1;min-width:160px">Nota<br><input id="rcNota" style="width:100%" placeholder="Opcional"></label><button class="b" onclick="recProgramar()">Programar</button></div>
  ${tabla('Para enviar ahora',paraHoy,'No hay reclamos para enviar hoy.')}${tabla('Programados y terminados',resto,'Todavía no programaste reclamos.')}
  <h3>Historial de envíos</h3>${ui.cl.length?`<div class="tw"><table><thead><tr><th>Enviado</th><th>Cliente</th><th>Facturas de</th><th>Faltaban</th><th>Nota</th><th></th></tr></thead><tbody>${ui.cl.map(x=>`<tr><td>${fAR(x.enviado)}</td><td>${esc(cli(x.client_id).razon_social)}</td><td>${x.periodo.slice(5,7)}/${x.periodo.slice(0,4)}</td><td>${x.faltantes??'-'}</td><td>${esc(x.nota||'')}</td><td><button class="dng sm" onclick="recLogQuitar('${x.id}')">Quitar</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="card" style="color:var(--mut)">Todavía no registraste envíos.</div>'}`;
}
/** Bloque dentro de "Pedir facturas" de la ficha: registrar el envío con la fecha real y programar el próximo reclamo. */
function recBloque(c,f){
  const r=f.rec,per=r.periodo,hoy=hoyISO(),log=ui.cl.filter(x=>x.client_id===c.id&&x.periodo.slice(0,7)===per),s=ui.cs.find(x=>x.client_id===c.id&&x.periodo.slice(0,7)===per);
  return `<div class="card" style="margin:14px 0"><b>Registro de reclamos de ${per.slice(5)}/${per.slice(0,4)}</b>
  ${log.length?`<div class="s" style="margin:6px 0">Enviados: ${log.slice(0,4).map(x=>fAR(x.enviado)).join(', ')}${log.length>4?'…':''}</div>`:'<div class="s" style="margin:6px 0">Todavía no registraste ningún envío para este período.</div>'}
  <div class="row" style="align-items:end"><label>Fecha en que lo enviaste<br><input type="date" id="rdF" value="${hoy}"></label><button class="g" onclick="recRegistrarDe('${c.id}','${per}','rdF')">Registrar envío</button></div>
  <div class="row" style="align-items:end;margin-top:10px"><label>Programar el próximo reclamo para el<br><input type="date" id="rpF" value="${s?s.proxima_fecha:sumarDias(hoy,7)}"></label><label>Repetir<br><select id="rpR"><option value="">No repetir</option>${[3,5,7,10,15].map(n=>`<option value="${n}" ${s&&s.repetir_cada_dias===n?'selected':''}>Cada ${n} días</option>`).join('')}</select></label><button class="g" onclick="recProgramarDesde('${c.id}','${per}')">${s?'Reprogramar':'Programar'}</button></div>
  ${s?`<div class="s" style="margin-top:6px">Programado: ${fAR(s.proxima_fecha)}${s.repetir_cada_dias?', cada '+s.repetir_cada_dias+' días':''}${s.activo?'':' (pausado)'}.</div>`:''}</div>`;
}
async function recProgramarDesde(cid,per){
  const fecha=$('rpF').value,rep=$('rpR').value;if(esExento(ui.clients.find(x=>x.id===cid))){flash(exentoMsg(cid),'err');return draw()}if(!pDate(fecha)){flash('Elegí la fecha del próximo reclamo.','err');return draw()}
  const {error}=await sb.from('claim_schedules').upsert({client_id:cid,periodo:per+'-01',proxima_fecha:fecha,repetir_cada_dias:rep?Number(rep):null,activo:true,created_by:me.id},{onConflict:'client_id,periodo'});
  if(error)flash(errTxt(error),'err');else{await loadSched();flash(`Reclamo programado para el ${fAR(fecha)}.`)}draw();
}

init();
</script>
</body>
</html>
