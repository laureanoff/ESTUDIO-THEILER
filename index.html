/* ---- Retenciones y percepciones: carga a mano e importación con mapeo de columnas ---- */
const RET_COLS={fecha:['fecha','fecha retencion','fecha percepcion','fecha de retencion','fecha de percepcion','fecha comprobante','fecha operacion','fecha de operacion'],
  importe:['importe','importe retenido','importe retencion','importe percepcion','importe percibido','monto','monto retenido','importe retenido percibido','importe retencion percepcion','importe retenido o percibido'],
  impuesto:['impuesto','descripcion impuesto','desc impuesto','codigo impuesto','tributo','descripcion del impuesto'],
  agente_cuit:['cuit agente','cuit agente de retencion','cuit retenedor','cuit agente retencion','cuit del agente','cuit agente retencion percepcion','cuit'],
  agente_nombre:['denominacion agente','denominacion agente de retencion','denominacion','razon social','agente de retencion','agente','razon social agente'],
  comprobante:['numero comprobante','nro comprobante','numero de comprobante','comprobante','numero','nro','numero de retencion'],
  tipo:['tipo','tipo retencion percepcion','tipo de operacion','retencion percepcion','operacion']};
const RET_ETQ={fecha:'Fecha',importe:'Importe',impuesto:'Impuesto',agente_cuit:'CUIT del agente',agente_nombre:'Nombre del agente',comprobante:'N° de comprobante',tipo:'Tipo (retención o percepción)'};
/** Reconoce una columna por su nombre: primero por la lista exacta y, si no, por palabras clave (tolera "N° Comprobante", "Fecha Retención", etc.). */
function retCampoDe(h){
  const k=norm(h);if(!k)return null;
  for(const [f,al] of Object.entries(RET_COLS))if(al.includes(k))return {f,p:3};
  if(/fecha/.test(k))return {f:'fecha',p:1};
  if(/importe|monto/.test(k))return {f:'importe',p:/retenid|percibid|retencion|percepcion/.test(k)?2:1};
  if(/impuesto|tributo/.test(k))return {f:'impuesto',p:1};
  if(/cuit/.test(k))return {f:'agente_cuit',p:1};
  if(/denominacion|razon social|nombre/.test(k))return {f:'agente_nombre',p:1};
  if(/comprobante|numero|^nro/.test(k))return {f:'comprobante',p:1};
  if(/^tipo/.test(k))return {f:'tipo',p:1};
  return null;
}
function retDetectar(rows){
  let best=null;
  for(let i=0;i<Math.min(rows.length,20);i++){const m={},pr={};(rows[i]||[]).forEach((c,j)=>{const x=retCampoDe(c);if(!x)return;if(m[x.f]===undefined||x.p>pr[x.f]){m[x.f]=j;pr[x.f]=x.p}});const n=Object.keys(m).length;if(m.importe!==undefined&&m.fecha!==undefined&&(!best||n>best.n))best={h:i,m,n}}
  return best;
}
/** Arma el plan de importación con el mapeo elegido: filtra por impuesto y por mes, y omite lo que ya está cargado. */
function retPlan(R,existentes){
  const {rows,h,m}=R,out={nuevos:[],ya:[],fuera:[],otros:0,errores:0},k=x=>[x.fecha,x.tipo,x.agente_cuit||'',x.comprobante||'',x.importe.toFixed(2)].join('|'),vistos=new Set(existentes.map(k));
  const filtro=norm(R.filtro||'');
  for(let i=h+1;i<rows.length;i++){
    const r=rows[i]||[];if(r.every(c=>String(c??'').trim()===''))continue;
    const g=f=>m[f]!==undefined&&m[f]!==''?r[m[f]]:null,fecha=pDate(g('fecha')),imp=pNum(g('importe'));
    if(!fecha||imp===null){out.errores++;continue}
    if(filtro&&m.impuesto!==undefined&&m.impuesto!==''&&!norm(g('impuesto')).includes(filtro)){out.otros++;continue}
    const t=m.tipo!==undefined&&m.tipo!==''?(/percep/i.test(String(g('tipo')))?'percepcion':'retencion'):R.tipo;
    const x={fecha,tipo:t,impuesto:'IVA',agente_cuit:String(g('agente_cuit')??'').replace(/\D/g,'')||null,agente_nombre:g('agente_nombre')?String(g('agente_nombre')).trim():null,comprobante:g('comprobante')!==null?String(g('comprobante')).trim():null,importe:Math.abs(imp)};
    if(fecha.slice(0,7)!==R.per){out.fuera.push(x);continue}
    if(vistos.has(k(x))){out.ya.push(x);continue}
    vistos.add(k(x));out.nuevos.push(x);
  }
  return out;
}
async function retArchivo(){
  const f=$('rfile').files[0],P=ui.ivaP,bad=m=>{flash(m,'err');draw()};
  if(!f)return bad('Subí el Excel o CSV de retenciones y percepciones.');
  if(!/\.(xlsx?|csv)$/i.test(f.name))return bad('El archivo debe ser .xls, .xlsx o .csv.');
  if(f.size>10*1048576)return bad('El archivo supera los 10 MB.');
  if(typeof XLSX==='undefined')return bad('No se pudo cargar el lector de Excel (¿sin conexión a internet?).');
  let rows;try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:false,raw:true});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:null})}catch(e){return bad('No se pudo abrir el archivo: ¿está dañado?')}
  const det=retDetectar(rows);
  P.retImp={file:f.name,rows,h:det?det.h:0,m:det?{...det.m}:{},detectado:!!det,filtro:'IVA',tipo:'retencion',per:P.periodo};
  draw();
}

  <div style="height:10px;border-radius:99px;background:var(--hd);overflow:hidden;border:1px solid var(--bd);margin-bottom:14px"><div style="height:100%;width:${pct}%;background:var(--pri)"></div></div>
  <div class="tw"><table><thead><tr><th>Cliente</th>${CUM_COLS.map(([k,t])=>`<th>${t}</th>`).join('')}<th>Facturas faltantes</th></tr></thead><tbody>

ui.cfg={avisos:{dias_antes:5,dias_urgente:2,dias_vencido:7,whatsapp:''}};ui.cs=[];ui.cl=[];
async function loadCfg(){try{const {data,error}=await sb.from('app_config').select('*');if(error)return;(data||[]).forEach(r=>{ui.cfg[r.key]={...(ui.cfg[r.key]||{}),...r.value}})}catch(e){}}
async function loadSched(){const [a,b]=await Promise.all([sb.from('claim_schedules').select('*').order('proxima_fecha'),sb.from('claim_log').select('*').order('enviado',{ascending:false}).limit(100)]);if(a.error)throw a.error;if(b.error)throw b.error;ui.cs=a.data;ui.cl=b.data}
const faltanDe=(cid,per)=>{const r=ui.pst.find(x=>x.client_id===cid&&x.periodo.slice(0,7)===per);return r?r.faltan:0};
function calcAvisos(){
  const cfg=ui.cfg.avisos,out=[];
  for(const d of ui.dl){
    const n=diasHasta(d.fecha);if(n>cfg.dias_antes||n<-cfg.dias_vencido)continue;
    for(const c of afectados(d)){const p=presDeVenc(c,d);if(p.k==='ok')continue;
      if(p.k==='na'){if(n>=0&&n<=cfg.dias_urgente)out.push({tipo:'info',n,d,c});continue}
      out.push({tipo:p.k==='venc'?'vencido':(n<=cfg.dias_urgente?'urgente':'proximo'),n,d,c});}
  }
  for(const s of ui.cs){if(!s.activo)continue;const dias=diasHasta(s.proxima_fecha);if(dias>0)continue;const c=ui.clients.find(x=>x.id===s.client_id);if(!c||c.active===false||esExento(c))continue;const f=faltanDe(s.client_id,s.periodo.slice(0,7));if(f>0)out.push({tipo:'reclamo',n:dias,s,c,f})}
  const ord={vencido:0,reclamo:1,urgente:2,proximo:3,info:4};return out.sort((a,b)=>ord[a.tipo]-ord[b.tipo]||a.n-b.n||a.c.razon_social.localeCompare(b.c.razon_social,'es'));
}
const avisosCuenta=()=>calcAvisos().filter(x=>x.tipo!=='info'&&x.tipo!=='proximo').length;
const navBadge=k=>{if(k!=='avisos')return '';const n=avisosCuenta();return n?` <span class="tag" style="background:var(--red);color:var(--redt);margin-left:4px">${n}</span>`:''};
const AV_ETQ={vencido:['Vencidos sin presentar','red'],reclamo:['Reclamos para enviar','blu'],urgente:['Urgentes','amb'],proximo:['Próximos','org'],info:['Vencen pronto (se controlan en otra sección)','blu']};
function avLinea(x){

function avMensaje(){

  if(!cid||!/^\d{4}-\d{2}$/.test(per))return bad('Elegí el cliente y el período.');if(!pDate(fecha))return bad('Elegí la fecha del reclamo.');
  const c=ui.clients.find(x=>x.id===cid);if(esExento(c))return bad(exentoMsg(cid));
  const {error}=await sb.from('claim_schedules').upsert({client_id:cid,periodo:per+'-01',proxima_fecha:fecha,repetir_cada_dias:rep?Number(rep):null,activo:true,nota:nota||null,created_by:me.id},{onConflict:'client_id,periodo'});
  if(error)flash(errTxt(error),'err');else{await loadSched();flash(`Reclamo programado para el ${fAR(fecha)}.`)}draw();

async function recFecha(id,v){if(!pDate(v)){flash('Fecha inválida.','err');return draw()}const {error}=await sb.from('claim_schedules').update({proxima_fecha:v,activo:true}).eq('id',id);if(error)flash(errTxt(error),'err');else{await loadSched();flash('Fecha reprogramada.')}draw()}

async function recQuitar(id){if(!confirm('¿Quitar esta programación?'))return;const {error}=await sb.from('claim_schedules').delete().eq('id',id);if(error)flash(errTxt(error),'err');else{await loadSched();flash('Programación quitada.')}draw()}
async function recLogQuitar(id){if(!confirm('¿Quitar este registro de envío?'))return;const {error}=await sb.from('claim_log').delete().eq('id',id);if(error)flash(errTxt(error),'err');else{await loadSched();flash('Registro quitado.')}draw()}
/** Registra que se mandó el reclamo en la fecha que elija la persona; si hay programación, la corre o la termina. */
async function recRegistrar(cid,per,fecha,nota){
  if(esExento(ui.clients.find(x=>x.id===cid))){flash(exentoMsg(cid),'err');return draw()}
  if(!pDate(fecha)){flash('Elegí la fecha en que se envió el reclamo.','err');return draw()}
  const faltan=faltanDe(cid,per),{error}=await sb.from('claim_log').insert({client_id:cid,periodo:per+'-01',enviado:fecha,canal:'whatsapp',faltantes:faltan,nota:nota||null,created_by:me.id});
  if(error){flash(errTxt(error),'err');return draw()}
  const s=ui.cs.find(x=>x.client_id===cid&&x.periodo.slice(0,7)===per);
  if(s){const upd={ultimo_envio:fecha,envios:(s.envios||0)+1};if(s.repetir_cada_dias)upd.proxima_fecha=sumarDias(fecha,s.repetir_cada_dias);else upd.activo=false;await sb.from('claim_schedules').update(upd).eq('id',s.id)}
  await loadSched();flash(`Envío registrado con fecha ${fAR(fecha)}${s&&s.repetir_cada_dias?`. Próximo reclamo: ${fAR(sumarDias(fecha,s.repetir_cada_dias))}.`:'.'}`);draw();
}

/** Bloque dentro de "Pedir facturas" de la ficha: registrar el envío con la fecha real y programar el próximo reclamo. */

  <div class="row" style="align-items:end;margin-top:10px"><label>Programar el próximo reclamo para el<br><input type="date" id="rpF" value="${s?s.proxima_fecha:sumarDias(hoy,7)}"></label><label>Repetir<br><select id="rpR"><option value="">No repetir</option>${[3,5,7,10,15].map(n=>`<option value="${n}" ${s&&s.repetir_cada_dias===n?'selected':''}>Cada ${n} días</option>`).join('')}</select></label><button class="g" onclick="recProgramarDesde('${c.id}','${per}')">${s?'Reprogramar':'Programar'}</button></div>
  ${s?`<div class="s" style="margin-top:6px">Programado: ${fAR(s.proxima_fecha)}${s.repetir_cada_dias?', cada '+s.repetir_cada_dias+' días':''}${s.activo?'':' (pausado)'}.</div>`:''}</div>`;
}
async function recProgramarDesde(cid,per){
  const fecha=$('rpF').value,rep=$('rpR').value;if(esExento(ui.clients.find(x=>x.id===cid))){flash(exentoMsg(cid),'err');return draw()}if(!pDate(fecha)){flash('Elegí la fecha del próximo reclamo.','err');return draw()}
  const {error}=await sb.from('claim_schedules').upsert({client_id:cid,periodo:per+'-01',proxima_fecha:fecha,repetir_cada_dias:rep?Number(rep):null,activo:true,created_by:me.id},{onConflict:'client_id,periodo'});
  if(error)flash(errTxt(error),'err');else{await loadSched();flash(`Reclamo programado para el ${fAR(fecha)}.`)}draw();
}

/* ===== Ticket por foto: la foto se lee con OCR (texto de la imagen) y la persona confirma los datos antes de guardar =====
   El OCR puede equivocarse: por eso nunca se guarda sin que se revisen los campos contra la foto. */
const TK_TIPOS=[[83,'Tique'],[81,'Tique factura A'],[82,'Tique factura B'],[1,'Factura A'],[6,'Factura B'],[11,'Factura C'],[51,'Factura M']];
const tkN=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function cuitValido(c){if(!/^\d{11}$/.test(c))return false;const w=[5,4,3,2,7,6,5,4,3,2];let s=0;for(let i=0;i<10;i++)s+=w[i]*Number(c[i]);let d=11-s%11;if(d===11)d=0;else if(d===10)d=9;return d===Number(c[10])}
/** El OCR confunde letras con números dentro de un número de documento (O por 0, I o l por 1, S por 5, B por 8). */
const tkDig=s=>s.replace(/[0-9OoIl|SB][0-9OoIl|SB\-.\s]{8,}[0-9OoIl|SB]/g,m=>m.replace(/[Oo]/g,'0').replace(/[Il|]/g,'1').replace(/S/g,'5').replace(/B/g,'8'));
function tkParse(texto,cuitCli){
  const raw=String(texto||'').split(/\r?\n/).map(l=>l.replace(/\s+/g,' ').trim()).filter(Boolean),L=raw.map(tkDig),N=L.map(tkN),r={avisos:[]};
  // CUIT del emisor: válido por dígito verificador y distinto al del cliente (en un tique A también figura el del cliente)
  const cands=[];L.forEach((l,i)=>{const re=/(?<!\d)(\d{2})\s*[-.]?\s*(\d{8})\s*[-.]?\s*(\d)(?!\d)/g;let m;while((m=re.exec(l))){const c=m[1]+m[2]+m[3];if(c!==cuitCli&&!cands.some(x=>x.c===c))cands.push({c,i,ok:cuitValido(c),cu:/c\.?\s?u\.?\s?i\.?\s?t/i.test(l)})}});
  const buen=cands.find(x=>x.ok&&x.cu)||cands.find(x=>x.ok)||cands.find(x=>x.cu)||cands[0];
  if(buen){r.cuit=buen.c;if(!buen.ok)r.avisos.push('El CUIT leído no tiene un dígito verificador válido: revisalo contra la foto.')}
  // Razón social: primera línea con letras antes del CUIT
  const lim=buen?buen.i:Math.min(6,L.length);
  for(let i=0;i<lim;i++){const l=L[i].replace(/^(raz[oó]n social|nombre|denominaci[oó]n)\s*[:.]?\s*/i,'');if((l.match(/[A-Za-zÁÉÍÓÚÑáéíóúñ]/g)||[]).length>=4&&!/ticket|tique|factura|original|duplicado|documento|no v[aá]lido|fecha|cuit|c\.u\.i\.t|iva|ing\.? ?brutos|domicilio|tel[eé]fono|inicio de act/i.test(l)&&l.length<=60){r.nombre=l;break}}
  // Tipo de comprobante
  const T=N.join(' ');
  r.tipo=/(tique|ticket)\s*factura\s*a\b|tique\s*fact\.?\s*a\b/.test(T)?81:/(tique|ticket)\s*factura\s*b\b|tique\s*fact\.?\s*b\b/.test(T)?82:/factura\s*a\b|\bfc\s*a\b/.test(T)?1:/factura\s*b\b|\bfc\s*b\b/.test(T)?6:/factura\s*c\b/.test(T)?11:83;
  // Punto de venta y número
  let m=L.join('\n').match(/(?<!\d)(\d{4,5})\s*[-–]\s*(\d{6,8})(?!\d)/);
  if(m&&!(buen&&m[0].replace(/\D/g,'')===buen.c)){r.pv=Number(m[1]);r.num=Number(m[2])}
  else{
    const pv=T.match(/(?:p\.?\s?v\.?|pto\.?\s?(?:de\s)?v(?:ta|enta)\.?|punto\s+de\s+venta)\s*[:.nro°º]*\s*(\d{1,5})/),nu=T.match(/(?:\bn[ro°º.]*\s*(?:de\s)?(?:ticket|tique|comp(?:robante)?)?|comp(?:robante)?\.?\s*n[ro°º.]*|ticket\s*n[ro°º.]*|nro\.?)\s*[:.]?\s*(\d{1,8})(?!\d)/);
    if(pv)r.pv=Number(pv[1]);if(nu)r.num=Number(nu[1]);
  }
  // Fecha
  for(const l of L){const f=l.match(/(?<!\d)(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{4}|\d{2})(?!\d)/);if(f){const y=f[3].length===2?2000+Number(f[3]):Number(f[3]),d=vDate(y,Number(f[2]),Number(f[1]));if(d){r.fecha=d;break}}}
  // Importes
  const mon=l=>liqMontos(l.replace(/(\d)\s+(\d{2})(?!\d)/g,'$1,$2'));
  const totales=[];L.forEach((l,i)=>{if(/\btotal\b/.test(N[i])&&!/sub\s?total|total iva|total impuestos|iva/.test(N[i]))totales.push(...mon(l))});
  const todos=[];L.forEach(l=>todos.push(...mon(l)));
  r.total=totales.length?Math.max(...totales):(todos.length?Math.max(...todos):null);
  const ivas=[];let netoL=null;
  L.forEach((l,i)=>{const n=N[i];if(/contenido|transparencia|ley 27/.test(n))return;
    if(/\biva\b/.test(n)&&/(10[.,]5|21|27|5|2[.,]5)\s*%/.test(n)&&!/responsable|inscripto|exento|consumidor|monotrib/.test(n)){const v=mon(l).filter(x=>r.total===null||x<r.total);if(v.length)ivas.push(v[v.length-1])}
    if(/\b(neto|importe neto|base imponible|subtotal)\b/.test(n)&&!/iva\s*\d/.test(n)){const v=mon(l).filter(x=>r.total===null||x<=r.total);if(v.length&&netoL===null)netoL=v[v.length-1]}});
  if(ivas.length){r.iva=liqPlata(ivas.reduce((a,x)=>a+x,0));r.neto=netoL!==null?netoL:(r.total!==null?liqPlata(r.total-r.iva):null)}
  else if(r.tipo===81||r.tipo===1){r.avisos.push('No se encontró el IVA discriminado: cargalo a mano si la factura lo trae.')}
  if(r.iva!==undefined&&r.neto!==null&&r.neto!==undefined&&r.total!==null&&Math.abs(r.neto+r.iva-r.total)>1.5)r.avisos.push('El neto más el IVA no coincide con el total: revisá los importes contra la foto.');
  const ok=!!(r.cuit&&cuitValido(r.cuit)&&r.fecha&&r.total&&r.num!==undefined);
  r.confianza=ok&&!r.avisos.length?'alta':(r.cuit&&r.fecha&&r.total)?'media':'baja';
  return r;
}
const TK=()=>ui.tk||null;
let _tkW=null,_tkWP=null;
async function tkMotor(){
  if(_tkW)return _tkW;
  if(typeof Tesseract==='undefined')await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js');
  if(typeof Tesseract==='undefined')throw new Error('sin lector');
  _tkWP=_tkWP||Tesseract.createWorker('spa',1,{langPath:'https://tessdata.projectnaptha.com/4.0.0_fast',logger:m=>{const t=TK();if(t&&t.estado==='leyendo'){t.msg=m.status==='recognizing text'?'Leyendo el texto de la foto…':'Preparando el lector de texto (la primera vez tarda un poco)…';t.pct=Math.round((m.progress||0)*100);tkRender()}}}).then(async w=>{await w.setParameters({tessedit_pageseg_mode:'4',preserve_interword_spaces:'1'});return w});
  try{_tkW=await _tkWP}catch(e){_tkWP=null;throw e}
  return _tkW;
}
/** Prepara la foto: una versión liviana a color para guardar y otra en grises con contraste para el OCR. */
async function tkImagenes(file){
  const bmp=await createImageBitmap(file),M=1800,k=Math.min(1,M/Math.max(bmp.width,bmp.height)),w=Math.round(bmp.width*k),h=Math.round(bmp.height*k);
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(bmp,0,0,w,h);
  const blob=await new Promise(ok=>c.toBlob(ok,'image/jpeg',.82));
  const up=Math.min(2,1600/Math.max(1,Math.min(w,h))),ow=Math.round(w*Math.max(1,up)),oh=Math.round(h*Math.max(1,up)),o=document.createElement('canvas');o.width=ow;o.height=oh;const y=o.getContext('2d',{willReadFrequently:true});y.drawImage(c,0,0,ow,oh);
  const im=y.getImageData(0,0,ow,oh),d=im.data;let lo=255,hi=0;const g=new Uint8Array(ow*oh);
  for(let i=0,j=0;i<d.length;i+=4,j++){const v=Math.round(.299*d[i]+.587*d[i+1]+.114*d[i+2]);g[j]=v;if(v<lo)lo=v;if(v>hi)hi=v}
  const rg=Math.max(1,hi-lo);for(let i=0,j=0;i<d.length;i+=4,j++){const v=Math.round((g[j]-lo)*255/rg);d[i]=d[i+1]=d[i+2]=v}
  y.putImageData(im,0,0);return {blob,ocr:o};
}
async function tkFoto(inp){
  const f=inp.files[0];inp.value='';if(!f)return;
  const sel=document.getElementById('tkcli'),cid=(sel&&sel.value)||ui.cid;
  if(!/^image\//.test(f.type)&&!/\.(jpe?g|png|webp|heic|heif)$/i.test(f.name)){ui.tk={cid,estado:'err',msg:'El archivo tiene que ser una foto o imagen.'};return tkRender()}
  if(exentoMsg(cid)){ui.tk={cid,estado:'err',msg:exentoMsg(cid)};return tkRender()}
  if(ui.tk&&ui.tk.url)URL.revokeObjectURL(ui.tk.url);
  const t=ui.tk={cid,estado:'leyendo',msg:'Preparando la foto…',pct:0,nombre:f.name,datos:null,texto:''};tkRender();
  let im;try{im=await tkImagenes(f)}catch(e){t.estado='err';t.msg='No se pudo abrir la imagen ('+(e.message||e)+'). Probá sacando la foto de nuevo o elegí otra imagen.';return tkRender()}
  t.blob=im.blob;t.url=URL.createObjectURL(im.blob);tkRender();
  const cli=ui.clients.find(c=>c.id===cid);let txt='',aviso=null;
  try{const w=await tkMotor();t.msg='Leyendo el texto de la foto…';tkRender();const r=await w.recognize(im.ocr);txt=r.data.text||''}
  catch(e){aviso='No se pudo usar el lector de texto automático (¿sin internet?). La foto quedó cargada: completá los datos a mano.'}
  if(ui.tk!==t)return;
  const p=tkParse(txt,cli?cli.cuit:'');t.texto=txt;t.avisos=[...(aviso?[aviso]:[]),...p.avisos];
  if(!aviso&&txt.trim().length<15)t.avisos.unshift('Casi no se pudo leer texto en la foto. Sacala de nuevo con buena luz, de frente y sin reflejos, o completá los datos a mano.');
  const s=x=>x===null||x===undefined?'':String(x);
  t.datos={fecha:p.fecha||'',tipo:String(p.tipo||83),cuit:p.cuit||'',nombre:p.nombre||'',pv:s(p.pv),num:s(p.num),neto:s(p.neto),iva:s(p.iva),total:s(p.total)};t.confianza=aviso?'baja':p.confianza;
  t.estado='form';tkRender();
}
function tkCampo(k,v){const t=TK();if(t&&t.datos)t.datos[k]=String(v).trim()}
function tkCliente(v){const t=TK();if(t)t.cid=v}
function tkCancelar(){const t=TK();if(t&&t.url)URL.revokeObjectURL(t.url);ui.tk=null;tkRender()}
function tkRender(){const e=document.getElementById('tkres');if(e)e.innerHTML=tkHtml()}
function tkHtml(){
  const t=TK();if(!t)return '';
  if(t.estado==='err')return `<div class="msg err" style="margin-top:10px">${esc(t.msg)}</div>`;
  const prev=t.url?`<img src="${t.url}" alt="Foto del ticket" style="width:100%;max-width:240px;border-radius:10px;border:1px solid var(--bd)">`:'';
  if(t.estado==='leyendo')return `<div class="row" style="margin-top:10px;align-items:flex-start">${prev}<div class="msg info" style="flex:1;min-width:200px">${esc(t.msg||'Leyendo…')}${t.pct?` ${t.pct}%`:''}</div></div>`;
  const d=t.datos,col={alta:'ok',media:'warn',baja:'err'},inp=(k,n,ph,ex)=>`<label>${n}<input value="${esc(d[k])}" placeholder="${ph||''}" ${ex||''} onchange="tkCampo('${k}',this.value)"></label>`;
  return `<div style="margin-top:12px"><div class="msg ${col[t.confianza]||'warn'}">Lectura del ticket: confianza <b>${t.confianza}</b>. Revisá cada dato contra la foto: la lectura automática puede equivocarse.</div>${(t.avisos||[]).map(a=>`<div class="msg warn">${esc(a)}</div>`).join('')}
  <div class="row" style="align-items:flex-start;margin-top:8px">${prev}<div class="fgrid" style="flex:1;min-width:240px">
  ${inp('fecha','Fecha (AAAA-MM-DD)','2026-09-15')}<label>Tipo<select onchange="tkCampo('tipo',this.value)">${TK_TIPOS.map(([k,n])=>`<option value="${k}" ${String(k)===d.tipo?'selected':''}>${n}</option>`).join('')}</select></label>
  ${inp('cuit','CUIT del proveedor','11 dígitos','inputmode="numeric"')}${inp('nombre','Proveedor','')}${inp('pv','Punto de venta','0','inputmode="numeric"')}${inp('num','Número','','inputmode="numeric"')}
  ${inp('neto','Neto gravado','0,00','inputmode="decimal"')}${inp('iva','IVA (vacío si no discrimina)','0,00','inputmode="decimal"')}${inp('total','Importe total','0,00','inputmode="decimal"')}</div></div>
  <div class="row" style="margin-top:10px"><button class="b" onclick="tkGuardar()">Guardar ticket y marcarlo como recibido</button><button class="g" onclick="tkCancelar()">Descartar</button></div>
  ${t.texto?`<details style="margin-top:8px"><summary class="s" style="cursor:pointer">Ver el texto que se leyó de la foto</summary><pre style="white-space:pre-wrap;font-size:12px;color:var(--mut)">${esc(t.texto)}</pre></details>`:''}</div>`;
}
async function tkGuardar(){
  const t=TK();if(!t||t.estado!=='form'||t.guardando)return;const d=t.datos,bad=m=>{flash(m,'err');draw()};
  if(exentoMsg(t.cid))return bad(exentoMsg(t.cid));
  const fecha=d.fecha,pv=pNum(d.pv||'0'),num=pNum(d.num),cuit=String(d.cuit).replace(/\D/g,''),total=pNum(d.total),tipo=Number(d.tipo),nom=d.nombre.trim();
  const neto=d.neto===''?null:pNum(d.neto),iva=d.iva===''?null:pNum(d.iva);
  if(!pDate(fecha))return bad('La fecha no es válida (formato AAAA-MM-DD).');
  if(cuit.length!==11)return bad('El CUIT del proveedor tiene que tener 11 dígitos.');
  if(!cuitValido(cuit)&&!confirm('El CUIT no tiene un dígito verificador válido. ¿Guardar igual?'))return;
  if(!nom)return bad('Cargá el nombre del proveedor.');
  if(pv===null||!Number.isInteger(pv)||pv<0||num===null||!Number.isInteger(num)||num<=0)return bad('El punto de venta y el número tienen que ser enteros (el número mayor a cero).');
  if(total===null||!(total>0))return bad('El importe total tiene que ser mayor a cero.');
  if((d.neto!==''&&neto===null)||(d.iva!==''&&iva===null))return bad('El neto y el IVA tienen que ser números.');
  if(neto!==null&&iva!==null&&Math.abs(neto+iva-total)>1.5&&!confirm(`El neto más el IVA (${money(neto+iva)}) no coincide con el total (${money(total)}). ¿Guardar igual?`))return;
  t.guardando=true;let path=null,batchId=null,vid=null;const nombreTipo=(TK_TIPOS.find(x=>x[0]===tipo)||[0,'Tique'])[1];
  try{
    const {data:per,error:e1}=await sb.from('client_periods').upsert({client_id:t.cid,periodo:fecha.slice(0,7)+'-01'},{onConflict:'client_id,periodo'}).select('id').single();if(e1)throw e1;
    const ex=await sb.from('vouchers').select('id').eq('client_id',t.cid).eq('emisor_cuit',cuit).eq('tipo_cmp',tipo).eq('punto_venta',pv).eq('numero',num);if(ex.error)throw ex.error;
    if(ex.data.length){t.guardando=false;return bad('Ese comprobante ya está cargado para este cliente (mismo proveedor, tipo, punto de venta y número).')}
    path=`${t.cid}/tickets/${crypto.randomUUID()}.jpg`;const up=await sb.storage.from('clientes').upload(path,t.blob,{contentType:'image/jpeg',upsert:false});if(up.error)throw up.error;
    const hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',await t.blob.arrayBuffer()))].map(x=>x.toString(16).padStart(2,'0')).join('');
    const {data:b,error:e2}=await sb.from('import_batches').insert({client_id:t.cid,period_id:per.id,file_name:'Ticket (foto): '+t.nombre,file_sha256:hash,imported_by:me.id,kind:'libro_iva',rows_read:1,rows_new:1,rows_duplicate:0,rows_rejected:0,errors:[]}).select('id').single();if(e2)throw e2;batchId=b.id;
    const ahora=new Date().toISOString(),raw={Tipo:nombreTipo,fuente:'ticket_foto',archivo_path:path,archivo_nombre:t.nombre,ocr_confianza:t.confianza};
    const {data:v,error:e3}=await sb.from('vouchers').insert({client_id:t.cid,period_id:per.id,batch_id:batchId,fecha,tipo_cmp:tipo,punto_venta:pv,numero:num,emisor_cuit:cuit,emisor_nombre:nom,moneda:'PES',tipo_cambio:1,importe_total:total,neto_gravado:neto,no_gravado:0,exento:0,otros_tributos:0,iva,raw,origen:'libro_iva',doc_status:'recibida_fisica',proc_status:'pendiente',received_at:ahora,updated_by:me.id}).select('id').single();if(e3)throw e3;vid=v.id;
    const {error:e4}=await sb.from('document_receipts').insert({voucher_id:vid,method:'manual',received_by:me.id,match_result:'ticket_foto'});if(e4)throw e4;
    const cli=ui.clients.find(c=>c.id===t.cid);QRS.list.unshift(`${new Date().toLocaleTimeString('es-AR')}, ${cli?cli.razon_social+', ':''}${nom}, ticket ${nroF(pv,num)}`);
    if(t.url)URL.revokeObjectURL(t.url);ui.tk=null;flash(`Ticket guardado para ${cli?cli.razon_social:'el cliente'}: ${nom}, ${money(total)}. Quedó como recibido.`);
  }catch(e){
    if(vid)await sb.from('vouchers').delete().eq('id',vid);if(batchId)await sb.from('import_batches').delete().eq('id',batchId);if(path)await sb.storage.from('clientes').remove([path]);
    t.guardando=false;flash(/duplicate/i.test(e.message||'')?'Ese comprobante ya está cargado para este cliente.':errTxt(e),'err');
  }
  draw();
}
