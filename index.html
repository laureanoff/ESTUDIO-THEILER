const INFL_MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const inflMk=(y,m)=>y+'-'+String(m).padStart(2,'0');
const inflMesTxt=k=>INFL_MES[Number(k.slice(5,7))-1]+'-'+k.slice(2,4);
/** Meses del ejercicio (de inicio a cierre) y el mes de apertura (el anterior al primero). */
function inflMeses(inicio,cierre){
  const c=String(cierre).slice(0,7),cy=Number(c.slice(0,4)),cm=Number(c.slice(5,7));
  let y,m;if(inicio){[y,m]=String(inicio).slice(0,7).split('-').map(Number)}else{y=cy-1;m=cm+1;if(m>12){m=1;y=cy}}
  const out=[];for(let i=0;i<40;i++){const k=inflMk(y,m);out.push(k);if(k===c)break;m++;if(m>12){m=1;y++}}
  const py=Number(out[0].slice(0,4)),pm=Number(out[0].slice(5,7));
  return {meses:out,apertura:pm===1?inflMk(py-1,12):inflMk(py,pm-1),cierre:c};
}
function inflNum(v){if(v===null||v===undefined)return null;let t=String(v).trim().replace(/\s/g,'');if(t==='')return null;
  if(t.includes(',')&&t.includes('.'))t=t.lastIndexOf(',')>t.lastIndexOf('.')?t.replace(/\./g,'').replace(',','.'):t.replace(/,/g,'');
  else if(t.includes(','))t=t.replace(',','.');else if(/^-?\d{1,3}(\.\d{3})+$/.test(t))t=t.replace(/\./g,'');
  const n=Number(t);return isFinite(n)?n:null}
/** Pega de Excel: "2025-01 7694,01" o "01/2025 7694,01" o "ene-25 7694,01", una por línea. */
function inflParseIpc(txt){
  const ipc={},malas=[];
  String(txt||'').split(/\r?\n/).forEach(l=>{l=l.trim();if(!l)return;
    const p=l.split(/[\t;]+|\s{2,}|\s(?=[\d.,]+$)/).map(x=>x.trim()).filter(Boolean);if(p.length<2){malas.push(l);return}
    const f=p[0].toLowerCase(),v=inflNum(p[p.length-1]);let k=null,m;
    if((m=f.match(/^(\d{4})[-\/](\d{1,2})$/)))k=inflMk(Number(m[1]),Number(m[2]));
    else if((m=f.match(/^(\d{1,2})[-\/](\d{4})$/)))k=inflMk(Number(m[2]),Number(m[1]));
    else if((m=f.match(/^([a-z]{3})[a-z]*[-\/ ](\d{2}|\d{4})$/))){const i=INFL_MES.indexOf(m[1].replace('set','sep'));if(i>=0)k=inflMk(m[2].length===2?2000+Number(m[2]):Number(m[2]),i+1)}
    if(!k||v===null||v<=0||Number(k.slice(5,7))>12||Number(k.slice(5,7))<1)malas.push(l);else ipc[k]=v});
  return {ipc,malas};
}
/** coef[mes] = índice de cierre / índice del mes. */
function inflCoefs(ipc,M){
  const ic=ipc[M.cierre],coef={},falta=[];
  [M.apertura,...M.meses].forEach(k=>{if(ipc[k]>0&&ic>0)coef[k]=ic/ipc[k];else falta.push(k)});
  return {coef,falta,ic:ic>0?ic:null};
}
/** Tipos: 'res' resultado (se ajusta mes a mes); 'nm' no monetaria (apertura + altas del mes); 'mon' monetaria (saldo al fin de cada mes; para el RECPAM de control). */
function inflCalc(data,M){
  const C=inflCoefs(data.ipc||{},M),out={filas:[],recpam:null,falta:C.falta,coef:C.coef,ok:C.falta.length===0};
  const sumaF=(r,flujo)=>{let h=0,a=0;if(flujo&&r.tipo==='nm'){h+=Number(r.apertura)||0;a+=(Number(r.apertura)||0)*(C.coef[M.apertura]||0)}
    M.meses.forEach(k=>{const v=Number(r.meses&&r.meses[k])||0;h+=v;a+=v*(C.coef[k]||0)});return {h,a}};
  let rec=0,hayMon=false;
  (data.rows||[]).forEach(r=>{
    if(r.tipo==='mon'){hayMon=true;let prev=Number(r.apertura)||0,pk=M.apertura;
      M.meses.forEach(k=>{rec-=prev*((C.coef[pk]||0)-(C.coef[k]||0));prev=Number(r.meses&&r.meses[k])||0;pk=k});
      const fin=prev;out.filas.push({id:r.id,nombre:r.nombre,tipo:'mon',hist:fin,aj:fin,dif:0});return}
    const s=sumaF(r,true);out.filas.push({id:r.id,nombre:r.nombre,tipo:r.tipo,hist:s.h,aj:s.a,dif:s.a-s.h})});
  out.recpam=hayMon&&out.ok?rec:null;return out;
}

  const o={};movs.forEach(m=>{const k=m.cat||'otros',x=o[k]=o[k]||{cat:k,n:0,deb:0,cre:0};x.n++;x.deb+=Number(m.debito)||0;x.cre+=Number(m.credito)||0});
  return Object.values(o).map(x=>({...x,deb:Math.round(x.deb*100)/100,cre:Math.round(x.cre*100)/100})).sort((a,b)=>(b.deb+b.cre)-(a.deb+a.cre));

/** Algunos PDF traen varias cuentas (p. ej. cuenta en pesos y en dólares): se cortan donde empieza cada "saldo anterior". */

function rsbRubro(m){

const rsbYM=f=>f?String(f).slice(0,7):null;
function rsbMeses(desde){const [y,m]=desde.split('-').map(Number),o=[];for(let i=0;i<12;i++){const t=y*12+(m-1)+i;o.push(`${Math.floor(t/12)}-${String(t%12+1).padStart(2,'0')}`)}return o}

  let ini0=null;for(const k of meses){if(M[k].ini!==null){ini0=M[k].ini;break}}

const BK_TOT=[['ley_deb','Ley 25.413 sobre débitos'],['ley_cre','Ley 25.413 sobre créditos'],['gastos','Comisiones, sellados e intereses deudores'],['iva','IVA sobre comisiones (crédito fiscal)'],['perc_iva','Percepciones y retenciones de IVA'],['ret_iibb','Retenciones y percepciones de IIBB'],['ret_gan','Retenciones de Ganancias'],['int_cr','Intereses a favor']];
/** Calcula, para cada cuenta en pesos con resúmenes guardados, el saldo a fin de cada mes del ejercicio y los totales por rubro. Pura (se prueba sin pantalla). */
function bkCalc(sts,movs,M){
  const claves={};sts.forEach(s=>{const k=[s.banco||'',s.cuenta||'',s.moneda||'ARS'].join('|');(claves[k]=claves[k]||[]).push(s)});
  const cuentas=[],ignoradas=[],totales=Object.fromEntries(BK_TOT.map(t=>[t[0],0]));
  Object.entries(claves).forEach(([key,ss])=>{
    const [banco,cuenta,mon]=key.split('|');if(mon!=='ARS'){ignoradas.push(`${banco||'Cuenta'} ${cuenta} (${mon})`);return}
    const ids=new Set(ss.map(s=>s.id)),mv=movs.filter(m=>ids.has(m.statement_id)).map(m=>({...m,cat:m.categoria||m.cat})),X=rsbMatriz(mv,ss,M.meses[0]),meses={},faltan=[],tot=Object.fromEntries(BK_TOT.map(t=>[t[0],0]));

      const cubierto=ss.some(s=>s.periodo_desde&&s.periodo_hasta&&rsbYM(s.periodo_desde)<=k&&rsbYM(s.periodo_hasta)>=k)||x.n>0;
      if(!cubierto)faltan.push(k);
      meses[k]=Math.round((x.resumen!==null?x.resumen:x.cierre)*100)/100;ult=meses[k];
      BK_TOT.forEach(([f])=>{tot[f]+=x.filas[f]||0})});
    BK_TOT.forEach(([f])=>{tot[f]=Math.round(tot[f]*100)/100;totales[f]=Math.round((totales[f]+tot[f])*100)/100});
    cuentas.push({key,nombre:`${banco||'Banco'} ${cuenta}`.trim(),apertura:X.M[M.meses[0]]?X.M[M.meses[0]].ini:0,meses,faltan,cierre:ult,tot})});
  return {cuentas,ignoradas,totales};
}

const BAL_REC_T={banco:'Banco (extracto vs. mayor)',auxiliar:'Clientes / proveedores (auxiliar vs. cuenta)',iva:'IVA (libros vs. contabilidad)',impuestos:'Impuestos y deuda (ARCA vs. contabilidad)',bienes_uso:'Bienes de uso (registro vs. contabilidad)',saldos_iniciales:'Saldos iniciales (vs. cierre anterior)'};
const BAL_MOV_AL={fecha:['fecha','fecha operacion','fecha mov','fecha movimiento','fec'],desc:['descripcion','concepto','detalle','leyenda','movimiento','referencia','observaciones'],debe:['debe','debito','debitos','retiros','egresos','salidas','debitos pesos'],haber:['haber','credito','creditos','depositos','ingresos','entradas','creditos pesos'],importe:['importe','monto','movimiento importe','importe pesos'],saldo:['saldo','saldo parcial']};
/** Lee un extracto o un mayor. `modo`: 'extracto' (crédito suma al saldo) o 'mayor' (debe suma al saldo de una cuenta activa). */
function balMovParse(rows,modo){
  let h=-1,m={};
  for(let i=0;i<Math.min(rows.length,40);i++){const t={};(rows[i]||[]).forEach((c,j)=>{const k=norm(c);for(const [f,al] of Object.entries(BAL_MOV_AL))if(t[f]===undefined&&al.map(norm).includes(k))t[f]=j});
    if(t.fecha!==undefined&&(t.importe!==undefined||t.debe!==undefined||t.haber!==undefined)){h=i;m=t;break}}
  if(h<0)return {error:'No encontré las columnas (fecha e importe, o débito/crédito).',movs:[]};
  const movs=[],omit=[];
  for(let i=h+1;i<rows.length;i++){const r=rows[i]||[];if(r.every(c=>c===null||String(c).trim()===''))continue;
    const g=f=>m[f]===undefined?null:r[m[f]],fe=infFecha(g('fecha')),d=infNum(g('debe'))||0,hb=infNum(g('haber'))||0;let imp=m.importe!==undefined&&infNum(g('importe'))!==null?infNum(g('importe')):(modo==='extracto'?hb-d:d-hb);
    const desc=String(g('desc')??'').trim();
    if(!fe||imp===null||isNaN(imp)){if(/saldo|total/.test(norm(desc))||!fe)omit.push(i+1);continue}
    movs.push({fecha:fe,desc,importe:balNumR(imp),fila:i+1,saldo:m.saldo!==undefined?infNum(g('saldo')):null})}
  return {movs,omit,saldoFinal:movs.length&&movs[movs.length-1].saldo!==null?movs[movs.length-1].saldo:null};
}

async function balPdfOcr(file,progreso){
  if(typeof pdfjsLib==='undefined'||!pdfjsLib.getDocument)await pdfTexto(file).catch(()=>{});
  if(typeof pdfjsLib==='undefined')throw new Error('No se pudo cargar el lector de PDF (¿sin conexión a internet?).');
  const w=await tkMotor(),doc=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise,out=[];
  const N=Math.min(doc.numPages,15);
  for(let n=1;n<=N;n++){if(progreso)progreso(n,N);const pg=await doc.getPage(n),vp=pg.getViewport({scale:2.2}),cv=document.createElement('canvas');cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
    await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;const r=await w.recognize(cv);out.push(...String(r.data.text||'').split('\n').map(x=>x.trim()).filter(Boolean))}
  if(doc.numPages>15)out.avisoPaginas=`Se leyeron solo las primeras 15 de ${doc.numPages} páginas.`;
  return out;
}
/** Texto del PDF; si casi no tiene texto (escaneado), se lee con OCR. Siempre es lectura asistida. */
async function balPdfLeer(file){

}

function liqGenerico(lineas,cuitCliente){

    const a=n.match(/(\d{1,2}(?:[.,]\d{1,2})?)\s*%/);

  });
  const netos=cand.filter(c=>c.roles.includes('neto')),ivas=cand.filter(c=>c.roles.includes('iva')),tots=cand.filter(c=>c.roles.includes('total'));

    for(const t of (ci.alic?[ci.alic]:cn.alic?[cn.alic]:RATES)){
      if(nv>0&&iv>0&&Math.abs(nv*t/100-iv)<=Math.max(1,nv*0.0005)){let tot=null;for(const ct of tots)for(const tv of ct.montos)if(Math.abs(nv+iv-tv)<=1.5)tot=tv;
        const score=(tot!==null?2:0)+(ci.alic?1:0);if(!mejor||score>mejor.score)mejor={neto:nv,iva:iv,alic:t,total:tot,score}}}}
  const r={neto:null,iva:null,alic:null,total:null,avisos,candidatos:cand.slice(0,16).map(c=>({linea:c.linea.slice(0,110),montos:c.montos.slice(0,4),roles:c.roles}))};

  if(!lineas.length)r.avisos.unshift('El PDF no tiene texto que se pueda leer (parece una imagen escaneada). Cargá los importes a mano.');
  return r;
}

    if(mc){pie={cantidad:+mc[1],neto:pNum(r[ix.neto]),iva:pNum(r[ix.ivam]),total:pNum(r[ix.total])};continue}
    if(r.every(c=>String(c??'').trim()===''))continue;
    const tipoTxt=lbTipo(r[ix.tipo]);if(!tipoTxt)continue;filas++;
    const numS=String(r[ix.numero]??'').trim(),mn0=numS.match(/^(\d+)\s*-\s*(\d+)$/),dig=numS.replace(/\D/g,''),coe=!mn0&&dig.length>=6&&dig.length<=15,mn=mn0?[0,mn0[1],mn0[2]]:(coe?[0,'0',dig]:null),cuit=String(r[ix.cuit]??'').replace(/\D/g,''),fc=pDate(r[ix.fcomp!==undefined?ix.fcomp:ix.fechaLibro]),p=[];
    if(!mn)p.push('número inválido');if(cuit.length!==11)p.push('CUIT inválido');if(!fc)p.push('fecha inválida');
    if(p.length){errores.push({fila:i+1,mensaje:p.join(', ')});continue}
    const key=tipoTxt+'|'+(+mn[1])+'-'+(+mn[2])+'|'+cuit;let g=grupos.get(key);
    if(!g){g={clave:key,tipoTxt,tipo_cmp:lbCod(tipoTxt),pv:+mn[1],numero:+mn[2],coe,cuit,proveedor:String(r[ix.prov]??'').trim()||null,fecha:fc,naturaleza:ix.naturaleza!==undefined?String(r[ix.naturaleza]??'').trim():'',neto:0,nograv:0,interno:0,pivas:0,piibb:0,iva:0,total:0,filasTotal:0,rates:{}};grupos.set(key,g)}
    const n=k=>ix[k]!==undefined?(pNum(r[ix[k]])||0):0;
    g.neto+=n('neto');g.nograv+=n('nograv');g.interno+=n('interno');g.pivas+=n('pivas');g.piibb+=n('piibb');g.iva+=n('ivam');
    const tv=pNum(r[ix.total]);if(tv!==null){g.total+=tv;g.filasTotal++}
    const rate=ix.ivap!==undefined?pNum(r[ix.ivap]):null;
    if(rate!==null&&(Math.abs(n('neto'))>0.004||Math.abs(n('ivam'))>0.004)){const t=g.rates[String(rate)]||(g.rates[String(rate)]={neto:0,iva:0});t.neto+=n('neto');t.iva+=n('ivam')}
  }
  const sumas={neto:0,iva:0,total:0};
  const comprobantes=[...grupos.values()].map(g=>{
    sumas.neto+=g.neto;sumas.iva+=g.iva;sumas.total+=g.total;
    const nc=esNC(g.tipo_cmp),f=v=>liqPlata(nc?Math.abs(v):v),otros=g.interno+g.pivas+g.piibb,sinTotal=g.filasTotal===0,total=sinTotal?g.neto+g.nograv+otros+g.iva:g.total;
    const c={clave:g.clave,tipoTxt:g.tipoTxt,tipo_cmp:g.tipo_cmp,pv:g.pv,numero:g.numero,coe:g.coe,cuit:g.cuit,proveedor:g.proveedor,fecha:g.fecha,naturaleza:g.naturaleza,nc,
      neto:f(g.neto),nograv:f(g.nograv),otros:f(otros),pivas:f(g.pivas),piibb:f(g.piibb),interno:f(g.interno),iva:f(g.iva),total:f(total),
      cierra:Math.abs(g.neto+g.nograv+otros+g.iva-total)<=1.5,repetidoEnLibro:g.filasTotal>1,sinTotal};
    const raw={'Origen':'Libro IVA Compras','Tipo':g.tipoTxt,'Naturaleza':g.naturaleza,'Neto Gravado Total':c.neto,'Neto No Gravado':c.nograv,'Impuestos Internos':f(g.interno),'Percepción IVA':c.pivas,'Percepción IIBB':c.piibb,'Total IVA':c.iva,'Imp. Total':c.total};
    for(const [k,t] of Object.entries(g.rates)){const a=String(+k).replace('.',',');raw['Neto Grav. IVA '+a+'%']=f(t.neto);if(+k>0)raw['IVA '+a+'%']=f(t.iva)}
    c.raw=raw;return c;
  });
  return {ok:true,periodo,comprobantes,errores,filas,pie,sumas:{neto:liqPlata(sumas.neto),iva:liqPlata(sumas.iva),total:liqPlata(sumas.total)}};
}

/** Compara el Libro con lo que ya está en el sistema (todo lo del cliente, de cualquier período). */
function planLibro(lib,ex,periodo){
  const k4=(c,t,p,n)=>[c,t,p,n].join('|'),k3=(c,p,n)=>[c,p,n].join('|'),m4=new Map(),m3=new Map();
  ex.forEach(e=>{m4.set(k4(e.emisor_cuit,e.tipo_cmp,e.punto_venta,e.numero),e);const k=k3(e.emisor_cuit,e.punto_venta,e.numero);if(!m3.has(k))m3.set(k,[]);m3.get(k).push(e)});
  const p={nuevos:[],repetidos:[],posibles:[],difs:[],arcaSinLibro:[]},vistos=new Set();
  for(const c of lib.comprobantes){
    const e=m4.get(k4(c.cuit,c.tipo_cmp,c.pv,c.numero));
    if(e){vistos.add(e);p.repetidos.push({c,e});if(Math.abs(Math.abs(Number(e.importe_total))-Math.abs(c.total))>1)p.difs.push({c,e});continue}
    const alt=m3.get(k3(c.cuit,c.pv,c.numero));
    if(alt){alt.forEach(a=>vistos.add(a));p.posibles.push({c,alt});continue}
    p.nuevos.push(c);
  }
  p.arcaSinLibro=ex.filter(e=>e.origen!=='libro_iva'&&e.proc_status!=='excluido'&&String(e.fecha).startsWith(periodo)&&!vistos.has(e));
  return p;
}

/* ===== IVA aproximado: cálculo ===== */
/** Orden de la liquidación: saldo técnico del período; se compensa con el saldo técnico a favor anterior; lo que queda se cancela con
    el saldo de libre disponibilidad anterior, las retenciones/percepciones sufridas y los pagos a cuenta. Lo que sobra pasa al mes siguiente. */
function ivaCalcular(p){
  const r2=x=>Math.round((x+Number.EPSILON)*100)/100,ST=r2((p.deb||0)-(p.cred||0)),stAnt=Math.max(0,p.stAnt||0),sldAnt=Math.max(0,p.sldAnt||0),ret=Math.max(0,p.retPerc||0),pag=Math.max(0,p.pagos||0);
  let usadoST=0,base=0,stNuevo;
  if(ST<0)stNuevo=r2(stAnt-ST);else{usadoST=Math.min(stAnt,ST);base=r2(ST-usadoST);stNuevo=r2(stAnt-usadoST)}
  const aplicables=r2(sldAnt+ret+pag),consumido=Math.min(base,aplicables);
  return {saldoTecnico:ST,usadoST:r2(usadoST),base,aplicables,consumido:r2(consumido),aPagar:r2(base-consumido),stNuevo,sldNuevo:r2(aplicables-consumido)};
}
const ivaSum=rows=>rows.reduce((a,x)=>a+sgnVal(x.tipo_cmp,x.iva),0);
function ivaResultado(d){
  const deb=ivaSum(d.ven),cred=ivaSum(d.com),percLibro=d.com.reduce((a,x)=>a+sgnVal(x.tipo_cmp,Number(x.raw&&x.raw['Percepción IVA'])||0),0),
    retIva=d.ret.filter(x=>x.impuesto==='IVA').reduce((a,x)=>a+Number(x.importe),0),incl=!d.aj.excluir_percep_libro,extra=Number(d.aj.retenciones_percepciones||0),retTotal=retIva+(incl?percLibro:0)+extra;
  return {deb,cred,percLibro,retIva,incl,extra,retTotal,...ivaCalcular({deb,cred,stAnt:Number(d.aj.saldo_tecnico_anterior||0),sldAnt:Number(d.aj.saldo_libre_disp||0),retPerc:retTotal,pagos:Number(d.aj.pagos_a_cuenta||0)})};
}
/** Carga lo necesario de un cliente y mes. Si todavía no hay ajustes de ese mes, los saldos "anteriores" salen del cierre del mes anterior. */
async function ivaCargar(cid,per){
  const pr=await sb.from('client_periods').select('id').eq('client_id',cid).eq('periodo',per+'-01').maybeSingle();if(pr.error)throw pr.error;
  let ven=[],com=[];
  if(pr.data)[ven,com]=await Promise.all([fetchAll((a,b)=>sb.from('sales_invoices').select('tipo_cmp,iva,neto_gravado,raw').eq('period_id',pr.data.id).range(a,b)),fetchAll((a,b)=>sb.from('vouchers').select('tipo_cmp,iva,neto_gravado,raw').eq('period_id',pr.data.id).neq('proc_status','excluido').range(a,b))]);
  const [aj,prev,ret,dj]=await Promise.all([sb.from('iva_ajustes').select('*').eq('client_id',cid).eq('periodo',per+'-01').maybeSingle(),sb.from('iva_ajustes').select('*').eq('client_id',cid).eq('periodo',antPrevPer(per)+'-01').maybeSingle(),sb.from('iva_retenciones').select('*').eq('client_id',cid).eq('periodo',per+'-01').order('fecha'),sb.from('tax_filings').select('datos').eq('client_id',cid).eq('impuesto','IVA').eq('periodo',antPrevPer(per)+'-01').maybeSingle()]);
  for(const r of [aj,prev,ret,dj])if(r.error)throw r.error;
  const ddjjPrev=dj.data&&dj.data.datos&&dj.data.datos.ddjj&&dj.data.datos.ddjj.saldo_tecnico!==undefined?dj.data.datos.ddjj:null;
  let ajuste=aj.data,prefill=false;const cierrePrev=prev.data&&prev.data.cierre_saldo_tecnico!==null&&prev.data.cierre_saldo_tecnico!==undefined;
  let fuente=cierrePrev?'cierre':null;
  if(!ajuste&&ddjjPrev){ajuste={saldo_tecnico_anterior:Number(ddjjPrev.saldo_tecnico)||0,saldo_libre_disp:Number(ddjjPrev.saldo_libre)||0,retenciones_percepciones:0,pagos_a_cuenta:0,excluir_percep_libro:false};prefill=true;fuente='ddjj'}
  else if(!ajuste){ajuste={saldo_tecnico_anterior:cierrePrev?Number(prev.data.cierre_saldo_tecnico):0,saldo_libre_disp:cierrePrev?Number(prev.data.cierre_saldo_libre||0):0,retenciones_percepciones:0,pagos_a_cuenta:0,excluir_percep_libro:false};prefill=cierrePrev}
  return {cid,per,ven,com,aj:ajuste,prev:prev.data,prefill,ret:ret.data,ddjjPrev,fuente};
}

const RET_COLS={fecha:['fecha','fecha retencion','fecha percepcion','fecha de retencion','fecha de percepcion','fecha comprobante','fecha operacion','fecha de operacion'],
  importe:['importe','importe retenido','importe retencion','importe percepcion','importe percibido','monto','monto retenido','importe retenido percibido','importe retencion percepcion','importe retenido o percibido'],
  impuesto:['impuesto','descripcion impuesto','desc impuesto','codigo impuesto','tributo','descripcion del impuesto'],
  agente_cuit:['cuit agente','cuit agente de retencion','cuit retenedor','cuit agente retencion','cuit del agente','cuit agente retencion percepcion','cuit'],
  agente_nombre:['denominacion agente','denominacion agente de retencion','denominacion','razon social','agente de retencion','agente','razon social agente'],
  comprobante:['numero comprobante','nro comprobante','numero de comprobante','comprobante','numero','nro','numero de retencion'],
  tipo:['tipo','tipo retencion percepcion','tipo de operacion','retencion percepcion','operacion']};
const RET_ETQ={fecha:'Fecha',importe:'Importe',impuesto:'Impuesto',agente_cuit:'CUIT del agente',agente_nombre:'Nombre del agente',comprobante:'N° de comprobante',tipo:'Tipo (retención o percepción)'};
/** Reconoce una columna por su nombre: primero por la lista exacta y, si no, por palabras clave (tolera "N° Comprobante", "Fecha Retención", etc.). */
function retCampoDe(h){
  const k=norm(h);if(!k)return null;
  for(const [f,al] of Object.entries(RET_COLS))if(al.includes(k))return {f,p:3};
  if(/fecha/.test(k))return {f:'fecha',p:1};
  if(/importe|monto/.test(k))return {f:'importe',p:/retenid|percibid|retencion|percepcion/.test(k)?2:1};
  if(/impuesto|tributo/.test(k))return {f:'impuesto',p:1};
  if(/cuit/.test(k))return {f:'agente_cuit',p:1};
  if(/denominacion|razon social|nombre/.test(k))return {f:'agente_nombre',p:1};
  if(/comprobante|numero|^nro/.test(k))return {f:'comprobante',p:1};
  if(/^tipo/.test(k))return {f:'tipo',p:1};
  return null;
}
function retDetectar(rows){
  let best=null;
  for(let i=0;i<Math.min(rows.length,20);i++){const m={},pr={};(rows[i]||[]).forEach((c,j)=>{const x=retCampoDe(c);if(!x)return;if(m[x.f]===undefined||x.p>pr[x.f]){m[x.f]=j;pr[x.f]=x.p}});const n=Object.keys(m).length;if(m.importe!==undefined&&m.fecha!==undefined&&(!best||n>best.n))best={h:i,m,n}}
  return best;
}
/** Arma el plan de importación con el mapeo elegido: filtra por impuesto y por mes, y omite lo que ya está cargado. */
function retPlan(R,existentes){
  const {rows,h,m}=R,out={nuevos:[],ya:[],fuera:[],otros:0,errores:0},k=x=>[x.fecha,x.tipo,x.agente_cuit||'',x.comprobante||'',x.importe.toFixed(2)].join('|'),vistos=new Set(existentes.map(k));
  const filtro=norm(R.filtro||'');
  for(let i=h+1;i<rows.length;i++){
    const r=rows[i]||[];if(r.every(c=>String(c??'').trim()===''))continue;
    const g=f=>m[f]!==undefined&&m[f]!==''?r[m[f]]:null,fecha=pDate(g('fecha')),imp=pNum(g('importe'));
    if(!fecha||imp===null){out.errores++;continue}
    if(filtro&&m.impuesto!==undefined&&m.impuesto!==''&&!norm(g('impuesto')).includes(filtro)){out.otros++;continue}
    const t=m.tipo!==undefined&&m.tipo!==''?(/percep/i.test(String(g('tipo')))?'percepcion':'retencion'):R.tipo;
    const x={fecha,tipo:t,impuesto:'IVA',agente_cuit:String(g('agente_cuit')??'').replace(/\D/g,'')||null,agente_nombre:g('agente_nombre')?String(g('agente_nombre')).trim():null,comprobante:g('comprobante')!==null?String(g('comprobante')).trim():null,importe:Math.abs(imp)};
    if(fecha.slice(0,7)!==R.per){out.fuera.push(x);continue}
    if(vistos.has(k(x))){out.ya.push(x);continue}
    vistos.add(k(x));out.nuevos.push(x);
  }
  return out;
}

  if(error){flash(errTxt(error),'err');return draw()}

const TK=()=>ui.tk||null;

  return `<div style="margin-top:12px"><div class="msg ${col[t.confianza]||'warn'}">Lectura del ticket: confianza <b>${t.confianza}</b>. Revisá cada dato contra la foto: la lectura automática puede equivocarse.</div>${(t.avisos||[]).map(a=>`<div class="msg warn">${esc(a)}</div>`).join('')}
  <div class="row" style="align-items:flex-start;margin-top:8px">${prev}<div class="fgrid" style="flex:1;min-width:240px">
  ${inp('fecha','Fecha (AAAA-MM-DD)','2026-09-15')}<label>Tipo<select onchange="tkCampo('tipo',this.value)">${TK_TIPOS.map(([k,n])=>`<option value="${k}" ${String(k)===d.tipo?'selected':''}>${n}</option>`).join('')}</select></label>
  ${inp('cuit','CUIT del proveedor','11 dígitos','inputmode="numeric"')}${inp('nombre','Proveedor','')}${inp('pv','Punto de venta','0','inputmode="numeric"')}${inp('num','Número','','inputmode="numeric"')}
  ${inp('neto','Neto gravado','0,00','inputmode="decimal"')}${inp('iva','IVA (vacío si no discrimina)','0,00','inputmode="decimal"')}${inp('total','Importe total','0,00','inputmode="decimal"')}</div></div>
  <div class="row" style="margin-top:10px"><button class="b" onclick="tkGuardar()">Guardar ticket y marcarlo como recibido</button><button class="g" onclick="tkCancelar()">Descartar</button></div>
  ${t.texto?`<details style="margin-top:8px"><summary class="s" style="cursor:pointer">Ver el texto que se leyó de la foto</summary><pre style="white-space:pre-wrap;font-size:12px;color:var(--mut)">${esc(t.texto)}</pre></details>`:''}</div>`;
}
async function tkGuardar(){
  const t=TK();if(!t||t.estado!=='form'||t.guardando)return;const d=t.datos,bad=m=>{flash(m,'err');draw()};
  if(exentoMsg(t.cid))return bad(exentoMsg(t.cid));
  const fecha=d.fecha,pv=pNum(d.pv||'0'),num=pNum(d.num),cuit=String(d.cuit).replace(/\D/g,''),total=pNum(d.total),tipo=Number(d.tipo),nom=d.nombre.trim();
  const neto=d.neto===''?null:pNum(d.neto),iva=d.iva===''?null:pNum(d.iva);
  if(!pDate(fecha))return bad('La fecha no es válida (formato AAAA-MM-DD).');
  if(cuit.length!==11)return bad('El CUIT del proveedor tiene que tener 11 dígitos.');
  if(!cuitValido(cuit)&&!confirm('El CUIT no tiene un dígito verificador válido. ¿Guardar igual?'))return;
  if(!nom)return bad('Cargá el nombre del proveedor.');
  if(pv===null||!Number.isInteger(pv)||pv<0||num===null||!Number.isInteger(num)||num<=0)return bad('El punto de venta y el número tienen que ser enteros (el número mayor a cero).');
  if(total===null||!(total>0))return bad('El importe total tiene que ser mayor a cero.');
  if((d.neto!==''&&neto===null)||(d.iva!==''&&iva===null))return bad('El neto y el IVA tienen que ser números.');
  if(neto!==null&&iva!==null&&Math.abs(neto+iva-total)>1.5&&!confirm(`El neto más el IVA (${money(neto+iva)}) no coincide con el total (${money(total)}). ¿Guardar igual?`))return;
  t.guardando=true;let path=null,batchId=null,vid=null;const nombreTipo=(TK_TIPOS.find(x=>x[0]===tipo)||[0,'Tique'])[1];
  try{
    const {data:per,error:e1}=await sb.from('client_periods').upsert({client_id:t.cid,periodo:fecha.slice(0,7)+'-01'},{onConflict:'client_id,periodo'}).select('id').single();if(e1)throw e1;
    const ex=await sb.from('vouchers').select('id').eq('client_id',t.cid).eq('emisor_cuit',cuit).eq('tipo_cmp',tipo).eq('punto_venta',pv).eq('numero',num);if(ex.error)throw ex.error;
    if(ex.data.length){t.guardando=false;return bad('Ese comprobante ya está cargado para este cliente (mismo proveedor, tipo, punto de venta y número).')}
    path=`${t.cid}/tickets/${crypto.randomUUID()}.jpg`;const up=await sb.storage.from('clientes').upload(path,t.blob,{contentType:'image/jpeg',upsert:false});if(up.error)throw up.error;
    const hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',await t.blob.arrayBuffer()))].map(x=>x.toString(16).padStart(2,'0')).join('');
    const {data:b,error:e2}=await sb.from('import_batches').insert({client_id:t.cid,period_id:per.id,file_name:'Ticket (foto): '+t.nombre,file_sha256:hash,imported_by:me.id,kind:'libro_iva',rows_read:1,rows_new:1,rows_duplicate:0,rows_rejected:0,errors:[]}).select('id').single();if(e2)throw e2;batchId=b.id;
    const ahora=new Date().toISOString(),raw={Tipo:nombreTipo,fuente:'ticket_foto',archivo_path:path,archivo_nombre:t.nombre,ocr_confianza:t.confianza};
    const {data:v,error:e3}=await sb.from('vouchers').insert({client_id:t.cid,period_id:per.id,batch_id:batchId,fecha,tipo_cmp:tipo,punto_venta:pv,numero:num,emisor_cuit:cuit,emisor_nombre:nom,moneda:'PES',tipo_cambio:1,importe_total:total,neto_gravado:neto,no_gravado:0,exento:0,otros_tributos:0,iva,raw,origen:'libro_iva',doc_status:'recibida_fisica',proc_status:'pendiente',received_at:ahora,updated_by:me.id}).select('id').single();if(e3)throw e3;vid=v.id;
    const {error:e4}=await sb.from('document_receipts').insert({voucher_id:vid,method:'manual',received_by:me.id,match_result:'ticket_foto'});if(e4)throw e4;
    const cli=ui.clients.find(c=>c.id===t.cid);QRS.list.unshift(`${new Date().toLocaleTimeString('es-AR')}, ${cli?cli.razon_social+', ':''}${nom}, ticket ${nroF(pv,num)}`);
    if(t.url)URL.revokeObjectURL(t.url);ui.tk=null;flash(`Ticket guardado para ${cli?cli.razon_social:'el cliente'}: ${nom}, ${money(total)}. Quedó como recibido.`);
  }catch(e){
    if(vid)await sb.from('vouchers').delete().eq('id',vid);if(batchId)await sb.from('import_batches').delete().eq('id',batchId);if(path)await sb.storage.from('clientes').remove([path]);
    t.guardando=false;flash(/duplicate/i.test(e.message||'')?'Ese comprobante ya está cargado para este cliente.':errTxt(e),'err');
  }
  draw();
}

/* La cámara no puede quedar prendida si se oculta la pestaña o se cierra la página */
document.addEventListener('visibilitychange',()=>{if(document.hidden&&QRS.on){stopCam();setScan({k:'info',t:'La cámara se apagó porque saliste de la página. Tocá "Activar cámara" para seguir.'})}});
window.addEventListener('pagehide',()=>{stopCam()});

init();
</script>
