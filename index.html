:root{color-scheme:dark;--bg:#070d1f;--tx:#e8eeff;--mut:#9aa7cc;--bd:rgba(255,255,255,.13);--card:rgba(255,255,255,.07);--card2:rgba(255,255,255,.12);--hd:rgba(255,255,255,.05);--nav:rgba(8,14,32,.62);--navh:rgba(255,255,255,.1);--pri:#2dd4bf;--prit:#031c19;
--red:rgba(255,93,108,.2);--redt:#ffa3ab;--grn:rgba(52,211,153,.2);--grnt:#7ee8bd;--blu:rgba(91,124,255,.24);--blut:#b4c4ff;--amb:rgba(255,200,87,.2);--ambt:#ffd98a;--org:rgba(255,150,70,.2);--orgt:#ffbb85;--gry:rgba(255,255,255,.1);--gryt:#cdd6f4;--vio:rgba(167,139,250,.22);--viot:#d3c8ff;--teal:rgba(45,212,191,.2);--tealt:#8ff0e1}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(55vw 45vh at 8% 0%,rgba(66,99,255,.38),transparent 65%),radial-gradient(45vw 45vh at 100% 25%,rgba(45,212,191,.2),transparent 65%),repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 30px),var(--bg)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.app{display:flex;min-height:100vh}
nav{width:212px;flex-shrink:0;background:var(--nav);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-right:1px solid var(--bd);padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto;color:var(--mut)}
nav h1{font:700 21px/1.1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em;color:var(--tx);margin:0 0 24px 8px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:10px 12px;border-radius:12px;font:inherit;font-size:14px;cursor:pointer;margin-bottom:3px}
nav button:hover{background:var(--navh);color:var(--tx)}
nav button.on{background:var(--card2);color:var(--tx);box-shadow:inset 3px 0 0 var(--pri)}
.me{margin-top:22px;font-size:12px;color:var(--mut);padding:0 8px}.me button{margin-top:8px;width:auto}
main{flex:1;min-width:0;padding:30px 34px}
h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.015em}
h2{font-size:28px;font-weight:700;margin:0 0 18px}h3{font-size:17px;font-weight:600;margin:26px 0 10px}
.card,.glass{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 18px 40px rgba(0,0,0,.28)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi b{display:block;font:700 30px/1.1 "Bricolage Grotesque",system-ui,sans-serif}.kpi span{font-size:13px;color:var(--mut)}
label{font-size:12.5px;color:var(--mut);display:block}
input,select,textarea{font:inherit;color:var(--tx);background:rgba(255,255,255,.06);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin-top:4px;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--pri);outline:none;box-shadow:0 0 0 3px rgba(45,212,191,.2)}
input[type=checkbox]{accent-color:var(--pri)}option{background:#10182f;color:var(--tx)}
textarea{width:100%;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
button.b{background:var(--pri);color:var(--prit);border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
button.b:hover{filter:brightness(1.08)}button.b:disabled{opacity:.4;cursor:not-allowed}
button.g{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:7px 12px;font:inherit;cursor:pointer}
button.g:hover{background:var(--card2)}button.dng{background:var(--red);color:var(--redt);border:1px solid rgba(255,93,108,.4);border-radius:10px;padding:7px 12px;font:inherit;cursor:pointer}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:18px;background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 18px 40px rgba(0,0,0,.25)}
table{border-collapse:collapse;width:100%;min-width:720px}
th{background:var(--hd);text-align:left;font-size:12.5px;font-weight:500;color:var(--mut);padding:11px 14px}
td{border-top:1px solid var(--bd);padding:11px 14px;vertical-align:top}
.s{display:block;font-size:12px;color:var(--mut)}
.tag{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:500;white-space:nowrap}
.msg{border:1px solid;border-radius:14px;padding:10px 14px;margin-bottom:12px;backdrop-filter:blur(12px)}
.err{background:var(--red);color:var(--redt);border-color:rgba(255,93,108,.45)}.warn{background:var(--amb);color:var(--ambt);border-color:rgba(255,200,87,.45)}.ok{background:var(--grn);color:var(--grnt);border-color:rgba(52,211,153,.45)}.info{background:var(--blu);color:var(--blut);border-color:rgba(91,124,255,.45)}
.hist{font-size:12px;color:var(--mut);background:var(--hd)}
.login{max-width:380px;margin:14vh auto;padding:0 16px}.login .card{display:grid;gap:14px}.login h2{font-size:34px}
/* Clientes como legajos de vidrio */
.cl-grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));padding-top:6px}
.cl{position:relative;cursor:pointer;padding:22px 18px 16px;transition:transform .15s,background .15s}
.cl:hover{background:var(--card2);transform:translateY(-3px)}.cl.off{opacity:.55}
.cl h3{margin:0 62px 4px 0;font-size:18px;line-height:1.2}
.term{position:absolute;top:-1px;right:18px;width:50px;padding:8px 0 9px;text-align:center;font:700 25px/1 "Bricolage Grotesque",system-ui,sans-serif;background:linear-gradient(180deg,rgba(45,212,191,.38),rgba(45,212,191,.1));border:1px solid rgba(45,212,191,.45);border-top:0;border-radius:0 0 14px 14px;color:#d2fff9}
.term small{display:block;font:500 9px/1.1 "Instrument Sans",system-ui,sans-serif;color:#8fe9dc;margin-top:4px}
.term.big{position:static;flex-shrink:0;width:64px;font-size:32px;border-top:1px solid rgba(45,212,191,.45);border-radius:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 14px;min-height:22px}
.chip{font-size:11.5px;padding:2px 9px;border-radius:999px;background:var(--gry);color:var(--gryt)}
.clf{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);border-top:1px solid var(--bd);padding-top:10px}.clf .bad{color:var(--redt);font-weight:600}
/* Ficha */
.ov{position:fixed;inset:0;z-index:50;background:rgba(3,7,18,.55);backdrop-filter:blur(4px);display:flex;justify-content:flex-end}
.dr{width:min(900px,100%);height:100%;overflow:auto;border-radius:22px 0 0 22px;background:rgba(12,19,42,.78);border:1px solid var(--bd);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);padding:22px 26px;box-shadow:-24px 0 60px rgba(0,0,0,.45)}
.dr.in{animation:slin .22s ease-out}@keyframes slin{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.drh{display:flex;gap:16px;align-items:center;margin-bottom:18px}.drh h2{margin:0;font-size:25px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;padding:5px;background:var(--hd);border:1px solid var(--bd);border-radius:14px}
.tabs button{background:none;border:0;color:var(--mut);padding:8px 14px;border-radius:10px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--card2);color:var(--tx)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.full{grid-column:1/-1}
.fgrid input,.fgrid select{width:100%}fieldset{border:0;padding:0;margin:0;min-width:0}
@media(max-width:700px){.app{flex-direction:column}nav{width:100%;height:auto;position:static;display:flex;gap:4px;overflow-x:auto;padding:12px;border-right:0;border-bottom:1px solid var(--bd)}nav h1{display:none}nav button{width:auto;white-space:nowrap;margin:0}.me{display:none}main{padding:16px}.dr{border-radius:0;padding:16px}h2{font-size:24px}}
.sm{padding:4px 9px!important;font-size:12.5px!important}
input.sm{margin-top:0;border-radius:8px}
label.g{display:inline-flex;align-items:center;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;cursor:pointer;margin:0}
label.g:hover{background:var(--card2)}
.cel{display:grid;gap:6px;min-width:200px;justify-items:start}
.mes{display:inline-flex;gap:4px;align-items:center}.mes select{min-width:150px}
.fbar{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.fbar label{margin:0}

<script>
'use strict';
/* ===== Utilidades ===== */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS'}).format(n);
const fAR=iso=>iso.split('-').reverse().join('/');
const cuitF=c=>c.slice(0,2)+'-'+c.slice(2,10)+'-'+c.slice(10);
const uid=()=>Math.random().toString(36).slice(2,10);
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();

/* ===== Estados ===== */
const DOC={no_recibida:['No recibida','red'],recibida_fisica:['Recibida (papel)','grn'],recibida_digital:['Recibida (digital)','blu'],archivo_vinculado:['Archivo vinculado','teal'],pendiente_revision:['Pendiente de revisión','amb']};
const PROC={pendiente:['Pendiente','gry'],liquidado_con_documentacion:['Liquidado con factura','grn'],liquidado_sin_documentacion:['Liquidado SIN factura','org'],excluido:['Excluido','vio'],requiere_revision:['Requiere revisión','amb']};
const tag=(m,k)=>`<span class="tag" style="background:var(--${m[k][1]});color:var(--${m[k][1]}t)">${m[k][0]}</span>`;
function validar(doc,proc,motivo){
  if(proc==='liquidado_con_documentacion'&&doc==='no_recibida')return 'No puede estar "liquidado con factura" si la factura figura como no recibida.';
  if(proc==='excluido'&&!String(motivo||'').trim())return 'Para excluir un comprobante hay que indicar el motivo.';
  return null;

const ALIASES={fecha:['fecha','fecha de emision'],tipo:['tipo','tipo de comprobante'],pv:['punto de venta','pto vta'],numero:['numero desde','numero','nro comprobante'],cuit:['nro doc emisor','cuit emisor','cuit'],nombre:['denominacion emisor','razon social emisor','denominacion'],moneda:['moneda'],cambio:['tipo cambio','tipo de cambio'],total:['imp total','importe total','total'],neto:['neto gravado total','imp neto gravado','neto gravado'],nograv:['neto no gravado','imp neto no gravado'],exento:['op exentas','imp op exentas','operaciones exentas'],otros:['otros tributos'],iva:['total iva','iva','importe iva']};
const ALIAS_VENTAS={cuit:['nro doc receptor','cuit receptor'],nombre:['denominacion receptor','razon social receptor']};
const cabeceras=mode=>{const m=new Map();for(const[f,hs]of Object.entries(ALIASES))((mode==='ventas'&&ALIAS_VENTAS[f])||hs).forEach(h=>m.set(norm(h),f));return m};
const FBH=null;
const REQ=['fecha','tipo','pv','numero','cuit','total'];
function pNum(v){if(typeof v==='number')return isFinite(v)?v:null;let s=String(v??'').trim().replace(/\s|\$/g,'');if(!s)return null;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=Number(s);return isFinite(n)?n:null}
function vDate(y,m,d){const t=new Date(Date.UTC(y,m-1,d));return(t.getUTCFullYear()===y&&t.getUTCMonth()===m-1&&t.getUTCDate()===d)?t.toISOString().slice(0,10):null}
function pDate(v){if(typeof v==='number'&&v>20000&&v<80000)return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);const s=String(v??'').trim();let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return vDate(+m[3],+m[2],+m[1]);m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?vDate(+m[1],+m[2],+m[3]):null}
const pTipo=v=>{const m=String(v??'').trim().match(/^(\d{1,3})\b/);return m?+m[1]:null};
const pMon=v=>{const m=String(v??'').trim().toUpperCase();return(!m||m==='$'||m==='ARS')?'PES':(m==='USD'||m==='U$S')?'DOL':m};
function parseArca(rows,mode){
  mode=mode||'compras';const FBH=cabeceras(mode);let h=-1;
  for(let i=0;i<Math.min(rows.length,15);i++){const fs=new Set((rows[i]||[]).map(c=>FBH.get(norm(c))).filter(Boolean));if(REQ.every(r=>fs.has(r))){h=i;break}}
  if(h<0)return{ok:false,error:`No se reconoció el formato. Se esperan al menos las columnas: Fecha, Tipo, Punto de Venta, Número, ${mode==='ventas'?'Nro. Doc. Receptor':'Nro. Doc. Emisor'} e Imp. Total. ¿Es el Excel de "Mis Comprobantes ${mode==='ventas'?'Emitidos':'Recibidos'}"?`};
  const top=rows.slice(0,h).flat().map(c=>String(c??'')).join(' ');
  const meta={kind:/recibidos/i.test(top)?'recibidos':/emitidos/i.test(top)?'emitidos':null,cuit:(top.match(/CUIT\s*(\d{11})/i)||[])[1]||null};
  const heads=rows[h].map(x=>String(x??'').trim()),cf=heads.map(x=>FBH.get(norm(x))),rateCols=heads.map((x,i)=>/^iva \d/.test(norm(x))?i:-1).filter(i=>i>=0);
  const vs=[],errors=[],seen=new Set();let read=0,dupFile=0;
  for(let i=h+1;i<rows.length;i++){
    const r=rows[i];if(!r||r.every(c=>String(c??'').trim()===''))continue;read++;
    const f={},raw={};heads.forEach((n,c)=>{if(n)raw[n]=r[c]??null;if(cf[c])f[cf[c]]=r[c]});
    const fecha=pDate(f.fecha),tipo=pTipo(f.tipo),pv=pNum(f.pv),num=pNum(f.numero),tot=pNum(f.total),cuit=String(f.cuit??'').replace(/\D/g,'');
    const p=[];if(!fecha)p.push('fecha inválida');if(tipo===null)p.push('tipo inválido');if(pv===null||!Number.isInteger(pv))p.push('punto de venta inválido');
    if(num===null||!Number.isInteger(num)||num<0)p.push('número inválido');if(mode==='compras'&&cuit.length!==11)p.push('CUIT del emisor inválido');if(tot===null)p.push('importe inválido');
    if(p.length){errors.push({row:i+1,message:p.join(', ')});continue}
    const k=(mode==='ventas'?[tipo,pv,num]:[cuit,tipo,pv,num]).join('|');if(seen.has(k)){dupFile++;continue}seen.add(k);
    const nv=x=>pNum(f[x]);let iva=nv('iva');if(iva===null&&rateCols.length)iva=rateCols.reduce((a,c)=>a+(pNum(r[c])||0),0);
    // Moneda extranjera: ARCA informa los importes en la moneda original y el tipo de cambio aparte. Todo se guarda en PESOS.
    const mon=pMon(f.moneda),tc=pNum(f.cambio)??1,ext=mon!=='PES';
    if(ext&&!(tc>1)){errors.push({row:i+1,message:'comprobante en moneda extranjera ('+mon+') sin tipo de cambio: no se puede pasar a pesos'});continue}
    const cv=x=>(x===null||x===undefined||!ext)?x:Math.round((x*tc+Number.EPSILON)*100)/100;
    let rawF=raw;
    if(ext){rawF={};for(const [k,val] of Object.entries(raw))rawF[k]=(typeof val==='number'&&/^(Neto Grav\. IVA|IVA \d|Imp\. Total|Total IVA|Neto Gravado Total|Otros Tributos|Neto No Gravado|Op\. Exentas)/.test(k))?cv(val):val;
      rawF._moneda_original={moneda:mon,tipo_cambio:tc,importe_total:tot,neto_gravado:nv('neto'),no_gravado:nv('nograv'),exento:nv('exento'),otros_tributos:nv('otros'),iva,convertido_a_pesos:true}}
    vs.push({fecha,tipo_cmp:tipo,tipo_txt:String(f.tipo).trim(),punto_venta:pv,numero:num,emisor_cuit:cuit,emisor_nombre:f.nombre?String(f.nombre).trim():null,moneda:mon,tipo_cambio:tc,importe_total:cv(tot),neto_gravado:cv(nv('neto')),no_gravado:cv(nv('nograv')),exento:cv(nv('exento')),otros_tributos:cv(nv('otros')),iva:cv(iva),raw:rawF});
  }
  return{ok:true,meta,vs,errors,read,dupFile};
}
const vkey=v=>[v.emisor_cuit,v.tipo_cmp,v.punto_venta,v.numero].join('|');
function planImport(parsed,meta,existing,ctx){
  const pl={nuevos:[],repetidos:[],difs:[],fuera:[],bloqueos:[]};
  if(meta.cuit&&meta.cuit!==ctx.cuit)pl.bloqueos.push(`El archivo es del CUIT ${meta.cuit}, pero el cliente elegido tiene CUIT ${ctx.cuit}.`);
  const by=new Map(existing.map(e=>[vkey(e),e]));
  for(const v of parsed){
    if(!v.fecha.startsWith(ctx.periodo)){pl.fuera.push(v);continue}
    const e=by.get(vkey(v));if(!e){pl.nuevos.push(v);continue}
    const d=[e.fecha!==v.fecha&&`fecha ${fAR(e.fecha)} → ${fAR(v.fecha)}`,Math.abs(e.importe_total-v.importe_total)>0.005&&`importe ${e.importe_total} → ${v.importe_total}`].filter(Boolean).join('; ');
    d?pl.difs.push({v,motivo:d}):pl.repetidos.push(v);
  }
  return pl;
}

async function previsualizar(){
  const f=$('ifile').files[0],cid=$('icl').value,periodo=$('iper').value;ui.cid=cid;ui.periodo=periodo;
  const bad=m=>{flash(m,'err');draw()};
  {const ex=exentoMsg(cid);if(ex)return bad(ex)}
  if(!/^\d{4}-\d{2}$/.test(periodo))return bad('Elegí el período.');
  if(!f)return bad('Subí el archivo Excel.');
  if(!/\.xlsx?$/i.test(f.name))return bad('El archivo debe ser .xls o .xlsx.');
  if(f.size>10*1048576)return bad('El archivo supera los 10 MB.');
  if(typeof XLSX==='undefined')return bad('No se pudo cargar el lector de Excel (¿sin conexión a internet?).');
  let buf,rows;try{buf=await f.arrayBuffer();const wb=XLSX.read(buf,{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:null})}catch(e){return bad('No se pudo abrir el archivo: ¿está dañado?')}
  const r=parseArca(rows);if(!r.ok)return bad(r.error);
  if(r.meta.kind==='emitidos')return bad('Este Excel es de comprobantes EMITIDOS (ventas). Subilo en la sección Ventas.');
  const c=ui.clients.find(x=>x.id===cid);
  try{
    const ex=await fetchAll((a,b)=>sb.from('vouchers').select('emisor_cuit,tipo_cmp,punto_venta,numero,fecha,importe_total').eq('client_id',cid).range(a,b));
    ex.forEach(e=>{e.importe_total=Number(e.importe_total)});
    const hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',buf))].map(x=>x.toString(16).padStart(2,'0')).join('');
    ui.pend={cid,periodo,file:f.name,hash,r,plan:planImport(r.vs,r.meta,ex,{cuit:c.cuit,periodo})};
  }catch(e){flash(errTxt(e),'err')}
  draw();
}

function filtered(){

  if(f==='faltan')vs=vs.filter(v=>v.doc_status==='no_recibida');
  if(f==='fisica')vs=vs.filter(v=>v.doc_status==='recibida_fisica');

const RECIBIDOS=['recibida_fisica','recibida_digital'];
/** Aplica cambios agrupados por estado destino; registra recepción cuando corresponde. */
async function aplicarGrupos(targets){ // targets: [{v,doc,proc,motivo}]
  const groups=new Map();
  targets.forEach(t=>{const k=[t.doc,t.proc,t.proc==='excluido'?t.motivo:''].join('|');(groups.get(k)||groups.set(k,{doc:t.doc,proc:t.proc,motivo:t.proc==='excluido'?t.motivo:null,ids:[]}).get(k)).ids.push(t.v.id)});
  for(const g of groups.values()){
    const upd={doc_status:g.doc,proc_status:g.proc,proc_exclusion_reason:g.motivo,updated_by:me.id};
    if(RECIBIDOS.includes(g.doc))upd.received_at=new Date().toISOString();
    const {error}=await sb.from('vouchers').update(upd).in('id',g.ids);if(error)throw error;
    const nuevosRec=targets.filter(t=>g.ids.includes(t.v.id)&&RECIBIDOS.includes(g.doc)&&t.v.doc_status!==g.doc);
    if(nuevosRec.length){const {error:e2}=await sb.from('document_receipts').insert(nuevosRec.map(t=>({voucher_id:t.v.id,method:'manual',received_by:me.id})));if(e2)throw e2}
  }
}

async function compGuardarEdicion(e){
  e.preventDefault();const x=ui.vs.find(v=>v.id===ui.vedit),fd=new FormData(e.target),bad=m=>{flash(m,'err');draw();return false};if(!x)return false;
  const fecha=String(fd.get('fecha')),pv=pNum(fd.get('pv')),num=pNum(fd.get('num')),tipo=Number(fd.get('tipo')),cuit=String(fd.get('cuit')||'').replace(/\D/g,''),nom=String(fd.get('nom')||'').trim();

  if(!pDate(fecha))return bad('La fecha no es válida.');
  if(pv===null||!Number.isInteger(pv)||pv<0||num===null||!Number.isInteger(num)||num<=0)return bad('El punto de venta y el número tienen que ser enteros (el número mayor a cero).');

  const per=fecha.slice(0,7),raw={...(x.raw||{}),editado_a_mano:true};
  if(tipo!==Number(x.tipo_cmp)){raw['Tipo']=tipoNombre(tipo);delete raw['Tipo de Comprobante']}
  try{
    let pid=x.period_id;

const QRS={stream:null,on:false,raf:0,last:'',lastAt:0,list:[]};
function parseAfipQr(text){
  let p;try{p=new URL(String(text).trim()).searchParams.get('p')}catch(e){return{ok:false,error:'El código no es una URL; no parece un QR de factura electrónica.'}}
  if(!p)return{ok:false,error:'La URL no contiene el parámetro "p" de ARCA.'};
  let j;try{const b=p.replace(/-/g,'+').replace(/_/g,'/');j=JSON.parse(decodeURIComponent(escape(atob(b+'='.repeat((4-b.length%4)%4)))))}catch(e){return{ok:false,error:'No se pudo decodificar el contenido del QR.'}}
  const cuit=String(j.cuit??'').replace(/\D/g,'');
  if(cuit.length!==11||[j.fecha,j.ptoVta,j.tipoCmp,j.nroCmp,j.importe].some(v=>v==null))return{ok:false,error:'Al QR le faltan datos (CUIT, fecha, punto de venta, tipo, número o importe).'};
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(j.fecha)))return{ok:false,error:'Fecha del QR con formato inesperado.'};
  return{ok:true,data:{fecha:j.fecha,cuit,ptoVta:+j.ptoVta,tipoCmp:+j.tipoCmp,nroCmp:+j.nroCmp,importe:+j.importe,ctz:+(j.ctz??1),raw:j}};
}

function beep(ok){

async function pistaNoEncontrado(q){
  const base=`No figura entre los comprobantes importados (emisor ${cuitF(q.cuit)}, tipo ${q.tipoCmp}, N° ${nroF(q.ptoVta,q.nroCmp)}).`;
  const {data,error}=await sb.from('vouchers').select('tipo_cmp,punto_venta,numero').eq('emisor_cuit',q.cuit).limit(500);
  if(error||!data)return base;
  if(!data.length)return base+' Ese proveedor no aparece en ningún comprobante importado: puede que falte importar el Excel de ARCA del mes, o que la factura sea de un cliente al que no tenés acceso.';
  const igual=data.filter(d=>Number(d.numero)===q.nroCmp);
  if(igual.length)return base+` Hay comprobantes del mismo proveedor con ese número pero con otro tipo o punto de venta (${igual.map(d=>'tipo '+d.tipo_cmp+', pto. vta. '+d.punto_venta).join('; ')}). Revisalo en Comprobantes.`;
  return base+` El proveedor sí aparece (${data.length} comprobante(s) importados) pero no esta factura: puede que ARCA todavía no la tenga cargada o que falte importar el Excel actualizado.`;
}
async function handleQr(text){
  if(QRS.proc)return;QRS.proc=true;
  try{
    const r=parseAfipQr(text);
    if(!r.ok){beep(false);return setScan({k:'err',t:r.error,raw:String(text).slice(0,160)})}
    const q=r.data,S=o=>setScan({...o,leido:q});
    const {data,error}=await sb.from('vouchers').select('*, client_periods(periodo)').eq('emisor_cuit',q.cuit).eq('tipo_cmp',q.tipoCmp).eq('punto_venta',q.ptoVta).eq('numero',q.nroCmp);
    if(error){beep(false);return S({k:'err',t:errTxt(error)})}
    let hits=data;
    if(hits.length>1){const rc=String(q.raw.nroDocRec??'').replace(/\D/g,''),cl=ui.clients.find(c=>c.cuit===rc);hits=cl?hits.filter(h=>h.client_id===cl.id):[]}
    if(!hits.length){beep(false);return S({k:'warn',t:data.length>1?'Esa factura figura en más de un cliente y no se pudo decidir cuál es. Marcala a mano en Comprobantes.':await pistaNoEncontrado(q)})}
    const v=hits[0],cli=ui.clients.find(c=>c.id===v.client_id),d=[];
    if(v.fecha!==q.fecha)d.push(`Fecha: QR ${fAR(q.fecha)} vs ARCA ${fAR(v.fecha)}`);
    const imp=Number(v.importe_total);
    if(Math.abs(imp-q.importe)>0.01&&Math.abs(imp-q.importe*(q.ctz||1))>0.01)d.push(`Importe: QR ${money(q.importe)} vs ARCA ${money(imp)}`);
    if(v.doc_status!=='no_recibida'){beep(false);return S({k:'info',t:`Ya figuraba como "${DOC[v.doc_status][0]}". No se cambió nada.`,v,cli})}
    const o={k:d.length?'warn':'ok',t:d.length?'Se encontró el comprobante, pero hay diferencias:':'Comprobante encontrado.',v,q,d,cli,confirm:true,leido:q},auto=document.getElementById('auto');
    if(auto&&auto.checked&&!d.length){ui.scan=o;return await registrarQr()}
    setScan(o);
  }finally{QRS.proc=false}
}
async function registrarQr(){
  const s=ui.scan;if(!s||!s.confirm)return;const {v,q,d,cli}=s;
  try{
    const {data,error}=await sb.from('vouchers').update({doc_status:'recibida_fisica',received_at:new Date().toISOString(),updated_by:me.id}).eq('id',v.id).eq('doc_status','no_recibida').select('id');
    if(error)throw error;
    if(!data.length){beep(false);return setScan({k:'warn',t:'Otra persona ya registró este comprobante hace un instante. No se cambió nada.',v,cli})}
    const {error:e2}=await sb.from('document_receipts').insert({voucher_id:v.id,method:'qr',received_by:me.id,qr_payload:q.raw,match_result:d.length?'con_diferencias: '+d.join('; '):'coincidencia_unica'});
    if(e2)throw e2;

    const l=document.getElementById('scanres');if(l)l.insertAdjacentHTML('afterbegin',`<div class="msg ok"><b>Recibida y registrada.</b><br>${esc(cli?cli.razon_social:'')}: ${esc(v.emisor_nombre||'')}, ${nroF(v.punto_venta,v.numero)}. Podés escanear la siguiente.</div>`);
  }catch(e){beep(false);setScan({k:'err',t:errTxt(e)})}

async function startCam(){

  QRS.starting=false;

  if(!v||ui.tab!=='escanear'){stream.getTracks().forEach(t=>t.stop());return} /* se cambió de pantalla mientras se pedía el permiso */

/** Completa el selector de cámaras (después del permiso el navegador ya muestra sus nombres). */

function recibido(t){const now=Date.now();if(t!==QRS.last||now-QRS.lastAt>6000){QRS.last=t;QRS.lastAt=now;handleQr(t)}}
let _fr=0;
function scanLoop(){

      const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height);
      QRS.busy=true;
      (async()=>{let t=await zxDecode(x,0,0,c.width,c.height);if(!t){const im=x.getImageData(0,0,c.width,c.height),code=jsQR(im.data,c.width,c.height,{inversionAttempts:'dontInvert'});t=code&&code.data}if(t)recibido(t)})().catch(()=>{}).finally(()=>{QRS.busy=false});
    }
  }
  QRS.raf=requestAnimationFrame(scanLoop);
}
const pausa=()=>new Promise(r=>setTimeout(r,0));
const jsDecode=(ctx,x,y,w,h,inv)=>{const im=ctx.getImageData(x,y,w,h),c=jsQR(im.data,w,h,{inversionAttempts:inv?'attemptBoth':'dontInvert'});return c&&c.data||null};
function mosaicos(W,H,n){const tw=Math.round(W/n*1.5),th=Math.round(H/n*1.5),o=[];for(let j=0;j<n;j++)for(let i=0;i<n;i++)o.push([Math.min(W-tw,Math.round(i*(W-tw)/(n-1))),Math.min(H-th,Math.round(j*(H-th)/(n-1))),tw,th]);return o}
let _zxP=null;
/** ZXing (WebAssembly) es un extra opcional que se baja en segundo plano: si no hay internet, el lector incluido en el archivo (jsQR) funciona igual. */
function zxCargar(){
  if(typeof ZXingWASM!=='undefined')return Promise.resolve(true);
  return _zxP||(_zxP=Promise.race([cargarScript('https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.5/dist/iife/reader/index.js').then(()=>typeof ZXingWASM!=='undefined'),new Promise(r=>setTimeout(()=>r(false),8000))]).catch(()=>false).then(ok=>{if(!ok)_zxP=null;return ok}));
}
/** Lector rápido (ZXing en WebAssembly); si no cargó o falla, devuelve null y se usa el lector de respaldo. */
async function zxDecode(ctx,x,y,w,h){
  if(typeof ZXingWASM==='undefined')return null;
  try{const r=await ZXingWASM.readBarcodes(ctx.getImageData(x,y,w,h),{formats:['QRCode'],tryHarder:true,tryRotate:true,tryDownscale:true,maxNumberOfSymbols:1});return (r[0]&&r[0].text)||null}catch(e){return null}
}
/** Busca un QR en una imagen: detector nativo si existe; si no, jsQR en alta resolución y por zonas (el QR de ARCA es muy denso y se pierde al achicar la foto). */
async function qrDeImagen(bmp,progreso){
  if('BarcodeDetector' in window){try{const r=await new BarcodeDetector({formats:['qr_code']}).detect(bmp);if(r[0]&&r[0].rawValue)return r[0].rawValue}catch(e){}}
  await Promise.race([zxCargar(),new Promise(r=>setTimeout(r,3000))]);
  if(typeof jsQR==='undefined')throw new Error('El lector de QR no está disponible en este navegador.');
  const W0=bmp.width,H0=bmp.height,anchos=[...new Set([Math.min(W0,3200),Math.min(W0,1800)])];
  for(const w of anchos){
    const k=w/W0,cw=Math.round(W0*k),ch=Math.round(H0*k),c=document.createElement('canvas');c.width=cw;c.height=ch;
    const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(bmp,0,0,cw,ch);
    if(progreso)progreso(`Buscando el QR en la imagen (${w}px)…`);await pausa();
    let r=await zxDecode(x,0,0,cw,ch);if(r)return r;
    r=jsDecode(x,0,0,cw,ch,true);if(r)return r;
    for(const [tx,ty,tw,th] of mosaicos(cw,ch,3)){await pausa();r=jsDecode(x,tx,ty,tw,th,false);if(r)return r}
  }
  return null;
}
async function leerFoto(inp){
  const f=inp.files[0];if(!f)return;setScan({k:'info',t:'Leyendo la imagen…'});
  try{
    const bmp=await createImageBitmap(f),txt=await qrDeImagen(bmp,t=>setScan({k:'info',t}));inp.value='';
    if(!txt)return setScan({k:'warn',t:'No se encontró ningún QR en la imagen. Acercate hasta que el QR ocupe buena parte de la foto, con buena luz, sin reflejos ni sombras y bien enfocado. Si la foto sale borrosa, el QR de la factura no se puede leer.'});

  try{const d=await navigator.mediaDevices.enumerateDevices();L.push('Cámaras detectadas: '+d.filter(x=>x.kind==='videoinput').length)}catch(e){}
  L.push('Navegador: '+ua.slice(0,110));
  setScan({k:'info',t:'Diagnóstico de la cámara:',d:L});
}

/* ===== Lectura de la declaración jurada de IVA presentada (PDF) ===== */
const DDJJ_CAMPOS=[
  ['debito','Total del débito fiscal del período',/^total del debito fiscal/],
  ['credito','Total del crédito fiscal del período',/^total del credito fiscal/],
  ['st_anterior','Saldo técnico a favor del período anterior',/^saldo tecnico a favor del (contribuyente|responsable) del periodo anterior/],
  ['saldo_tecnico','Saldo técnico a favor del contribuyente (pasa al mes siguiente)',/^saldo tecnico a favor del (contribuyente|responsable)$/],
  ['st_arca','Saldo técnico a favor de ARCA',/^saldo tecnico a favor de (la )?(arca|afip)/],
  ['sl_anterior','Saldo de libre disponibilidad del período anterior',/^saldo a favor de libre disponibilidad del periodo anterior/],
  ['retenciones','Retenciones, percepciones y pagos a cuenta (neto)',/^total de retenciones.*pagos a cuenta/],
  ['reintegro','Retenciones agropecuarias reintegradas',/retenciones agropecuarias reintegrad/],
  ['saldo_libre','Saldo de libre disponibilidad del período (pasa al mes siguiente)',/^saldo de libre disponibilidad a favor del (contribuyente|responsable)/],
  ['a_pagar','Saldo a pagar a ARCA',/^(saldo|impuesto) (de impuesto )?(a favor de (la )?(arca|afip)|a ingresar)|^saldo a ingresar/]
];
const DDJJ_NOMBRE={IVA:'IVA',IIBB:'Ingresos Brutos'};
const ddjjMontos=t=>(String(t).match(/-?\d{1,3}(?:\.\d{3})*,\d{2}|-?\d+,\d{2}/g)||[]).map(x=>Number(x.replace(/\./g,'').replace(',','.')));
const ddjjEtiqueta=l=>liqNorm(l).replace(/\$?\s*-?\d[\d.]*,\d{2}/g,'').replace(/\s+/g,' ').replace(/[\s:$]+$/,'').trim();
const ddjjCuit=t=>{const m=String(t).match(/\b(\d{2})-?(\d{8})-?(\d)\b/);return m?m[1]+m[2]+m[3]:null};
/** Reconoce qué declaración es y trae los datos de cabecera para controlar que sea la del cliente y el período. */
function ddjjTipo(lineas){
  const L=(lineas||[]).map(x=>String(x)),T=liqNorm(L.join(' '));
  if(/f\.?\s?2051|impuesto al valor/.test(T)&&/determinacion del impuesto|posicion mensual/.test(T))return 'IVA';
  if(/ingresos brutos/.test(T)&&/cm03|convenio multilateral/.test(T))return 'IIBB_CM';
  if(/ingresos brutos/.test(T))return 'IIBB_LOCAL';
  return null;
}
function ddjjCabecera(lineas,tipo){
  const L=(lineas||[]).map(x=>String(x));let per=null,cuit=null,secuencia=null,estado=null;
  for(let i=0;i<L.length;i++){const l=L[i],n=liqNorm(l);
    if(!cuit){const c=ddjjCuit(l);if(c&&/cuit/.test(n+' '+liqNorm(L[i-1]||'')))cuit=c;else if(c&&i<6)cuit=c}
    if(!per){let m=null;if(tipo==='IVA'&&/periodo/.test(liqNorm(L[i-1]||''))||/anticipo\s*:?\s*20\d{4}|periodo\s*:?\s*20\d{4}/.test(n))m=l.match(/\b(20\d{2})(0[1-9]|1[0-2])\b/);if(m)per=m[1]+'-'+m[2]}
    if(!secuencia){const m=n.match(/\b(original|rectificativa)\b/);if(m)secuencia=m[1]}
    if(!estado){const m=n.match(/estado:?\s*(\w+)/);if(m)estado=m[1]}}
  return {per,cuit,secuencia,estado};
}
/** F.2051 (IVA): busca cada dato por su etiqueta exacta; si hay dos líneas iguales (determinación y posición mensual) toma la última. */
function ddjjIvaParse(lineas){
  const L=(lineas||[]).map(x=>String(x).replace(/\s+/g,' ').trim()).filter(Boolean),cand={};
  DDJJ_CAMPOS.forEach(([k,,re])=>{cand[k]=[];
    L.forEach((l,i)=>{const et=ddjjEtiqueta(l);if(!re.test(et))return;
      let m=ddjjMontos(l);if(!m.length&&L[i+1]&&!ddjjEtiqueta(L[i+1]))m=ddjjMontos(L[i+1]).slice(0,1);
      if(m.length)cand[k].push({txt:l.slice(0,90),monto:m[m.length-1]})})});
  const vals={};
  DDJJ_CAMPOS.forEach(([k])=>{const c=cand[k];vals[k]=c.length?c[c.length-1].monto:''});
  return {cand,vals};
}
/** CM03 (Convenio Multilateral): filas por jurisdicción con sus importes, en el orden impreso, y el total a pagar. */
function ddjjCmParse(lineas){
  const L=(lineas||[]).map(x=>String(x).replace(/\s+/g,' ').trim()).filter(Boolean),jur=[];let tot=null,aPagar=null,enc=null;
  L.forEach(l=>{const n=liqNorm(l);
    if(/jurisdiccion/.test(n)&&/anticipo|valores/.test(n))enc=l;
    const m=ddjjMontos(l);
    if(/^total a pagar/.test(n)&&m.length)aPagar=m[m.length-1];
    else if(/^totales\b/.test(n)&&m.length>=3)tot=m;
    else if(m.length>=3&&/^[A-ZÁÉÍÓÚÑ ().]+\s+\$/.test(l.replace(/\s+/g,' ')))jur.push({nombre:l.split('$')[0].trim(),importes:m})});
  return {jur,totales:tot,a_pagar:aPagar,encabezado:enc};
}
/** IIBB régimen local (SIFERE Locales): ingresos, actividades, liquidación y saldo. Se leen por etiqueta, no por posición. */
const DDJJ_LOCAL=[['ingresos_gravados','Ingresos gravados totales'],['ingresos_no_gravados','Ingresos no gravados totales'],['ingresos_exentos','Ingresos exentos'],['total_ingresos','Total ingresos'],['impuesto_determinado','Impuesto determinado'],['retenciones','Retenciones'],['percepciones','Percepciones'],['percepciones_aduaneras','Percepciones aduaneras'],['recaudaciones_bancarias','Recaudaciones bancarias'],['otros_creditos','Otros créditos'],['otros_debitos','Otros débitos'],['saldo_favor_anterior','Saldo a favor anticipo anterior'],['creditos_anticipo','Créditos del anticipo'],['intereses','Intereses y recargos'],['multas','Multas'],['a_favor','Total a favor del contribuyente']];
function ddjjLocalParse(lineas){
  const L=(lineas||[]).map(x=>String(x).replace(/\s+/g,' ').trim()).filter(Boolean),v={},act=[];
  const num=s=>Number(String(s).replace(/\./g,'').replace(',','.'));
  const par=(txt,etq)=>{const m=liqNorm(txt).match(new RegExp(etq+'\\s*:?\\s*\\$?\\s*(-?\\d{1,3}(?:\\.\\d{3})*,\\d{2}|-?\\d+,\\d{2})'));return m?num(m[1]):null};
  const T=L.join(' ');
  const E=[['ingresos_gravados','a\\) ingresos gravados totales'],['ingresos_exentos','c\\) ingresos exentos'],['ingresos_no_gravados','b\\) ingresos no gravados totales'],['total_ingresos','d\\) total ingresos \\(a\\+b\\+c\\)'],['retenciones','retenciones'],['percepciones','percepciones'],['percepciones_aduaneras','percepciones aduaneras'],['recaudaciones_bancarias','recaudaciones bancarias'],['otros_creditos','otros creditos'],['otros_debitos','otros debitos'],['saldo_favor_anterior','saldo a favor anticipo inmediato anterior'],['creditos_anticipo','creditos del anticipo'],['intereses','intereses y recargos'],['multas','multas']];
  E.forEach(([k,e])=>{const n=liqNorm(T);const re=new RegExp('(?:^|[^a-z])'+e+'\\s*:\\s*\\$?\\s*(-?\\d{1,3}(?:\\.\\d{3})*,\\d{2}|-?\\d+,\\d{2})');const m=n.match(re);if(m)v[k]=num(m[1])});
  // liquidación: tres importes bajo "Impuesto Calculado / Mínimo / Determinado"
  for(let i=0;i<L.length;i++){if(/impuesto calculado/.test(liqNorm(L[i]))&&/impuesto determinado/.test(liqNorm(L[i]))){const m=ddjjMontos(L[i+1]||'');if(m.length>=3){v.impuesto_calculado=m[0];v.impuesto_minimo=m[1];v.impuesto_determinado=m[2]}}
    if(/total a favor del contribuyente/.test(liqNorm(L[i]))&&/total a pagar/.test(liqNorm(L[i]))){const m=ddjjMontos(L[i+1]||'');if(m.length>=2){v.a_favor=m[m.length-2];v.a_pagar=m[m.length-1]}}}
  L.forEach(l=>{const m=l.match(/^(\d{6}) - (.+?)\s+(\d+) - (\S+?)\s+(\d+,\d{2})%/);if(m){const mo=ddjjMontos(l.slice(m[0].length));act.push({codigo:m[1],descripcion:m[2].trim(),tratamiento:m[3],porcentaje_exencion:num(m[5]),base:mo[0]??null,alicuota:mo[1]??null,impuesto:mo[2]??null,minimo:mo[3]??null})}
    else{const c=l.match(/^(\d{6}) - /);if(c){const n=ddjjMontos(l);act.push({codigo:c[1],descripcion:l.slice(0,60),base:n[0]??null,alicuota:null,impuesto:null,minimo:null,incompleta:true})}}});
  return {v,act};
}
/** Controla que la liquidación de IIBB local cierre: determinado + débitos − créditos = a pagar − a favor. */
function ddjjLocalCierra(v){
  const n=k=>Number(v[k])||0,cred=n('retenciones')+n('percepciones')+n('percepciones_aduaneras')+n('recaudaciones_bancarias')+n('otros_creditos')+n('saldo_favor_anterior')+n('creditos_anticipo'),sal=Math.round((n('impuesto_determinado')+n('otros_debitos')+n('intereses')+n('multas')-cred)*100)/100;
  return {esperado:sal,real:Math.round((n('a_pagar')-n('a_favor'))*100)/100,ok:Math.abs(sal-(n('a_pagar')-n('a_favor')))<0.02};
}
const ddjjCampos=imp=>imp==='IVA'?DDJJ_CAMPOS:[['a_pagar','Total a pagar',null]];
const ddjjVacio=(cid,per,imp)=>({cid,per,imp,cand:{},vals:Object.fromEntries(ddjjCampos(imp).map(([k])=>[k,''])),lineas:[],chequeos:[],jur:null,totales:null,encabezado:null});
/** Analiza las líneas de un PDF: devuelve los datos, los chequeos y si es seguro guardarlos sin revisión (ok). */
function ddjjAnalizar(lineas,cid,per,imp){
  const D=ddjjVacio(cid,per,imp),c=ui.clients.find(x=>x.id===cid),M=[];
  D.lineas=lineas;
  if(lineas.join('').replace(/\s/g,'').length<40){D.aviso='El PDF no tiene texto legible (puede ser una imagen). Cargá los datos a mano.';D.motivos=['PDF sin texto legible'];D.ok=false;return D}
  const tipo=ddjjTipo(lineas),cab=ddjjCabecera(lineas,tipo);D.tipo=tipo;
  if(imp==='IVA'){
    if(tipo!=='IVA'){D.aviso='Este PDF no parece la declaración jurada de IVA (F.2051). Revisá que sea el archivo correcto; igual podés cargar los datos a mano.';M.push('no parece una DDJJ de IVA (F.2051)')}
    else{const P=ddjjIvaParse(lineas);D.cand=P.cand;D.vals=P.vals;const v=P.vals;
      if(!Object.values(v).some(x=>x!==''))D.aviso='No reconocí ningún dato en este PDF.';
      ['debito','credito','saldo_tecnico','saldo_libre'].forEach(k=>{if(v[k]==='')M.push('falta '+k.replace('_',' '))});
      const n=k=>Number(v[k])||0;
      if(v.debito!==''&&v.credito!==''&&v.saldo_tecnico!==''){const esp=Math.max(0,n('st_anterior')+n('credito')-n('debito'));if(Math.abs(esp-n('saldo_tecnico'))>0.02)M.push('el saldo técnico no cierra con débito, crédito y saldo anterior')}
      if(v.saldo_libre!==''&&n('st_arca')===0&&v.sl_anterior!==''&&v.retenciones!==''){const esp=n('sl_anterior')+n('retenciones')-n('reintegro');if(Math.abs(esp-n('saldo_libre'))>0.02)M.push('el saldo de libre disponibilidad no cierra con sus componentes')}}
  }else{
    if(tipo==='IIBB_CM'){const P=ddjjCmParse(lineas);D.jur=P.jur;D.totales=P.totales;D.encabezado=P.encabezado;D.vals.a_pagar=P.a_pagar===null?'':P.a_pagar;if(P.a_pagar===null){D.aviso='No encontré el total a pagar.';M.push('falta el total a pagar')}if(!P.jur.length)M.push('no se leyeron jurisdicciones')}
    else if(tipo==='IIBB_LOCAL'){const P=ddjjLocalParse(lineas);D.local={...P.v,actividades:P.act};D.vals.a_pagar=P.v.a_pagar===undefined?'':P.v.a_pagar;
      if(P.v.a_pagar===undefined){D.aviso='No encontré el total a pagar.';M.push('falta el total a pagar')}
      else{if(P.v.impuesto_determinado===undefined)M.push('falta el impuesto determinado');if(!P.act.length)M.push('no se leyeron actividades');if(P.act.some(a=>a.incompleta))M.push('hay actividades que no pude leer completas');
        const c=ddjjLocalCierra(P.v);if(!c.ok)M.push(`la liquidación no cierra (da ${c.esperado.toFixed(2)} y la declaración dice ${c.real.toFixed(2)})`);
        const base=(Number(P.v.ingresos_gravados)||0)+(Number(P.v.ingresos_exentos)||0)+(Number(P.v.ingresos_no_gravados)||0);if(P.v.total_ingresos!==undefined&&Math.abs(base-P.v.total_ingresos)>0.02)M.push('los ingresos no suman el total')}}
    else{D.aviso='Este PDF no parece una declaración de Ingresos Brutos. Revisá que sea el archivo correcto.';M.push('no parece una DDJJ de Ingresos Brutos')}
  }
  const ch=[];
  if(cab.cuit&&c&&String(c.cuit||'').replace(/\D/g,'')&&cab.cuit!==String(c.cuit).replace(/\D/g,''))ch.push(`El CUIT del PDF (${cab.cuit}) no es el del cliente (${String(c.cuit).replace(/\D/g,'')}).`);
  if(!cab.cuit)M.push('no se encontró el CUIT');
  if(cab.per&&cab.per!==per)ch.push(`El período del PDF es ${cab.per.slice(5)}/${cab.per.slice(0,4)} y estás cargando ${per.slice(5)}/${per.slice(0,4)}.`);
  if(!cab.per)M.push('no se encontró el período');
  if(cab.secuencia&&cab.secuencia!=='original')ch.push('Es una declaración rectificativa: confirmá que sea la vigente.');
  D.chequeos=ch;D.motivos=[...ch.map(x=>x.replace(/\.$/,'')),...M];D.ok=D.motivos.length===0;return D;
}

  imp=imp||'IVA';ui.ddjj={...ddjjVacio(cid,per,imp),leyendo:true};draw();

async function ddjjLote(cid){
  if(ui.ddjjLote&&ui.ddjjLote.corriendo)return;
  const pend=ui.fil.filter(x=>(x.impuesto==='IVA'||x.impuesto==='IIBB')&&!(x.datos&&x.datos.ddjj)&&(!cid||x.client_id===cid)&&ui.ffil.some(f=>f.filing_id===x.id&&f.tipo==='PRESENTACION')).sort((a,b)=>a.periodo<b.periodo?-1:1);
  const L=ui.ddjjLote={corriendo:true,cancelar:false,total:pend.length,i:0,res:[],cid:cid||null};
  if(!pend.length){L.corriendo=false;draw();return}
  draw();
  for(const x of pend){
    if(L.cancelar)break;
    const cl=ui.clients.find(c=>c.id===x.client_id),per=x.periodo.slice(0,7),f=ui.ffil.find(z=>z.filing_id===x.id&&z.tipo==='PRESENTACION'),r={cid:x.client_id,nombre:cl?cl.razon_social:'(cliente)',imp:x.impuesto,per,archivo:f.nombre_archivo};
    try{
      const dl=await sb.storage.from('clientes').download(f.path);if(dl.error)throw dl.error;
      const D=ddjjAnalizar(Array.from(await pdfTexto(new File([dl.data],f.nombre_archivo||'ddjj.pdf',{type:'application/pdf'}))),x.client_id,per,x.impuesto);
      if(D.ok){
        const g={};ddjjCampos(x.impuesto).forEach(([k])=>{if(D.vals[k]!==''&&D.vals[k]!==undefined)g[k]=Number(D.vals[k])});
        if(x.impuesto==='IIBB'){if(D.tipo==='IIBB_LOCAL'){g.local=D.local;g.regimen='local'}else{g.jurisdicciones=D.jur;g.totales=D.totales;g.encabezado=D.encabezado;g.regimen='convenio'}}
        g.confirmado_at=new Date().toISOString();g.confirmado_por=me.id;g.fuente='pdf_lote';
        const u=await sb.from('tax_filings').update({datos:{...(x.datos||{}),ddjj:g},modificado_by:me.id,modificado_at:new Date().toISOString()}).eq('id',x.id);
        if(u.error)throw u.error;
        x.datos={...(x.datos||{}),ddjj:g};r.estado='guardado'
      }else{r.estado='revisar';r.motivo=D.motivos.join('; ')}
    }catch(e){r.estado='error';r.motivo=errTxt(e)}
    L.res.push(r);L.i++;if(L.i%3===0||L.i===L.total)draw();
  }
  L.corriendo=false;try{await loadFil()}catch(e){}
  draw();
}

async function subirDoc(e){
  e.preventDefault();const fd=new FormData(e.target),file=fd.get('archivo'),f=ui.ficha,bad=m=>{flash(m,'err');draw();return false};
  const ext=(String((file&&file.name)||'').split('.').pop()||'').toLowerCase();
  if(!file||!file.size)return bad('Elegí un archivo.');
  if(!EXT_MIME[ext])return bad('Formato no permitido. Usá PDF, JPG, PNG, Word o Excel.');
  if(file.size>15*1048576)return bad('El archivo supera los 15 MB.');
  const anio=String(fd.get('anio')||'').trim();if(anio&&!/^(19|20)\d{2}$/.test(anio))return bad('El año tiene que tener 4 dígitos, por ejemplo 2025.');
  const safe=file.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9._-]+/g,'_').slice(-80),path=`${f.id}/docs/${crypto.randomUUID()}-${safe}`;
  const up=await sb.storage.from('clientes').upload(path,file,{contentType:EXT_MIME[ext],upsert:false});
  if(up.error)return bad('No se pudo subir el archivo: '+errTxt(up.error));
  const {error}=await sb.from('client_documents').insert({client_id:f.id,categoria:fd.get('cat'),titulo:String(fd.get('titulo')).trim(),anio:anio?Number(anio):null,nombre_archivo:file.name,path,size_bytes:file.size,mime:EXT_MIME[ext],subido_by:me.id});
  if(error){await sb.storage.from('clientes').remove([path]);return bad(errTxt(error))}
  try{await recargarDocs();flash('Documento subido.')}catch(x){flash(errTxt(x),'err')}
  draw();return false;
}
async function recargarDocs(){const {data,error}=await sb.from('client_documents').select('*').eq('client_id',ui.ficha.id).order('subido_at',{ascending:false});if(error)throw error;ui.ficha.docs=data}
async function quitarDoc(id){
  const d=ui.ficha.docs.find(x=>x.id===id);if(!d||!confirm(`¿Quitar "${d.titulo}"? Se elimina el archivo.`))return;

function empDeArchivo(nombre,act){

    const {data,error}=await (s.editEmp?sb.from('employees').update(row).eq('id',s.editEmp).select('id'):sb.from('employees').insert(row).select('id'));
    if(error)return fail(/cuil_uniq|duplicate/i.test(error.message)?'Ya hay un empleado con ese CUIL en este cliente.':errTxt(error));

const MSG_PDF_EMP='Hola {nombre}, ¿cómo estás? Te enviamos el recibo de sueldo de {empleado} de {periodo}. Cualquier duda, avisanos. Estudio Theiler.';
const MSG_PDF_ADO='Hola {nombre}, ¿cómo estás? Te enviamos tu recibo de sueldo de {periodo} de {empleador}. Cualquier duda, avisanos. Estudio Theiler.';

/** Primer nombre para saludar al empleador: del contacto elegido o, si no hay, de la razón social ("Apellido, Nombre"). */
function sueSaludo(k,opt){
  if(opt&&opt.nombre)return String(opt.nombre).trim().split(/\s+/)[0];
  const rs=String(k.razon_social||'').trim();
  if(/\b(s\.?r\.?l\.?|s\.?a\.?|s\.?a\.?s\.?|s\.?c\.?a\.?|coop)\b/i.test(rs))return '';
  if(rs.includes(','))return rs.split(',')[1].trim().split(/\s+/)[0]||'';
  return rs.split(/\s+/)[0];
}
/** Completa un mensaje con los datos reales (o de muestra) del recibo. */
function sueArmar(tpl,d){
  let m=String(tpl||'').replace(/\{nombre\}/g,d.saludo||'').replace(/\{empleado\}/g,d.empleado).replace(/\{empleador\}/g,d.empleador).replace(/\{empresa\}/g,d.empleador).replace(/\{periodo\}/g,d.periodo).replace(/\{horas\}/g,d.horas);
  m=m.replace(/\{link\}/g,'');
  return m.replace(/ +,/g,',').replace(/Hola ,/g,'Hola,').replace(/[ \t]{2,}/g,' ').trim();
}

/** A quién se manda este recibo y por qué número. Devuelve la lista de destinos (empleador y/o empleado) con su estado. */
function sueTargets(k,e,ov){
  const pr=ui.sdAll.prof.find(p=>p.client_id===k.id&&p.tipo===e.tipo)||{};ov=ov||{};
  if(pr.recibos_no_envia)return {a:'ninguno',lista:[{rol:'-',ok:false,motivo:'La ficha dice que no se envían los recibos'}],opts:[]};
  const a=ov.a||pr.recibos_a||'empleador',lista=[],opts=sueOpcionesWa(k);
  if(a!=='empleado'){
    let sel=null;const pref=ov.num||pr.recibos_wa||'';
    if(pref){const w=waNum(pref);if(w&&w.ok){sel=opts.find(o=>o.num===w.num)||{num:w.num,raw:String(pref).trim(),nombre:'',cargo:'otro número'}}}
    if(!sel)sel=opts[0]||null;
    if(!sel&&pr.recibos_destino&&/^[\d\s+()\-.]+$/.test(pr.recibos_destino)){const w=waNum(pr.recibos_destino);if(w&&w.ok)sel={num:w.num,raw:pr.recibos_destino,nombre:'',cargo:'según la ficha'}}
    lista.push(sel?{rol:'empleador',ok:true,num:sel.num,quien:sueEtqWa(sel),saludo:sueSaludo(k,sel)}:{rol:'empleador',ok:false,motivo:'El empleador no tiene WhatsApp cargado (cargalo en Clientes o en su ficha de Sueldos)'})}
  if(a!=='empleador'){
    const w=waNum(e.whatsapp);
    lista.push(!e.whatsapp?{rol:'empleado',ok:false,motivo:'El empleado no tiene WhatsApp cargado'}:(!w||!w.ok)?{rol:'empleado',ok:false,motivo:'Revisá el WhatsApp del empleado'}:{rol:'empleado',ok:true,num:w.num,quien:e.whatsapp,saludo:String(e.nombre).trim().split(/\s+/)[0]})}

async function sueEnvPreparar(){

      +ivdNum(total,15)+ivdNum(nog,15)+ivdNum(0,15)+ivdNum(exe,15)+ivdNum(0,15)+ivdNum(0,15)+ivdNum(0,15)+ivdNum(0,15)+'PES'+'0001000000'+String(Math.min(reg.length,9))+op+ivdNum(otr,15)+'00000000');

/* ===== Compras: Excel para importar al sistema contable (estructura de columnas A a AD) ===== */
const CMP_COLS=['Fecha','Tipo de Comprobante','Número','Número Desde','Número Hasta','Cód. Autorización','Tipo Doc. Emisor','Nro. Doc. Emisor','Denominación Emisor','','','Tipo Cambio','Moneda','Neto Gravado IVA 0%','IVA 2.5%','Neto Gravado IVA 2.5%','IVA 5%','Neto Gravado IVA 5%','IVA 10.5%','Neto Gravado IVA 10.5%','IVA 21%','Neto Gravado IVA 21%','IVA 27%','Neto Gravado IVA 27%','Neto Gravado Total','Imp. Neto No Gravado','Op. Exentas','Otros Tributos','Total IVA','Total'];
/** Arma las filas a partir de los comprobantes de compra del período (ARCA + Libro IVA). Devuelve filas y avisos. */
function cmpArmar(vs){
  const avisos=[],filas=[],r2=n=>Math.round((Number(n)+Number.EPSILON)*100)/100,ab=n=>r2(Math.abs(Number(n)||0));
  let sinDesglose=0,noCierra=0,ext=0;
  const L=vs.filter(v=>v.proc_status!=='excluido').slice().sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha))||String(a.emisor_cuit).localeCompare(String(b.emisor_cuit))||(a.punto_venta-b.punto_venta)||(a.numero-b.numero));
  for(const v of L){
    const raw=v.raw||{},al=alicDeRaw(raw),neto=ab(v.neto_gravado),iva=ab(v.iva),nog=ab(v.no_gravado),exe=ab(v.exento),otr=ab(v.otros_tributos),tot=ab(v.importe_total);
    const g=k=>{const a=al[k];return a?{n:ab(a.neto),i:ab(a.iva)}:{n:0,i:0}};
    let t={'0':g('0'),'2.5':g('2.5'),'5':g('5'),'10.5':g('10.5'),'21':g('21'),'27':g('27')};
    const sn=Object.values(t).reduce((s,x)=>s+x.n,0);
    if(neto>0&&Math.abs(sn-neto)>1){ // sin desglose por alícuota: se deduce de neto e IVA
      const tasa=iva===0?0:liqTasa(neto,iva),k=tasa===null||tasa===undefined?null:String(tasa);
      if(k&&t[k]){t={'0':{n:0,i:0},'2.5':{n:0,i:0},'5':{n:0,i:0},'10.5':{n:0,i:0},'21':{n:0,i:0},'27':{n:0,i:0}};t[k]={n:neto,i:iva}}
      else{sinDesglose++;avisos.push(`${nroF(v.punto_venta,v.numero)} de ${v.emisor_nombre||v.emisor_cuit}: no se pudo repartir el neto por alícuota; quedó solo en "Neto Gravado Total".`)}
    }
    if(Math.abs(neto+nog+exe+otr+iva-tot)>1.5){noCierra++;avisos.push(`${nroF(v.punto_venta,v.numero)} de ${v.emisor_nombre||v.emisor_cuit}: el total no es igual a la suma de neto, no gravado, exento, otros tributos e IVA.`)}
    if(v.moneda&&v.moneda!=='PES')ext++;
    const ka=Object.keys(raw).find(k=>/^cod\.? autorizacion$/.test(norm(k))),tx=raw.Tipo||raw['Tipo de Comprobante'];
    const tipoTxt=tx&&/^\d+\s*-/.test(String(tx))?String(tx).trim():`${v.tipo_cmp} - ${tipoNombre(v.tipo_cmp)}`;
    const pv=String(v.punto_venta).padStart(5,'0'),nro=String(v.numero).padStart(8,'0');
    const cu=String(v.emisor_cuit||'').replace(/\D/g,'');
    filas.push([v.fecha,tipoTxt,`${pv}-${nro}`,v.numero,v.numero,ka&&raw[ka]!==null&&raw[ka]!==undefined?String(raw[ka]):'',cu.length===11?80:'',cu,v.emisor_nombre||'','','',1,'PES',
      t['0'].n,t['2.5'].i,t['2.5'].n,t['5'].i,t['5'].n,t['10.5'].i,t['10.5'].n,t['21'].i,t['21'].n,t['27'].i,t['27'].n,neto,nog,exe,otr,iva,tot]);
  }
  if(ext)avisos.unshift(`${ext} comprobante(s) están en moneda extranjera: se exportan en pesos (ya convertidos) con moneda PES y tipo de cambio 1.`);
  return {filas,avisos,sinDesglose,noCierra};
}
function comprasExportarExcel(){
  const v=ui.vs||[],c=ui.clients.find(x=>x.id===ui.cid);
  if(!v.length){flash('No hay comprobantes de compra en este período para exportar.','err');return draw()}

  ws['!cols']=CMP_COLS.map((h,i)=>({wch:i===1||i===8?30:i<8?16:14}));
  r.filas.forEach((_,i)=>{for(let col=11;col<30;col++){if(col===12)continue;const a=XLSX.utils.encode_cell({r:i+1,c:col});if(ws[a]&&typeof ws[a].v==='number')ws[a].z='#,##0.00'}});

  ui.cmpAvisos=r.avisos;
  const nom=String((c&&c.razon_social)||'cliente').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').slice(0,40);
  bajar({blob:new Blob([XLSX.write(wb,{type:'array',bookType:'xlsx'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),name:`Compras_importacion_${nom}_${ui.periodo}.xlsx`});

}

/* ---- Escritor ZIP en streaming, con partes si el archivo se vuelve enorme ---- */
class BkZip{
  constructor(destino,limite){this.dest=destino;this.limite=limite;this.parte=0;this.partes=[]}
  async _abrir(){this.parte++;this.w=await this.dest.abrirParte(this.parte);this.zip=new fflate.Zip();this.cola=Promise.resolve();this.bytes=0;this.err=null;this.ent=[];
    this.zip.ondata=(e,c)=>{if(e){this.err=e;return}this.bytes+=c.length;const w=this.w;this.cola=this.cola.then(()=>w.write(c))}}
  async _cerrar(){
    const idx=bkEnc.encode(JSON.stringify({parte:this.parte,entradas:this.ent},null,1));const nomIdx='indices/parte-'+bkPad(this.parte)+'.json';await this._txt(nomIdx,idx,false);
    const w=this.w;this.zip.end();await this.cola;if(this.err)throw this.err;await w.close();
    this.partes.push({parte:this.parte,nombre:w.nombre,bytes:this.bytes,entradas:this.ent.concat([{nombre:nomIdx,bytes:idx.length}]),leer:()=>w.leer()});}
  async iniciar(){await this._abrir()}
  async _rotar(){if(this.bytes>this.limite){await this._cerrar();await this._abrir()}}
  async _txt(nombre,u8,registrar){const f=new fflate.ZipDeflate(nombre,{level:6});this.zip.add(f);f.push(u8,true);await this.cola;if(this.err)throw this.err;if(registrar!==false)this.ent.push({nombre,bytes:u8.length})}
  async texto(nombre,txt){await this._rotar();await this._txt(nombre,bkEnc.encode(txt))}
  async flujo(nombre,gen,comprimir){
    await this._rotar();const f=comprimir?new fflate.ZipDeflate(nombre,{level:6}):new fflate.ZipPassThrough(nombre);this.zip.add(f);let total=0;
    for await(const ch of gen){const u=typeof ch==='string'?bkEnc.encode(ch):ch;total+=u.length;f.push(u,false);await this.cola;if(this.err)throw this.err}
    f.push(new Uint8Array(0),true);await this.cola;if(this.err)throw this.err;this.ent.push({nombre,bytes:total});return total}
  async finalizar(){await this._cerrar();return this.partes}
  async abortar(){try{await this.w.abort()}catch(e){}}
}

/* ---- Lectura del ZIP ya guardado: directorio central y prueba de lectura de entradas ---- */
async function bkLeerDirectorio(blob){
  const n=blob.size,buf=await blob.slice(Math.max(0,n-65557),n).arrayBuffer(),v=new DataView(buf);let i=buf.byteLength-22;
  for(;i>=0;i--)if(v.getUint32(i,true)===0x06054b50)break;
  if(i<0)throw new Error('No se encontró el final del ZIP: el archivo está incompleto');
  const total=v.getUint16(i+10,true),sz=v.getUint32(i+12,true),off=v.getUint32(i+16,true);
  if(total===0xFFFF||sz===0xFFFFFFFF||off===0xFFFFFFFF)throw new Error('ZIP64 no soportado por la verificación');
  const cd=await blob.slice(off,off+sz).arrayBuffer(),d=new DataView(cd),ents=[];let p=0;
  while(p<cd.byteLength&&d.getUint32(p,true)===0x02014b50){
    const metodo=d.getUint16(p+10,true),crc=d.getUint32(p+16,true),comp=d.getUint32(p+20,true),size=d.getUint32(p+24,true),nl=d.getUint16(p+28,true),el=d.getUint16(p+30,true),cl=d.getUint16(p+32,true),lh=d.getUint32(p+42,true);
    ents.push({nombre:new TextDecoder().decode(new Uint8Array(cd,p+46,nl)),bytes:size,comprimido:comp,crc,metodo,lh});p+=46+nl+el+cl}
  return {total,entradas:ents};
}
async function bkLeerEntrada(blob,e){
  const h=new DataView(await blob.slice(e.lh,e.lh+30).arrayBuffer());
  if(h.getUint32(0,true)!==0x04034b50)throw new Error('Encabezado dañado en '+e.nombre);
  const ini=e.lh+30+h.getUint16(26,true)+h.getUint16(28,true),raw=new Uint8Array(await blob.slice(ini,ini+e.comprimido).arrayBuffer());
  const datos=e.metodo===8?fflate.inflateSync(raw):raw;
  if(datos.length!==e.bytes)throw new Error('Tamaño distinto en '+e.nombre);
  if(bkCrc32(datos)!==e.crc)throw new Error('CRC distinto en '+e.nombre);
  return datos;
}
async function bkVerificarParte(p){
  const blob=await p.leer();
  if(blob.size!==p.bytes)throw new Error('La parte '+p.parte+' pesa '+blob.size+' bytes y se esperaban '+p.bytes);
  const dir=await bkLeerDirectorio(blob);
  if(dir.total!==p.entradas.length||dir.entradas.length!==p.entradas.length)throw new Error('La parte '+p.parte+' tiene '+dir.total+' elementos y se esperaban '+p.entradas.length);
  const por=new Map(dir.entradas.map(e=>[e.nombre,e]));
  for(const e of p.entradas){const x=por.get(e.nombre);if(!x)throw new Error('Falta en el ZIP: '+e.nombre);if(x.bytes!==e.bytes)throw new Error('Tamaño distinto en el ZIP: '+e.nombre)}
  // prueba de lectura real (descomprime y compara CRC) de hasta 4 elementos, incluido el índice de la parte
  const prueba=['indices/parte-'+bkPad(p.parte)+'.json',...dir.entradas.filter(e=>!e.nombre.startsWith('indices/')&&e.bytes>0).sort((a,b)=>a.bytes-b.bytes).slice(0,3).map(e=>e.nombre)];
  for(const nom of prueba)await bkLeerEntrada(blob,por.get(nom));
  return {elementos:dir.total,leidos:prueba.length};
}

  for(let off=0;off<pad;off+=64){
    for(let i=0;i<16;i++)w[i]=dv.getUint32(off+i*4);
    for(let i=16;i<64;i++){const a=w[i-15],b=w[i-2];w[i]=w[i-16]+(((a>>>7)|(a<<25))^((a>>>18)|(a<<14))^(a>>>3))+w[i-7]+(((b>>>17)|(b<<15))^((b>>>19)|(b<<13))^(b>>>10))}
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(let i=0;i<64;i++){const t1=(h+(((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)))+((e&f)^(~e&g))+BK_K[i]+w[i])>>>0,t2=((((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)))+((a&b)^(a&c)^(b&c)))>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0}
    H[0]+=a;H[1]+=b;H[2]+=c;H[3]+=d;H[4]+=e;H[5]+=f;H[6]+=g;H[7]+=h}
  return [...H].map(x=>x.toString(16).padStart(8,'0')).join('');
}
const bkSha=async u8=>(typeof crypto!=='undefined'&&crypto.subtle)?[...new Uint8Array(await crypto.subtle.digest('SHA-256',u8))].map(x=>x.toString(16).padStart(2,'0')).join(''):bkSha256js(u8);
function bkRefsUsuarios(ddl){const o=[],re=/alter table public\.(\w+) add constraint \S+ FOREIGN KEY \((\w+)\) REFERENCES (?:public\.)?profiles\(id\)/g;let m;while((m=re.exec(ddl)))if(m[1]!=='profiles')o.push({tabla:m[1],columna:m[2]});return o}

/* ---- Plan: qué se va a respaldar (solo lee y cuenta) ---- */
async function bkPlanificar(H){
  H.log('Pidiendo la estructura de la base…');
  const {data:esq,error}=await sb.rpc('backup_esquema');
  if(error){if(error.code==='42501'||/administradores/i.test(error.message||''))throw new Error('Tu usuario no es administrador: solo los administradores pueden generar backups.');
    if(/backup_esquema|schema cache|PGRST202/i.test(error.message||''))throw new Error('Falta instalar la función backup_esquema en la base de datos.');throw new Error('No se pudo leer la estructura: '+(error.message||error))}
  const tablas=[];let filas=0;
  for(const nombre of esq.orden){const n=await bkContar(nombre);tablas.push({nombre,filas:n});filas+=n;H.log('Tabla '+nombre+': '+n+' filas')}
  const archivos=[];
  for(const b of esq.buckets){H.log('Listando archivos de "'+b.id+'"…');const l=await bkListarArchivos(b.id);archivos.push(...l);H.log('Bucket '+b.id+': '+l.length+' archivos')}
  const bytes=archivos.reduce((a,x)=>a+x.size,0);
  return {esq,tablas,filas,archivos,bytesArchivos:bytes,creado:new Date()};
}

/* ---- Ejecución del backup ---- */
async function bkEjecutar(destino,plan,H){
  const t0=Date.now(),esq=plan.esq,meta=Object.fromEntries(esq.tablas.map(t=>[t.nombre,t]));
  const res={tablas:{},archivos:{ok:0,bytes:0,errores:[],indice:[]},avisos:[],partes:[],fatal:null};
  const z=new BkZip(destino,destino.limite),refsPath=new Set(),perfiles=[];
  const cancel=()=>{if(H.cancelado())throw Object.assign(new Error('Cancelado por el usuario'),{cancelado:true})};
  await z.iniciar();
  try{
    /* 1) estructura y configuración */
    H.paso('esquema','run');H.prog(2);
    const refs=bkRefsUsuarios(esq.ddl);
    await z.texto('LEEME.md',bkLeeme(plan,refs));
    await z.texto('sql/01_estructura.sql',esq.ddl);
    await z.texto('sql/02_almacenamiento.sql',esq.ddl_storage||'-- sin configuración de almacenamiento\n');
    await z.texto('sql/03_trigger_auth.sql',(esq.ddl_auth||'-- sin disparadores sobre auth.users\n'));
    let appHtml=null;try{const r=await fetch(location.href.split('#')[0],{cache:'no-store'});if(r.ok)appHtml=await r.text()}catch(e){}
    if(appHtml)await z.texto('app/index.html',appHtml);else res.avisos.push('No se pudo copiar el código de la aplicación (app/index.html). Está en tu repositorio de GitHub.');
    await z.texto('config/configuracion_no_secreta.json',JSON.stringify({formato:1,proyecto_url:(typeof SUPABASE_URL!=='undefined'?SUPABASE_URL:null),version_app:(typeof APP_VERSION!=='undefined'?APP_VERSION:null),postgres:esq.postgres,buckets:esq.buckets,tablas:esq.orden,estructura:esq.conteos,
      nota:'Esta copia no incluye claves de servicio, contraseñas ni tokens. La clave pública (publishable) que usa el navegador figura en app/index.html.'},null,2));
    H.paso('esquema','ok','Estructura: '+esq.conteos.tablas+' tablas, '+esq.conteos.politicas+' políticas, '+esq.conteos.funciones+' funciones');H.prog(5);cancel();

    /* 2) datos de todas las tablas */
    H.paso('datos','run');let hechas=0;
    for(let i=0;i<esq.orden.length;i++){
      const t=esq.orden[i],m=meta[t];cancel();
      const antes=await bkContar(t);let filas=0,sqlPartes=[],sqlBytes=0,sqlOk=true,primero=true;
      const gen=(async function*(){
        yield '[\n';
        for await(const pag of bkPaginas(t,m.pk)){
          cancel();yield (primero?'':',\n')+pag.map(r=>JSON.stringify(r)).join(',\n');primero=false;filas+=pag.length;hechas+=pag.length;
          if(m.columnas.some(c=>c.nombre==='path'))for(const r of pag)if(r.path)refsPath.add(r.path);
          if(t==='profiles')perfiles.push(...pag);
          if(t!=='profiles'&&sqlOk)for(let k=0;k<pag.length;k+=BK.LOTE_SQL){const s=bkInsert(t,m,pag.slice(k,k+BK.LOTE_SQL));sqlBytes+=s.length;if(sqlBytes>BK.SQL_MEM){sqlOk=false;sqlPartes=[];break}sqlPartes.push(s)}
          H.log('  '+t+': '+filas+' filas');H.prog(5+Math.round(20*hechas/Math.max(1,plan.filas)));
        }
        yield '\n]\n';
      })();
      const bytesJson=await z.flujo('datos/'+t+'.json',gen,true);
      const despues=await bkContar(t),lo=Math.min(antes,despues),hi=Math.max(antes,despues);
      let sqlEntrada=false;
      if(t!=='profiles'&&filas>0){
        if(sqlOk){await z.texto('sql/04_datos/'+bkPad(i+1)+'_'+t+'.sql','-- Datos de public.'+t+' ('+filas+' filas). Ejecutar con session_replication_role = replica (ver LEEME.md).\nset session_replication_role = replica;\n'+sqlPartes.join('\n')+'set session_replication_role = default;\n');sqlEntrada=true}
        else res.avisos.push('La tabla '+t+' es demasiado grande para generar SQL en el navegador: usar datos/'+t+'.json.');
      }
      res.tablas[t]={filas,antes,despues,bytes_json:bytesJson,sql:sqlEntrada,orden:i+1};
      if(filas<lo||filas>hi){res.avisos.push('Tabla '+t+': se exportaron '+filas+' filas pero la base tenía entre '+lo+' y '+hi+' (cambió durante el backup o hubo un problema de lectura).');res.tablas[t].inconsistente=true}
      H.paso('datos','run',(i+1)+' de '+esq.orden.length+' tablas');
    }
    const seqs=esq.tablas.flatMap(t=>t.columnas.filter(c=>c.identidad).map(c=>({t:t.nombre,c:c.nombre})));
    await z.texto('sql/06_secuencias.sql','-- Reajusta los contadores automáticos (identity) para que las filas nuevas no choquen con las restauradas.\n'+
      (seqs.length?seqs.map(x=>"select setval(pg_get_serial_sequence('public."+x.t+"', '"+x.c+"'), coalesce((select max(\""+x.c+"\") from public."+x.t+"), 1), (select max(\""+x.c+"\") is not null from public."+x.t+"));").join('\n')+'\n':'-- no hay contadores automáticos\n'));
    H.paso('datos',Object.values(res.tablas).some(x=>x.inconsistente)?'aviso':'ok',hechas+' filas en '+esq.orden.length+' tablas');H.prog(25);cancel();

    /* 3) usuarios (sin contraseñas: no se pueden exportar) */
    H.paso('usuarios','run');
    const usuarios=[];
    for(const p of perfiles){let email=null;if(p.username){try{const {data}=await sb.rpc('email_para_usuario',{u:p.username});if(data)email=data}catch(e){}}
      usuarios.push({id:p.id,username:p.username||null,email,full_name:p.full_name,role:p.role,active:p.active,all_clients:p.all_clients===true})}
    await z.texto('usuarios/usuarios.json',JSON.stringify(usuarios,null,2));
    await z.texto('sql/05_vincular_usuarios.sql',bkSqlVincular(usuarios,refs,meta));
    const sinEmail=usuarios.filter(u=>!u.email).length;
    if(sinEmail)res.avisos.push(sinEmail+' usuario(s) no tienen email conocido: hay que vincularlos a mano al restaurar.');
    H.paso('usuarios','ok',usuarios.length+' usuarios (sin contraseñas)');H.prog(27);cancel();

    /* 4) archivos de Storage */
    H.paso('archivos','run','0 de '+plan.archivos.length);
    const items=plan.archivos,cola=new Map(),descargar=async it=>{
      let ult;for(let n=0;n<3;n++){try{const {data,error}=await sb.storage.from(it.bucket).download(it.path);if(error)throw new Error(error.message||String(error));
        const u8=new Uint8Array(await data.arrayBuffer());if(it.size>0&&u8.length!==it.size)throw new Error('tamaño recibido '+u8.length+' distinto del esperado '+it.size);return {u8,sha:await bkSha(u8)}}
        catch(e){ult=e;await new Promise(ok=>setTimeout(ok,600*(n+1)))}}
      return {error:ult&&ult.message||'error desconocido'}};
    const sig=i=>{if(i<items.length&&!cola.has(i))cola.set(i,descargar(items[i]))};
    for(let i=0;i<Math.min(BK.CONC,items.length);i++)sig(i);
    let bytesHechos=0;
    for(let i=0;i<items.length;i++){
      cancel();const it=items[i],r=await cola.get(i);cola.delete(i);sig(i+BK.CONC);
      if(r.error){res.archivos.errores.push({ruta:it.bucket+'/'+it.path,motivo:r.error});H.log('  ERROR en un archivo ('+it.bucket+'): '+r.error,'err')}
      else{
        const ruta='archivos/'+it.bucket+'/'+it.path.replace(/^\/+/,'');
        await z.flujo(ruta,(async function*(){for(let k=0;k<r.u8.length;k+=1048576)yield r.u8.subarray(k,Math.min(r.u8.length,k+1048576));if(!r.u8.length)yield new Uint8Array(0)})(),false);
        res.archivos.ok++;res.archivos.bytes+=r.u8.length;res.archivos.indice.push({bucket:it.bucket,ruta:it.path,bytes:r.u8.length,sha256:r.sha,tipo:it.mime});
      }
      bytesHechos+=it.size;H.paso('archivos','run',(i+1)+' de '+items.length+' ('+bkMB(res.archivos.bytes)+')');
      H.prog(27+Math.round(63*(plan.bytesArchivos?bytesHechos/plan.bytesArchivos:(i+1)/items.length)));
    }
    await z.texto('archivos/_indice.json',JSON.stringify(res.archivos.indice,null,1));
    const sinRef=items.filter(x=>!refsPath.has(x.path)).length,faltan=[...refsPath].filter(p=>!items.some(x=>x.path===p)).length;
    res.archivos.sin_referencia=sinRef;res.archivos.referenciados_inexistentes=faltan;
    if(faltan)res.avisos.push(faltan+' archivo(s) están referenciados en las tablas pero no existen en Storage.');
    H.paso('archivos',res.archivos.errores.length?'aviso':'ok',res.archivos.ok+' archivos ('+bkMB(res.archivos.bytes)+')'+(res.archivos.errores.length?', '+res.archivos.errores.length+' con error':''));H.prog(90);cancel();

    /* 5) comprobación SQL y manifiesto */
    H.paso('cierre','run');
    await z.texto('sql/07_verificar.sql',bkSqlVerificar(res,esq));
    await z.texto('restaurar/aplicar_sql.sh',BK_APLICAR_SH);
    await z.texto('restaurar/subir_archivos.mjs',BK_SUBIR_MJS);
    const man={formato:1,generado:plan.creado.toISOString(),version_app:(typeof APP_VERSION!=='undefined'?APP_VERSION:null),
      tablas:Object.fromEntries(Object.entries(res.tablas).map(([k,v])=>[k,{filas:v.filas,filas_antes:v.antes,filas_despues:v.despues,sql:v.sql}])),
      archivos:{esperados:items.length,incluidos:res.archivos.ok,bytes:res.archivos.bytes,errores:res.archivos.errores,sin_referencia:sinRef,referenciados_inexistentes:faltan},
      estructura:esq.conteos,avisos:res.avisos,duracion_ms:Date.now()-t0,
      estado:res.archivos.errores.length||res.avisos.length?'completo_con_avisos':'completo'};
    await z.texto('manifest.json',JSON.stringify(man,null,2));
    const partes=await z.finalizar();res.partes=partes;
    H.paso('cierre','ok','ZIP cerrado: '+partes.length+(partes.length===1?' archivo':' partes'));H.prog(94);

    /* 6) verificación del ZIP guardado: se vuelve a abrir y se leen entradas de verdad */
    H.paso('verificar','run');res.verificacion=[];
    for(const p of partes){cancel();const v=await bkVerificarParte(p);res.verificacion.push({parte:p.parte,nombre:p.nombre,bytes:p.bytes,...v});H.log('Verificada '+p.nombre+': '+v.elementos+' elementos, '+v.leidos+' leídos y comprobados')}
    if(destino.entregar)for(const p of partes)await destino.entregar(p);
    H.paso('verificar','ok',partes.length+' archivo(s) comprobados');H.prog(100);
    res.duracion=Date.now()-t0;res.estado=man.estado;return res;
  }catch(e){
    await z.abortar();res.fatal=e;res.duracion=Date.now()-t0;res.estado=e.cancelado?'cancelado':'error';return res;
  }
}

/* ---- SQL de apoyo para restaurar ---- */
function bkSqlVincular(usuarios,refs,meta){
  const q=s=>s===null||s===undefined?'null':"'"+String(s).replace(/'/g,"''")+"'";
  const rolTipo=(meta.profiles&&meta.profiles.columnas.find(c=>c.nombre==='role')||{tipo:'text'}).tipo;
  let s='-- Vincula los usuarios NUEVOS (creados en Authentication con el mismo email) con los datos restaurados.\n-- Ejecutar DESPUÉS de cargar los datos (sql/04_datos) y antes de usar la aplicación.\nset session_replication_role = replica;\n'+
    'create temp table _mapa_usuarios (old_id uuid, email text, username text, full_name text, role text, active boolean, all_clients boolean);\n';
  if(usuarios.length)s+='insert into _mapa_usuarios values\n'+usuarios.map(u=>'  ('+[q(u.id),q(u.email),q(u.username),q(u.full_name),q(u.role),u.active===false?'false':'true',u.all_clients?'true':'false'].join(', ')+')').join(',\n')+';\n';
  s+="do $$ declare r record; begin for r in select m.* from _mapa_usuarios m left join auth.users u on lower(u.email) = lower(m.email) where u.id is null loop\n  raise notice 'FALTA crear el usuario % (email %): sus datos no se vincularán', r.username, coalesce(r.email,'sin email'); end loop; end $$;\n";
  s+='update public.profiles p set username = m.username, full_name = m.full_name, role = m.role::'+rolTipo+', active = m.active, all_clients = m.all_clients\n  from _mapa_usuarios m join auth.users u on lower(u.email) = lower(m.email) where p.id = u.id;\n';
  for(const r of refs)s+='update public.'+r.tabla+' t set '+r.columna+' = u.id from _mapa_usuarios m join auth.users u on lower(u.email) = lower(m.email) where t.'+r.columna+' = m.old_id and t.'+r.columna+' <> u.id;\n';
  return s+'set session_replication_role = default;\n';
}
function bkSqlVerificar(res,esq){
  let s='-- Compara las filas restauradas con las del backup. Todas las filas deben decir OK.\n';
  s+=esq.orden.map(t=>"select '"+t+"' as tabla, "+(res.tablas[t]?res.tablas[t].filas:0)+" as esperado, (select count(*) from public."+t+") as restauradas, case when (select count(*) from public."+t+") = "+(res.tablas[t]?res.tablas[t].filas:0)+" then 'OK' else 'REVISAR' end as estado").join('\nunion all\n')+'\norder by tabla;\n';
  return s;
}

const BK_APLICAR_SH=`#!/usr/bin/env bash
# Aplica los archivos SQL de esta copia, en orden, sobre la base indicada. Usar primero en un proyecto de PRUEBA.
# Uso: DB_URL="postgresql://postgres:CLAVE@HOST:5432/postgres" ./aplicar_sql.sh [estructura|datos|vincular]
set -euo pipefail
: "\${DB_URL:?Definí DB_URL con la cadena de conexión del proyecto NUEVO}"
cd "$(dirname "$0")/.."
run() { echo ">> $1"; psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$1"; }
case "\${1:-todo}" in
  estructura) run sql/01_estructura.sql; run sql/02_almacenamiento.sql; run sql/03_trigger_auth.sql ;;
  datos) for f in sql/04_datos/*.sql; do run "$f"; done; run sql/06_secuencias.sql ;;
  vincular) run sql/05_vincular_usuarios.sql ;;
  verificar) psql "$DB_URL" -f sql/07_verificar.sql ;;
  *) echo "Pasos: estructura -> (crear usuarios en Authentication) -> datos -> vincular -> verificar"; exit 1 ;;
esac
`;
const BK_SUBIR_MJS=`// Sube los archivos de esta copia (carpeta archivos/) a un proyecto de Supabase NUEVO.
// Requiere Node 18+. Las claves se pasan por variables de entorno y NO se guardan en ningún lado:
//   SUPABASE_URL=https://XXXX.supabase.co SUPABASE_SERVICE_KEY=... node subir_archivos.mjs
// Probar primero con un proyecto de prueba. Si algo falla, el archivo se informa y se sigue con el resto.
import { readFileSync, readdirSync, statSync } from 'node:fs';
import { join, dirname, relative } from 'node:path';
import { fileURLToPath } from 'node:url';
const URL_ = process.env.SUPABASE_URL, KEY = process.env.SUPABASE_SERVICE_KEY;
if (!URL_ || !KEY) { console.error('Faltan SUPABASE_URL y SUPABASE_SERVICE_KEY'); process.exit(1); }
const base = join(dirname(fileURLToPath(import.meta.url)), '..', 'archivos');
const tipos = { pdf: 'application/pdf', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', doc: 'application/msword', xls: 'application/vnd.ms-excel',
  docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' };
function* recorrer(d) { for (const n of readdirSync(d)) { const p = join(d, n); statSync(p).isDirectory() ? yield* recorrer(p) : yield p; } }
let ok = 0, mal = 0;
for (const f of recorrer(base)) {
  const rel = relative(base, f).split('\\\\').join('/');
  if (rel === '_indice.json') continue;
  const [bucket, ...resto] = rel.split('/'), ruta = resto.map(encodeURIComponent).join('/');
  const ext = rel.split('.').pop().toLowerCase();
  const r = await fetch(\`\${URL_}/storage/v1/object/\${encodeURIComponent(bucket)}/\${ruta}\`, { method: 'POST',
    headers: { Authorization: 'Bearer ' + KEY, apikey: KEY, 'x-upsert': 'true', 'Content-Type': tipos[ext] || 'application/octet-stream' }, body: readFileSync(f) });
  if (r.ok) ok++; else { mal++; console.error('ERROR', r.status, rel); }
}
console.log(\`Subidos: \${ok}. Con error: \${mal}.\`);
process.exit(mal ? 2 : 0);
`;

function bkLeeme(plan,refs){
  const f=plan.creado,fecha=bkPad(f.getDate())+'/'+bkPad(f.getMonth()+1)+'/'+f.getFullYear()+' '+bkPad(f.getHours())+':'+bkPad(f.getMinutes());
  return `# Copia de seguridad completa - Estudio Theiler

Generada el ${fecha} desde la aplicación (versión: ${typeof APP_VERSION!=='undefined'?APP_VERSION:'?'}).
Contenido esperado al momento de generar: ${plan.esq.conteos.tablas} tablas con ${plan.filas} filas, y ${plan.archivos.length} archivos (${bkMB(plan.bytesArchivos)}).
El resultado real (lo que efectivamente se guardó, errores y avisos) figura en **manifest.json**.

## IMPORTANTE: cuidá este archivo
- Contiene datos reales de clientes, empleados y documentos, **sin cifrar**. Guardalo en un disco externo de un lugar seguro, preferentemente cifrado (BitLocker, VeraCrypt) o comprimido con contraseña con 7-Zip (AES-256).
- No contiene claves de servicio, contraseñas ni tokens. Las contraseñas de los usuarios **no se pueden exportar**: al restaurar hay que asignarles una nueva.
- Si falla algo, el ZIP puede venir en varias partes (archivos "parteNN"). Extraelas todas en la misma carpeta.

## Qué hay adentro
- \`datos/*.json\`: todas las filas de cada tabla (copia completa de los datos).
- \`sql/\`: estructura de la base y los datos como SQL, listos para aplicar en orden.
- \`archivos/<bucket>/...\`: los archivos de Storage (PDF, imágenes, etc.) con su ruta original, e \`archivos/_indice.json\` con tamaño y SHA-256 de cada uno.
- \`usuarios/usuarios.json\`: usuarios (sin contraseñas) para volver a crearlos.
- \`app/index.html\` y \`config/\`: el código de la aplicación y la configuración no secreta.
- \`restaurar/\`: herramientas para restaurar. \`manifest.json\`: resumen y comprobaciones.

## Cómo restaurar (probalo SIEMPRE primero en un proyecto de prueba)
1. Creá un proyecto nuevo en Supabase (gratis). **No restaures sobre producción sin haber probado.** Una restauración sobre un proyecto con datos puede pisarlos.
2. Estructura: ejecutá en el SQL Editor (o con \`restaurar/aplicar_sql.sh estructura\`), en este orden: \`sql/01_estructura.sql\`, \`sql/02_almacenamiento.sql\` y \`sql/03_trigger_auth.sql\`.
3. Usuarios: en Authentication > Users creá cada usuario con el mismo email (ver \`usuarios/usuarios.json\`) y una contraseña nueva. Se crea solo su perfil.
4. Datos: ejecutá los archivos de \`sql/04_datos/\` en orden numérico y después \`sql/06_secuencias.sql\` (o simplemente \`aplicar_sql.sh datos\`, que hace todo). Usan \`session_replication_role = replica\`: si el editor de Supabase da error de permisos, usá psql (con \`aplicar_sql.sh\`).
5. Vinculá los usuarios: ejecutá \`sql/05_vincular_usuarios.sql\`. Reasigna los datos a las cuentas nuevas por email y avisa los usuarios que faltan crear.

function infNum(v){

function infGrafico(rows,titulo){
  const m=rows.filter(r=>r.tipo==='m'&&r.periodo).slice(0,24).reverse();if(m.length<2)return '';

  const y=v=>H-24-(Math.abs(v)/mx)*(H-50);
  const bar=(v,x,w,col)=>v===null||v===undefined?'':`<rect x="${x}" y="${y(v)}" width="${w}" height="${Math.max(1,H-24-y(v))}" fill="${col}" opacity=".9"><title>${esc(money(v))}</title></rect>`;
  const s=m.map((r,i)=>{const x=pad+i*bw,pg=r.pag===null?r.pagCta:r.pag;
    const sin=r.det===null&&pg===null&&!r.deuda;
    return (sin?`<text x="${x+bw/2}" y="${H-30}" text-anchor="middle" font-size="9" fill="#8896b3">s/i</text>`:bar(r.det,x+2,bw/2-2,'#5b7cff')+bar(pg,x+bw/2,bw/2-2,'#34d399'))+`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="9" fill="#8896b3">${r.periodo.slice(5,7)}/${r.periodo.slice(2,4)}</text>`}).join('');
  return `<h4>${esc(titulo)}</h4><svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px" role="img" aria-label="${esc(titulo)}">${s}</svg><div class="s"><span style="color:#5b7cff">■</span> Determinado · <span style="color:#34d399">■</span> Pagado · s/i = sin información cargada (distinto de un importe en cero)</div>`;

    if(esq==='ini_deb_cre_sal')[ini,deb,cre,sal]=n;else if(esq==='deb_cre_sal')[deb,cre,sal]=n;else if(esq==='deudor_acreedor')sal=balNumR(n[0]-n[1]);else if(esq==='sal')sal=n[0];else{deb=n[0];cre=n[1]}

/** Líneas de un extracto o mayor en PDF -> filas fecha / descripción / importe / saldo. El signo sale de la variación del saldo si el PDF lo trae. */
function balLineasAMovs(lineas){
  const rows=[['Fecha','Descripción','Importe','Saldo']],descartadas=[];let prev=null;
  lineas.forEach((l,i)=>{
    const m=String(l).trim().match(/^(\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4})\s+(.*)$/);if(!m){if(String(l).trim()&&/\d/.test(l))descartadas.push({linea:i+1,texto:l});return}
    const p=balLineaPartes(m[2]);if(!p.nums.length){descartadas.push({linea:i+1,texto:l});return}
    let imp,sal=null;
    if(p.nums.length>=2){sal=p.nums[p.nums.length-1];imp=p.nums[p.nums.length-2];if(prev!==null){const dv=balNumR(sal-prev);imp=Math.abs(Math.abs(dv)-Math.abs(imp))<0.011?dv:imp}}else imp=p.nums[0];
    if(sal!==null)prev=sal;rows.push([m[1],p.texto,imp,sal]);
  });
  return {rows,descartadas};
}
